    <rect x="0" y="0" width="396" height="32" rx="6" fill="#07090e" stroke="#202b3f" stroke-width="1" />
    <rect x="6" y="6" width="56" height="20" rx="4" fill="#202b3f" stroke="#334155" stroke-width="1" />
