<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#07090e" />
      <stop offset="100%" stop-color="#0c111e" />
    </linearGradient>

    <!-- Card Gradients -->
    <linearGradient id="odd-card" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#08281d" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#0a101f" stop-opacity="0.95" />
    </linearGradient>

    <linearGradient id="rdd-card" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#181738" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#0a101f" stop-opacity="0.95" />
    </linearGradient>

    <linearGradient id="edd-card" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2d1c08" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#0a101f" stop-opacity="0.95" />
    </linearGradient>

    <linearGradient id="tdd-card" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2d0818" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#0a101f" stop-opacity="0.95" />
    </linearGradient>

    <linearGradient id="sdd-card" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#082838" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#0a101f" stop-opacity="0.95" />
    </linearGradient>

    <filter id="soft-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000" flood-opacity="0.6" />
    </filter>

    <filter id="cyan-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .font-mono { font-family: 'JetBrains Mono', 'Fira Code', 'Courier New', monospace; }
    .font-sans { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    .title { font-size: 20px; font-weight: 800; letter-spacing: 1.5px; fill: #f8fafc; }
    .sub { font-size: 11px; font-weight: 600; letter-spacing: 1px; fill: #94a3b8; }
    .label { font-size: 11px; fill: #cbd5e1; }
  </style>

  <!-- Background Base -->
  <rect width="1200" height="750" fill="url(#bg-grad)" />

  <!-- Cyber Grid -->
  <g stroke="#202b3f" stroke-width="0.5" stroke-opacity="0.35">
    <line x1="0" y1="80" x2="1200" y2="80" />
    <line x1="0" y1="360" x2="1200" y2="360" />
    <line x1="240" y1="0" x2="240" y2="750" />
    <line x1="480" y1="0" x2="480" y2="750" />
    <line x1="720" y1="0" x2="720" y2="750" />
    <line x1="960" y1="0" x2="960" y2="750" />
  </g>

  <!-- Header Section -->
  <g transform="translate(60, 35)">
    <rect x="0" y="0" width="4" height="32" fill="#06b6d4" rx="2" />
    <text x="16" y="18" class="font-sans title">AGENT-HUB // DRIVEN-DEVELOPMENT ECOSYSTEM ARCHITECTURE</text>
    <text x="16" y="32" class="font-mono sub">ORGANIC (ODD) · RECEIPT (RDD) · EVIDENCE (EDD) · TEST (TDD) · SPEC (SDD)</text>
  </g>

  <!-- Central Flow Ribbon (7 Steps of ODD in AgentHub) -->
  <g transform="translate(60, 85)" filter="url(#soft-shadow)">
    <rect x="0" y="0" width="1080" height="52" rx="8" fill="#0a0e17" stroke="#202b3f" stroke-width="1.2" />
    
    <!-- 7 Step Node Icons -->
    <g transform="translate(20, 14)">
      <!-- 1 -->
      <circle cx="12" cy="12" r="11" fill="#f43f5e" fill-opacity="0.2" stroke="#f43f5e" stroke-width="1" />
      <text x="12" y="16" text-anchor="middle" class="font-mono" font-size="9" font-weight="700" fill="#fda4af">1</text>
      <text x="30" y="16" class="font-mono" font-size="9.5" font-weight="600" fill="#f8fafc">Authorize</text>

      <line x1="95" y1="12" x2="125" y2="12" stroke="#202b3f" stroke-width="1.5" />

      <!-- 2 -->
      <circle cx="140" cy="12" r="11" fill="#6366f1" fill-opacity="0.2" stroke="#6366f1" stroke-width="1" />
      <text x="140" y="16" text-anchor="middle" class="font-mono" font-size="9" font-weight="700" fill="#c7d2fe">2</text>
      <text x="158" y="16" class="font-mono" font-size="9.5" font-weight="600" fill="#f8fafc">Explore</text>

      <line x1="215" y1="12" x2="245" y2="12" stroke="#202b3f" stroke-width="1.5" />

      <!-- 3 -->
      <circle cx="260" cy="12" r="11" fill="#f59e0b" fill-opacity="0.2" stroke="#f59e0b" stroke-width="1" />
      <text x="260" y="16" text-anchor="middle" class="font-mono" font-size="9" font-weight="700" fill="#fde68a">3</text>
      <text x="278" y="16" class="font-mono" font-size="9.5" font-weight="600" fill="#f8fafc">Resolve</text>

      <line x1="335" y1="12" x2="365" y2="12" stroke="#202b3f" stroke-width="1.5" />

      <!-- 4 -->
      <circle cx="380" cy="12" r="11" fill="#06b6d4" fill-opacity="0.2" stroke="#06b6d4" stroke-width="1" />
      <text x="380" y="16" text-anchor="middle" class="font-mono" font-size="9" font-weight="700" fill="#67e8f9">4</text>
      <text x="398" y="16" class="font-mono" font-size="9.5" font-weight="600" fill="#f8fafc">Classify</text>

      <line x1="455" y1="12" x2="485" y2="12" stroke="#202b3f" stroke-width="1.5" />

      <!-- 5 -->
      <circle cx="500" cy="12" r="11" fill="#a855f7" fill-opacity="0.2" stroke="#a855f7" stroke-width="1" />
      <text x="500" y="16" text-anchor="middle" class="font-mono" font-size="9" font-weight="700" fill="#d8b4fe">5</text>
      <text x="518" y="16" class="font-mono" font-size="9.5" font-weight="600" fill="#f8fafc">Track</text>

      <line x1="565" y1="12" x2="595" y2="12" stroke="#202b3f" stroke-width="1.5" />

      <!-- 6 -->
      <circle cx="610" cy="12" r="11" fill="#10b981" fill-opacity="0.2" stroke="#10b981" stroke-width="1" />
      <text x="610" y="16" text-anchor="middle" class="font-mono" font-size="9" font-weight="700" fill="#6ee7b7">6</text>
      <text x="628" y="16" class="font-mono" font-size="9.5" font-weight="600" fill="#f8fafc">Implement</text>

      <line x1="700" y1="12" x2="730" y2="12" stroke="#202b3f" stroke-width="1.5" />

      <!-- 7 -->
      <circle cx="745" cy="12" r="11" fill="#38bdf8" fill-opacity="0.2" stroke="#38bdf8" stroke-width="1" />
      <text x="745" y="16" text-anchor="middle" class="font-mono" font-size="9" font-weight="700" fill="#bae6fd">7</text>
      <text x="763" y="16" class="font-mono" font-size="9.5" font-weight="600" fill="#f8fafc">Receipt (RDD)</text>
    </g>

    <text x="1050" y="32" text-anchor="end" class="font-mono" font-size="9" fill="#10b981">ODD CERTIFIED // AGENTHUB</text>
  </g>

  <!-- 5 Methodology Pillar Cards -->
  <g transform="translate(60, 155)" filter="url(#soft-shadow)">

    <!-- Card 1: ODD -->
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="200" height="490" rx="10" fill="url(#odd-card)" stroke="#10b981" stroke-width="1.2" stroke-opacity="0.6" />
      <rect x="0" y="0" width="200" height="40" rx="10" fill="#091b13" stroke="#10b981" stroke-width="1" stroke-opacity="0.4" />
      <text x="14" y="25" class="font-mono" font-size="11" font-weight="700" fill="#34d399">ODD · ORGANIC</text>

      <g transform="translate(14, 60)">
        <text x="0" y="0" class="font-mono" font-size="9" font-weight="600" fill="#6ee7b7">ADAPTACIÓN ORGÁNICA</text>
        <text x="0" y="16" class="font-sans label" font-size="10" fill="#94a3b8">
          <tspan x="0" dy="0">• Cero burocracia en</tspan>
          <tspan x="0" dy="14">cambios pequeños (Small).</tspan>
          <tspan x="0" dy="20">• Checklist en odd/tasks/</tspan>
          <tspan x="0" dy="14">para tareas grandes.</tspan>
          <tspan x="0" dy="20">• Preguntas interactivas</tspan>
          <tspan x="0" dy="14">antes de mutar código.</tspan>
          <tspan x="0" dy="20">• Sin quema inútil de</tspan>
          <tspan x="0" dy="14">tokens de contexto.</tspan>
        </text>

        <rect x="0" y="360" width="172" height="48" rx="6" fill="#060e0a" stroke="#10b981" stroke-width="0.8" />
        <text x="8" y="378" class="font-mono" font-size="8.5" fill="#34d399">Ideal: Día a día, refactors</text>
        <text x="8" y="394" class="font-mono" font-size="8.5" fill="#94a3b8">y bugs de cualquier escala.</text>
      </g>
    </g>

    <!-- Card 2: RDD -->
    <g transform="translate(220, 0)">
      <rect x="0" y="0" width="200" height="490" rx="10" fill="url(#rdd-card)" stroke="#6366f1" stroke-width="1.2" stroke-opacity="0.6" />
      <rect x="0" y="0" width="200" height="40" rx="10" fill="#111026" stroke="#6366f1" stroke-width="1" stroke-opacity="0.4" />
      <text x="14" y="25" class="font-mono" font-size="11" font-weight="700" fill="#818cf8">RDD · RECEIPT</text>

      <g transform="translate(14, 60)">
        <text x="0" y="0" class="font-mono" font-size="9" font-weight="600" fill="#a5b4fc">EVIDENCIA &amp; RECIBO</text>
        <text x="0" y="16" class="font-sans label" font-size="10" fill="#94a3b8">
          <tspan x="0" dy="0">• Cada turno entrega</tspan>
          <tspan x="0" dy="14">un comprobante inmutable.</tspan>
          <tspan x="0" dy="20">• Checkpoint Git hash</tspan>
          <tspan x="0" dy="14">y diff limpio garantizado.</tspan>
          <tspan x="0" dy="20">• Suite de tests pasada</tspan>
          <tspan x="0" dy="14">sin errores residuales.</tspan>
          <tspan x="0" dy="20">• Validación de contratos</tspan>
          <tspan x="0" dy="14">antes de ofrecer push.</tspan>
        </text>

        <rect x="0" y="360" width="172" height="48" rx="6" fill="#080714" stroke="#6366f1" stroke-width="0.8" />
        <text x="8" y="378" class="font-mono" font-size="8.5" fill="#a5b4fc">Ideal: PRs a producción,</text>
        <text x="8" y="394" class="font-mono" font-size="8.5" fill="#94a3b8">finanzas y alto riesgo.</text>
      </g>
    </g>

    <!-- Card 3: EDD -->
    <g transform="translate(440, 0)">
      <rect x="0" y="0" width="200" height="490" rx="10" fill="url(#edd-card)" stroke="#f59e0b" stroke-width="1.2" stroke-opacity="0.6" />
      <rect x="0" y="0" width="200" height="40" rx="10" fill="#1f1406" stroke="#f59e0b" stroke-width="1" stroke-opacity="0.4" />
      <text x="14" y="25" class="font-mono" font-size="11" font-weight="700" fill="#fbbf24">EDD · EVIDENCE</text>

      <g transform="translate(14, 60)">
        <text x="0" y="0" class="font-mono" font-size="9" font-weight="600" fill="#fde68a">CERO SUPOSICIONES</text>
        <text x="0" y="16" class="font-sans label" font-size="10" fill="#94a3b8">
          <tspan x="0" dy="0">• Prueba de reproducción</tspan>
          <tspan x="0" dy="14">antes de tocar el código.</tspan>
          <tspan x="0" dy="20">• Evidencia 1: Demuestra</tspan>
          <tspan x="0" dy="14">el fallo objetivamente.</tspan>
          <tspan x="0" dy="20">• Evidencia 2: Solución</tspan>
          <tspan x="0" dy="14">válida si apaga el fallo.</tspan>
          <tspan x="0" dy="20">• Evita loops ciegos de</tspan>
          <tspan x="0" dy="14">ensayo y error.</tspan>
        </text>

        <rect x="0" y="360" width="172" height="48" rx="6" fill="#120c04" stroke="#f59e0b" stroke-width="0.8" />
        <text x="8" y="378" class="font-mono" font-size="8.5" fill="#fde68a">Ideal: Bugs elusivos,</text>
        <text x="8" y="394" class="font-mono" font-size="8.5" fill="#94a3b8">concurrencia y leaks.</text>
      </g>
    </g>

    <!-- Card 4: TDD -->
    <g transform="translate(660, 0)">
      <rect x="0" y="0" width="200" height="490" rx="10" fill="url(#tdd-card)" stroke="#f43f5e" stroke-width="1.2" stroke-opacity="0.6" />
      <rect x="0" y="0" width="200" height="40" rx="10" fill="#200610" stroke="#f43f5e" stroke-width="1" stroke-opacity="0.4" />
      <text x="14" y="25" class="font-mono" font-size="11" font-weight="700" fill="#fda4af">TDD · TEST-DRIVEN</text>

      <g transform="translate(14, 60)">
        <text x="0" y="0" class="font-mono" font-size="9" font-weight="600" fill="#fecdd3">RED-GREEN-REFACTOR</text>
        <text x="0" y="16" class="font-sans label" font-size="10" fill="#94a3b8">
          <tspan x="0" dy="0">• Agente Tester redacta</tspan>
          <tspan x="0" dy="14">la suite en rojo primero.</tspan>
          <tspan x="0" dy="20">• Desarrollador escribe</tspan>
          <tspan x="0" dy="14">solo lo justo para verde.</tspan>
          <tspan x="0" dy="20">• Revisor audita la</tspan>
          <tspan x="0" dy="14">calidad de las aserciones.</tspan>
          <tspan x="0" dy="20">• Cobertura verificada</tspan>
          <tspan x="0" dy="14">sin código excedente.</tspan>
        </text>

        <rect x="0" y="360" width="172" height="48" rx="6" fill="#12040a" stroke="#f43f5e" stroke-width="0.8" />
        <text x="8" y="378" class="font-mono" font-size="8.5" fill="#fda4af">Ideal: Lógica de negocio,</text>
        <text x="8" y="394" class="font-mono" font-size="8.5" fill="#94a3b8">cálculos y APIs REST.</text>
      </g>
    </g>

    <!-- Card 5: SDD -->
    <g transform="translate(880, 0)">
      <rect x="0" y="0" width="200" height="490" rx="10" fill="url(#sdd-card)" stroke="#06b6d4" stroke-width="1.2" stroke-opacity="0.6" />
      <rect x="0" y="0" width="200" height="40" rx="10" fill="#061b24" stroke="#06b6d4" stroke-width="1" stroke-opacity="0.4" />
      <text x="14" y="25" class="font-mono" font-size="11" font-weight="700" fill="#67e8f9">SDD · SPEC-DRIVEN</text>

      <g transform="translate(14, 60)">
        <text x="0" y="0" class="font-mono" font-size="9" font-weight="600" fill="#a5f3fc">CONTRATO PRIMERO</text>
        <text x="0" y="16" class="font-sans label" font-size="10" fill="#94a3b8">
          <tspan x="0" dy="0">• Arquitecto redacta</tspan>
          <tspan x="0" dy="14">especificación formal.</tspan>
          <tspan x="0" dy="20">• Criterios Given/When/Then</tspan>
          <tspan x="0" dy="14">antes de codificar.</tspan>
          <tspan x="0" dy="20">• Aprobación explícita</tspan>
          <tspan x="0" dy="14">del usuario requerida.</tspan>
          <tspan x="0" dy="20">• Ideal para proyectos</tspan>
          <tspan x="0" dy="14">de gran envergadura.</tspan>
        </text>

        <rect x="0" y="360" width="172" height="48" rx="6" fill="#040f14" stroke="#06b6d4" stroke-width="0.8" />
        <text x="8" y="378" class="font-mono" font-size="8.5" fill="#67e8f9">Ideal: Nuevas arquitecturas,</text>
        <text x="8" y="394" class="font-mono" font-size="8.5" fill="#94a3b8">contratos y microservicios.</text>
      </g>
    </g>

  </g>

  <!-- Bottom Brand Certification Strip -->
  <g transform="translate(60, 700)">
    <line x1="0" y1="0" x2="1080" y2="0" stroke="#202b3f" stroke-width="1" />
    <text x="0" y="20" class="font-mono" font-size="10" fill="#64748b">AGENT-HUB DRIVEN DEVELOPMENTS // SPECIFICATION // STATUS: PRODUCTION CERTIFIED</text>
    <text x="1080" y="20" text-anchor="end" class="font-mono" font-size="10" fill="#06b6d4">PALETTE: #07090e · #0a0e17 · #202b3f · #06b6d4 · #10b981</text>
  </g>
</svg>