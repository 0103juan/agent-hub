<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" width="100%" height="100%" style="background:#07090e; font-family: Inter, system-ui, sans-serif;">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="mcpBg" cx="50%" cy="50%" r="75%">
      <stop offset="0%" stop-color="#1e1b4b" stop-opacity="0.35" />
      <stop offset="70%" stop-color="#0e131f" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#07090e" stop-opacity="1" />
    </radialGradient>

    <!-- Glowing Filters -->
    <filter id="mcpGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Gradients -->
    <linearGradient id="hubMesh" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>

    <!-- Pattern -->
    <pattern id="mcpGrid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#162035" stroke-width="1" stroke-opacity="0.5"/>
    </pattern>
  </defs>

  <rect width="800" height="420" fill="url(#mcpBg)"/>
  <rect width="800" height="420" fill="url(#mcpGrid)"/>

  <!-- Title & Header -->
  <g transform="translate(40, 36)">
    <rect width="32" height="32" rx="8" fill="#6366f1" fill-opacity="0.2" stroke="#818cf8" stroke-width="1.5"/>
    <!-- Wrench icon -->
    <path d="M 19 8 C 17 6 14 6 12 8 L 8 12 C 6 14 6 17 8 19 C 10 21 13 21 15 19 L 19 15 C 21 13 21 10 19 8 Z" fill="none" stroke="#a5b4fc" stroke-width="1.8"/>
    <text x="44" y="16" fill="#f3f6fc" font-size="14" font-weight="800" letter-spacing="0.04em">ARQUITECTURA DE MALLA MCP (MODEL CONTEXT PROTOCOL)</text>
    <text x="44" y="29" fill="#94a3b8" font-size="10" font-family="monospace">CONEXIÓN BIDIRECCIONAL · CLAUDE CODE + GOOGLE ANTIGRAVITY · HERRAMIENTAS Y RECURSOS</text>
  </g>

  <!-- Central Bridge (AgentHub MCP Bridge) -->
  <g transform="translate(400, 210)">
    <rect x="-115" y="-45" width="230" height="90" rx="14" fill="#0e131f" stroke="url(#hubMesh)" stroke-width="2" filter="url(#mcpGlow)"/>
    <circle cx="-80" cy="0" r="16" fill="#1e1b4b" stroke="#818cf8" stroke-width="1.5"/>
    <!-- Central chip icon -->
    <rect x="-86" y="-6" width="12" height="12" rx="2" fill="none" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="-52" y="-12" fill="#ffffff" font-size="12" font-weight="800">AGENTHUB MCP BRIDGE</text>
    <text x="-52" y="3" fill="#a5b4fc" font-size="9" font-family="monospace">SINCRONIZADOR UNIVERSAL</text>
    <text x="-52" y="18" fill="#34d399" font-size="9" font-mono="true">Claude ➔ Sync · Google ➔ Sync</text>
  </g>

  <!-- Left: AI Clients (Claude & Antigravity) -->
  <g transform="translate(60, 140)">
    <line x1="170" y1="40" x2="285" y2="70" stroke="#f97316" stroke-width="2" stroke-dasharray="4 4"/>
    <rect width="170" height="75" rx="10" fill="#0e131f" stroke="#ea580c" stroke-width="1.5"/>
    <rect x="12" y="12" width="24" height="24" rx="6" fill="#f97316" fill-opacity="0.2" stroke="#ea580c" stroke-width="1"/>
    <text x="24" y="28" text-anchor="middle" fill="#fdba74" font-size="13" font-weight="900">C</text>
    <text x="44" y="24" fill="#fdba74" font-size="11" font-weight="700">Claude Code</text>
    <text x="44" y="36" fill="#94a3b8" font-size="9" font-family="monospace">claude.json</text>
    <text x="14" y="58" fill="#64748b" font-size="9">Inyección de herramientas</text>
  </g>

  <g transform="translate(60, 240)">
    <line x1="170" y1="35" x2="285" y2="-30" stroke="#38bdf8" stroke-width="2" stroke-dasharray="4 4"/>
    <rect width="170" height="75" rx="10" fill="#0e131f" stroke="#2563eb" stroke-width="1.5"/>
    <rect x="12" y="12" width="24" height="24" rx="6" fill="#38bdf8" fill-opacity="0.2" stroke="#2563eb" stroke-width="1"/>
    <polygon points="24,18 26,22 30,24 26,26 24,30 22,26 18,24 22,22" fill="#38bdf8"/>
    <text x="44" y="24" fill="#93c5fd" font-size="11" font-weight="700">Antigravity</text>
    <text x="44" y="36" fill="#94a3b8" font-size="9" font-family="monospace">mcp_servers</text>
    <text x="14" y="58" fill="#64748b" font-size="9">Lazy tools + Native bindings</text>
  </g>

  <!-- Right: Connected MCP Servers -->

  <!-- 1. Filesystem & Git (Local Stdio) -->
  <g transform="translate(560, 90)">
    <line x1="-45" y1="35" x2="-45" y2="85" stroke="#10b981" stroke-width="1.5"/>
    <line x1="-45" y1="85" x2="-145" y2="120" stroke="#10b981" stroke-width="1.5" stroke-dasharray="3 3"/>
    <rect width="180" height="65" rx="10" fill="#0e131f" stroke="#10b981" stroke-width="1.5" stroke-opacity="0.8"/>
    <circle cx="20" cy="22" r="4" fill="#34d399"/>
    <text x="32" y="25" fill="#a7f3d0" font-size="11" font-weight="700">filesystem</text>
    <rect x="110" y="14" width="56" height="16" rx="4" fill="#10b981" fill-opacity="0.15"/>
    <text x="138" y="25" text-anchor="middle" fill="#34d399" font-size="8" font-family="monospace" font-weight="700">STDIO</text>
    <text x="16" y="48" fill="#64748b" font-size="9">read_file, write_file, edit_file</text>
  </g>

  <!-- 2. Database: Postgres & BigQuery -->
  <g transform="translate(560, 175)">
    <line x1="-45" y1="35" x2="-45" y2="35" stroke="#38bdf8" stroke-width="1.5"/>
    <line x1="-45" y1="35" x2="-145" y2="35" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="3 3"/>
    <rect width="180" height="65" rx="10" fill="#0e131f" stroke="#0284c7" stroke-width="1.5" stroke-opacity="0.8"/>
    <circle cx="20" cy="22" r="4" fill="#38bdf8"/>
    <text x="32" y="25" fill="#bae6fd" font-size="11" font-weight="700">postgres / bigquery</text>
    <rect x="110" y="14" width="56" height="16" rx="4" fill="#0284c7" fill-opacity="0.15"/>
    <text x="138" y="25" text-anchor="middle" fill="#38bdf8" font-size="8" font-family="monospace" font-weight="700">STDIO</text>
    <text x="16" y="48" fill="#64748b" font-size="9">query, execute_sql, explain</text>
  </g>

  <!-- 3. Web & Browser: Playwright (SSE/HTTP) -->
  <g transform="translate(560, 260)">
    <line x1="-45" y1="35" x2="-45" y2="-15" stroke="#a855f7" stroke-width="1.5"/>
    <line x1="-45" y1="-15" x2="-145" y2="-50" stroke="#a855f7" stroke-width="1.5" stroke-dasharray="3 3"/>
    <rect width="180" height="65" rx="10" fill="#0e131f" stroke="#7e22ce" stroke-width="1.5" stroke-opacity="0.8"/>
    <circle cx="20" cy="22" r="4" fill="#c084fc"/>
    <text x="32" y="25" fill="#e9d5ff" font-size="11" font-weight="700">playwright</text>
    <rect x="110" y="14" width="56" height="16" rx="4" fill="#7e22ce" fill-opacity="0.15"/>
    <text x="138" y="25" text-anchor="middle" fill="#c084fc" font-size="8" font-family="monospace" font-weight="700">BROWSER</text>
    <text x="16" y="48" fill="#64748b" font-size="9">browser_navigate, snapshot</text>
  </g>

  <!-- 4. Memory & Knowledge Graph -->
  <g transform="translate(560, 340)">
    <rect width="180" height="55" rx="10" fill="#0e131f" stroke="#f59e0b" stroke-width="1.5" stroke-opacity="0.8"/>
    <circle cx="20" cy="22" r="4" fill="#fbbf24"/>
    <text x="32" y="25" fill="#fde68a" font-size="11" font-weight="700">memory / jira / github</text>
    <text x="16" y="44" fill="#64748b" font-size="9">create_entities, issues, prs</text>
  </g>
</svg>
