<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#07090e" />
      <stop offset="50%" stop-color="#0a0e17" />
      <stop offset="100%" stop-color="#0e131f" />
    </linearGradient>

    <linearGradient id="panelGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#131927" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#0b101b" stop-opacity="0.9" />
    </linearGradient>

    <linearGradient id="accentIndigo" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>

    <linearGradient id="accentCyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>

    <linearGradient id="accentEmerald" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>

    <filter id="glowIndigo" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.6" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="960" height="480" fill="url(#bgGrad)" />
  <rect width="960" height="480" fill="none" stroke="#202b3f" stroke-width="1.5" />

  <!-- Grid lines -->
  <g stroke="#161f30" stroke-width="1" stroke-dasharray="3,3">
    <line x1="40" y1="80" x2="920" y2="80" />
    <line x1="40" y1="420" x2="920" y2="420" />
    <line x1="280" y1="80" x2="280" y2="420" />
    <line x1="620" y1="80" x2="620" y2="420" />
  </g>

  <!-- Header -->
  <g transform="translate(40, 32)">
    <rect width="36" height="36" rx="8" fill="#1e1b4b" stroke="#6366f1" stroke-width="1.5" />
    <path d="M12 18h12M12 14h8M12 22h6" stroke="#818cf8" stroke-width="2" stroke-linecap="round" />
    <text x="48" y="24" fill="#f8fafc" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="17" font-weight="800" letter-spacing="-0.02em">
      ARQUITECTURA DE SESIONES, FLUJOS Y SQUADS
    </text>
    <text x="48" y="40" fill="#94a3b8" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="11">
      Jerarquía de proyectos, agrupamiento dinámico por flow y panel táctico SessionDrawer
    </text>
    <rect x="760" y="8" width="120" height="24" rx="12" fill="#131927" stroke="#202b3f" />
    <circle cx="774" cy="20" r="4" fill="#10b981" />
    <text x="784" y="24" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="10">ACTIVO v2.5</text>
  </g>

  <!-- Column 1: Proyectos y Entornos -->
  <g transform="translate(40, 95)" filter="url(#cardShadow)">
    <rect width="210" height="305" rx="12" fill="url(#panelGrad)" stroke="#202b3f" stroke-width="1.2" />
    <rect width="210" height="36" rx="12" fill="#151d2e" />
    <path d="M0 24h210" stroke="#202b3f" stroke-width="1" />
    <circle cx="20" cy="18" r="4" fill="#6366f1" />
    <text x="32" y="22" fill="#e2e8f0" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="700">1. Proyectos Locales</text>

    <!-- Project Items -->
    <g transform="translate(14, 50)">
      <!-- Item 1 -->
      <rect width="182" height="48" rx="8" fill="#090d16" stroke="#3730a3" stroke-width="1" />
      <text x="12" y="22" fill="#ffffff" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="600">portafolio/agent-hub</text>
      <text x="12" y="38" fill="#818cf8" font-family="'JetBrains Mono', monospace" font-size="10">8 sesiones · activo</text>
      <circle cx="168" cy="24" r="5" fill="#10b981" />

      <!-- Item 2 -->
      <g transform="translate(0, 60)">
        <rect width="182" height="48" rx="8" fill="#090d16" stroke="#202b3f" stroke-width="1" />
        <text x="12" y="22" fill="#cbd5e1" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="600">finesa-finanzas</text>
        <text x="12" y="38" fill="#64748b" font-family="'JetBrains Mono', monospace" font-size="10">4 sesiones · rama main</text>
      </g>

      <!-- Item 3 -->
      <g transform="translate(0, 120)">
        <rect width="182" height="48" rx="8" fill="#090d16" stroke="#202b3f" stroke-width="1" />
        <text x="12" y="22" fill="#cbd5e1" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="600">Sin proyecto (libre)</text>
        <text x="12" y="38" fill="#64748b" font-family="'JetBrains Mono', monospace" font-size="10">2 sesiones rápidas</text>
      </g>

      <!-- Quick Action -->
      <g transform="translate(0, 185)">
        <rect width="182" height="34" rx="6" fill="#1e1b4b" stroke="#4f46e5" stroke-width="1" stroke-dasharray="2,2" />
        <text x="36" y="22" fill="#a5b4fc" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="600">+ Nuevo Proyecto</text>
      </g>
    </g>
  </g>

  <!-- Connect 1 -> 2 -->
  <path d="M250 170 L290 170" stroke="#6366f1" stroke-width="2" stroke-dasharray="4,4" />
  <polygon points="292,170 286,166 286,174" fill="#6366f1" />

  <!-- Column 2: groupByFlow & Squads -->
  <g transform="translate(295, 95)" filter="url(#cardShadow)">
    <rect width="300" height="305" rx="12" fill="url(#panelGrad)" stroke="#202b3f" stroke-width="1.2" />
    <rect width="300" height="36" rx="12" fill="#151d2e" />
    <path d="M0 24h300" stroke="#202b3f" stroke-width="1" />
    <circle cx="20" cy="18" r="4" fill="#06b6d4" />
    <text x="32" y="22" fill="#e2e8f0" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="700">2. Agrupación por Flujo (groupByFlow)</text>

    <!-- Squad Flow Box -->
    <g transform="translate(14, 48)">
      <rect width="272" height="150" rx="8" fill="#070a12" stroke="#0891b2" stroke-width="1.2" />
      <rect width="272" height="28" rx="8" fill="#083344" />
      <circle cx="16" cy="14" r="3.5" fill="#38bdf8" />
      <text x="28" y="18" fill="#e0f2fe" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="700">Squad: Rediseño Interfaz HUD</text>
      <text x="216" y="18" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="9">3 MIEMBROS</text>

      <!-- Member 1: Arquitecto -->
      <g transform="translate(10, 36)">
        <rect width="252" height="32" rx="6" fill="#111827" stroke="#202b3f" />
        <rect x="8" y="8" width="60" height="16" rx="4" fill="#7c3aed" fill-opacity="0.2" stroke="#a78bfa" stroke-width="0.8" />
        <text x="14" y="20" fill="#ddd6fe" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="700">ARQUITECTO</text>
        <text x="76" y="20" fill="#f1f5f9" font-family="'Plus Jakarta Sans', sans-serif" font-size="11">Especificación técnica</text>
      </g>

      <!-- Member 2: Diseñador (Active) -->
      <g transform="translate(10, 72)">
        <rect width="252" height="32" rx="6" fill="#1e1b4b" stroke="#6366f1" stroke-width="1.2" />
        <rect x="8" y="8" width="64" height="16" rx="4" fill="#ec4899" fill-opacity="0.2" stroke="#f472b6" stroke-width="0.8" />
        <text x="14" y="20" fill="#fbcfe8" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="700">DISEÑADOR</text>
        <text x="80" y="20" fill="#ffffff" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="600">SessionDrawer HUD</text>
        <circle cx="236" cy="16" r="4" fill="#10b981" />
      </g>

      <!-- Member 3: Desarrollador -->
      <g transform="translate(10, 108)">
        <rect width="252" height="32" rx="6" fill="#111827" stroke="#202b3f" />
        <rect x="8" y="8" width="80" height="16" rx="4" fill="#2563eb" fill-opacity="0.2" stroke="#60a5fa" stroke-width="0.8" />
        <text x="14" y="20" fill="#bfdbfe" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="700">DESARROLLADOR</text>
        <text x="96" y="20" fill="#f1f5f9" font-family="'Plus Jakarta Sans', sans-serif" font-size="11">Unit tests &amp; react</text>
      </g>
    </g>

    <!-- Loose Chats Box -->
    <g transform="translate(14, 210)">
      <rect width="272" height="74" rx="8" fill="#090d16" stroke="#202b3f" />
      <text x="12" y="18" fill="#94a3b8" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="600">CHATS SUELTOS (INDIVIDUALES)</text>
      
      <g transform="translate(10, 26)">
        <rect width="252" height="36" rx="6" fill="#111827" stroke="#1f293d" />
        <text x="10" y="22" fill="#cbd5e1" font-family="'Plus Jakarta Sans', sans-serif" font-size="11">Consulta de API Stripe</text>
        <text x="190" y="22" fill="#64748b" font-family="'JetBrains Mono', monospace" font-size="10">hace 3h</text>
      </g>
    </g>
  </g>

  <!-- Connect 2 -> 3 -->
  <path d="M595 170 L635 170" stroke="#06b6d4" stroke-width="2" stroke-dasharray="4,4" />
  <polygon points="637,170 631,166 631,174" fill="#06b6d4" />

  <!-- Column 3: Drawer UI & State Management -->
  <g transform="translate(640, 95)" filter="url(#cardShadow)">
    <rect width="280" height="305" rx="12" fill="url(#panelGrad)" stroke="#202b3f" stroke-width="1.2" />
    <rect width="280" height="36" rx="12" fill="#151d2e" />
    <path d="M0 24h280" stroke="#202b3f" stroke-width="1" />
    <circle cx="20" cy="18" r="4" fill="#10b981" />
    <text x="32" y="22" fill="#e2e8f0" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="700">3. Capacidades del Drawer</text>

    <!-- Feature 1: Live Filter & Search -->
    <g transform="translate(14, 48)">
      <rect width="252" height="52" rx="8" fill="#090d16" stroke="#202b3f" />
      <text x="12" y="22" fill="#38bdf8" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="700">Búsqueda Reactiva (Deep Search)</text>
      <text x="12" y="38" fill="#94a3b8" font-family="'Plus Jakarta Sans', sans-serif" font-size="10">Títulos, slugs de tarea y contenido en mensajes</text>
    </g>

    <!-- Feature 2: Drag & Drop Organization -->
    <g transform="translate(14, 110)">
      <rect width="252" height="52" rx="8" fill="#090d16" stroke="#202b3f" />
      <text x="12" y="22" fill="#a78bfa" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="700">Drag &amp; Drop de Sesiones</text>
      <text x="12" y="38" fill="#94a3b8" font-family="'Plus Jakarta Sans', sans-serif" font-size="10">Reorganiza entre proyectos con dropTarget visual</text>
    </g>

    <!-- Feature 3: Favorites & Archive -->
    <g transform="translate(14, 172)">
      <rect width="252" height="52" rx="8" fill="#090d16" stroke="#202b3f" />
      <text x="12" y="22" fill="#fbbf24" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="700">Favoritas y Archivo</text>
      <text x="12" y="38" fill="#94a3b8" font-family="'Plus Jakarta Sans', sans-serif" font-size="10">Pin rápido con estrella y restauración 1-click</text>
    </g>

    <!-- Feature 4: Keyboard Navigation -->
    <g transform="translate(14, 234)">
      <rect width="252" height="52" rx="8" fill="#090d16" stroke="#202b3f" />
      <text x="12" y="22" fill="#34d399" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="700">Navegación Táctica</text>
      <text x="12" y="38" fill="#94a3b8" font-family="'Plus Jakarta Sans', sans-serif" font-size="10">Atajos Ctrl+H, Escape para cerrar y focus traps</text>
    </g>
  </g>

  <!-- Footer Info -->
  <g transform="translate(40, 428)">
    <text x="0" y="20" fill="#64748b" font-family="'JetBrains Mono', monospace" font-size="11">
      COMPONENTE: src/webview/components/SessionDrawer.tsx · PROTOCOLO DE DESARROLLO AGENTHUB
    </text>
    <text x="920" y="20" text-anchor="end" fill="#64748b" font-family="'JetBrains Mono', monospace" font-size="11">
      WCAG AA CONTRAST ≥ 4.5:1
    </text>
  </g>
</svg>
