      <text x="14" y="22" fill="#fda4af" font-size="11" font-weight="700">¿Descartar cambios de safe-path.ts?</text>
      <text x="14" y="38" fill="#94a3b8" font-size="9.5" font-mono="true">Restaura el archivo al estado exacto de HEAD.</text>

      <rect x="248" y="10" width="90" height="30" rx="6" fill="#f43f5e" />
      <text x="293" y="29" fill="#fff" font-size="10.5" font-weight="800" text-anchor="middle">Sí, revertir</text>
    </g>

    <!-- Guard Mechanics -->
    <g transform="translate(18, 120)">
      <rect width="350" height="444" rx="10" fill="#07090e" stroke="#162035" stroke-width="1.2" />

      <!-- Step 1 -->
      <g transform="translate(14, 16)">
        <rect width="322" height="74" rx="8" fill="#0c1220" stroke="#202b3f" stroke-width="1" />
        <circle cx="20" cy="22" r="8" fill="#06b6d4" fill-opacity="0.15" />
        <text x="20" y="26" fill="#06b6d4" font-size="10" font-weight="800" text-anchor="middle">1</text>
        <text x="36" y="22" fill="#f8fafc" font-size="11" font-weight="700">Doble Confirmación Visual</text>
        <text x="36" y="38" fill="#94a3b8" font-size="10">El botón "Revertir" requiere un segundo clic.</text>
        <text x="36" y="54" fill="#6ee7b7" font-size="9.5" font-mono="true">Previene descartes accidentales de código.</text>
      </g>

      <!-- Step 2 -->
      <g transform="translate(14, 102)">
        <rect width="322" height="74" rx="8" fill="#0c1220" stroke="#202b3f" stroke-width="1" />
        <circle cx="20" cy="22" r="8" fill="#06b6d4" fill-opacity="0.15" />
        <text x="20" y="26" fill="#06b6d4" font-size="10" font-weight="800" text-anchor="middle">2</text>
        <text x="36" y="22" fill="#f8fafc" font-size="11" font-weight="700">Aislamiento por Archivo Individual</text>
        <text x="36" y="38" fill="#94a3b8" font-size="10">No descarta todo el working tree: sólo el archivo</text>
        <text x="36" y="54" fill="#6ee7b7" font-size="9.5" font-mono="true">seleccionado en la inspección modal.</text>
      </g>

      <!-- Step 3 -->
      <g transform="translate(14, 188)">
        <rect width="322" height="74" rx="8" fill="#0c1220" stroke="#202b3f" stroke-width="1" />
        <circle cx="20" cy="22" r="8" fill="#06b6d4" fill-opacity="0.15" />
        <text x="20" y="26" fill="#06b6d4" font-size="10" font-weight="800" text-anchor="middle">3</text>
        <text x="36" y="22" fill="#f8fafc" font-size="11" font-weight="700">Refresco Inmediato de Lista Git</text>
        <text x="36" y="38" fill="#94a3b8" font-size="10">Al revertir, la barra lateral actualiza el contador</text>
        <text x="36" y="54" fill="#6ee7b7" font-size="9.5" font-mono="true">de archivos modificados automáticamente.</text>
      </g>

      <!-- Safety Summary -->
      <g transform="translate(14, 276)">
        <rect width="322" height="152" rx="8" fill="#0a0e17" stroke="#162035" stroke-width="1" />
        <text x="14" y="24" fill="#f8fafc" font-size="11" font-weight="700">Garantía de Integridad Git</text>
        <text x="14" y="46" fill="#94a3b8" font-size="10.5">• Conexión directa mediante host git IPC</text>
        <text x="14" y="66" fill="#94a3b8" font-size="10.5">• Validación estricta con resolveSafeCwd</text>
        <text x="14" y="86" fill="#94a3b8" font-size="10.5">• Cierre reactivo con tecla Escape</text>
        
        <rect x="14" y="106" width="294" height="28" rx="6" fill="#10b981" fill-opacity="0.15" stroke="#10b981" stroke-width="0.8" />
        <text x="161" y="124" fill="#6ee7b7" font-size="10" font-weight="800" text-anchor="middle" font-mono="true">GIT INTEGRITY: ZERO_DATA_LOSS</text>
      </g>
    </g>
