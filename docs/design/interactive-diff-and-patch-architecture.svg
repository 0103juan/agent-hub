  <rect x="910" y="36" width="150" height="38" rx="8" fill="#10b981" fill-opacity="0.12" stroke="#10b981" stroke-width="1.2" />
  <circle cx="926" cy="55" r="4" fill="#10b981" filter="url(#neon-glow-37)" />
  <text x="938" y="59" fill="#10b981" font-size="11" font-weight="800" font-mono="true">+18 / −6 LINES</text>

  <rect x="1070" y="36" width="155" height="38" rx="8" fill="#06b6d4" fill-opacity="0.12" stroke="#06b6d4" stroke-width="1.2" />
  <circle cx="1086" cy="55" r="4" fill="#06b6d4" filter="url(#neon-glow-37)" />
  <text x="1098" y="59" fill="#06b6d4" font-size="11" font-weight="800" font-mono="true">HEAD ↔ ACTUAL</text>

  <!-- Panel 1: Split View Architecture (Left) -->
  <g transform="translate(36, 106)">
    <rect width="386" height="584" rx="14" fill="#0a0e17" stroke="#202b3f" stroke-width="1.5" />
    <rect width="386" height="42" rx="14" fill="#0e131f" />
    <text x="18" y="26" fill="#06b6d4" font-size="11" font-weight="800" font-mono="true">01 // SIDE-BY-SIDE SPLIT VIEW</text>
    <rect x="306" y="10" width="66" height="22" rx="6" fill="#06b6d4" fill-opacity="0.15" />
    <text x="318" y="25" fill="#06b6d4" font-size="9.5" font-weight="700" font-mono="true">SPLIT</text>

