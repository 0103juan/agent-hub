      <rect x="6" y="6" width="165" height="28" rx="6" fill="#1f1418" stroke="#f43f5e" stroke-width="1" />
      <text x="88" y="24" fill="#fda4af" font-size="10.5" font-weight="700" text-anchor="middle" font-mono="true">ORIGINAL (HEAD)</text>

      <rect x="178" y="6" width="165" height="28" rx="6" fill="#0f261e" stroke="#10b981" stroke-width="1" />
      <text x="260" y="24" fill="#6ee7b7" font-size="10.5" font-weight="700" text-anchor="middle" font-mono="true">ACTUAL (MODIFICADO)</text>
    </g>

    <g transform="translate(18, 108)">
      <rect width="350" height="456" rx="10" fill="#07090e" stroke="#162035" stroke-width="1.2" />

      <!-- Row with Deleted line in Left -->
      <g transform="translate(10, 16)">
        <rect width="160" height="36" rx="4" fill="#1f1418" stroke="#f43f5e" stroke-width="0.8" />
        <text x="8" y="22" fill="#fda4af" font-size="9" font-mono="true">- const cwd = "system32";</text>

        <rect x="170" width="160" height="36" rx="4" fill="#0f261e" stroke="#10b981" stroke-width="0.8" />
        <text x="178" y="22" fill="#6ee7b7" font-size="9" font-weight="700" font-mono="true">+ const cwd = resolveSafeCwd();</text>
      </g>

      <!-- Row Unchanged -->
      <g transform="translate(10, 60)">
        <rect width="160" height="28" rx="4" fill="#0a0e17" />
        <text x="8" y="18" fill="#64748b" font-size="9" font-mono="true">  return execSync(cmd, { cwd });</text>

        <rect x="170" width="160" height="28" rx="4" fill="#0a0e17" />
        <text x="178" y="18" fill="#64748b" font-size="9" font-mono="true">  return execSync(cmd, { cwd });</text>
      </g>

      <!-- Specs box -->
      <g transform="translate(14, 110)">
        <rect width="322" height="330" rx="8" fill="#0a0e17" stroke="#162035" stroke-width="1" />
        <text x="14" y="24" fill="#f8fafc" font-size="11" font-weight="700">Ventajas de Vista Dividida (Split)</text>

        <circle cx="20" cy="54" r="3" fill="#10b981" />
        <text x="32" y="58" fill="#cbd5e1" font-size="10.5">Comparativa síncrona línea a línea</text>

        <circle cx="20" cy="84" r="3" fill="#10b981" />
        <text x="32" y="88" fill="#cbd5e1" font-size="10.5">Números de línea independientes en cada panel</text>

        <circle cx="20" cy="114" r="3" fill="#10b981" />
        <text x="32" y="118" fill="#cbd5e1" font-size="10.5">Borde lateral rojo para eliminados y verde para nuevos</text>

        <circle cx="20" cy="144" r="3" fill="#10b981" />
        <text x="32" y="148" fill="#cbd5e1" font-size="10.5">Desplazamiento horizontal para líneas largas</text>

        <circle cx="20" cy="174" r="3" fill="#10b981" />
        <text x="32" y="178" fill="#cbd5e1" font-size="10.5">Cabeceras pegajosas (sticky) en tope de tabla</text>

        <rect x="14" y="220" width="294" height="80" rx="6" fill="#07090e" stroke="#202b3f" stroke-width="0.8" />
        <text x="26" y="244" fill="#06b6d4" font-size="10" font-weight="800" font-mono="true">STATS SUMMARY</text>
        <text x="26" y="266" fill="#10b981" font-size="10" font-mono="true">+18 adiciones (75%)</text>
        <text x="26" y="286" fill="#f43f5e" font-size="10" font-mono="true">−6 eliminaciones (25%)</text>
      </g>
    </g>
  </g>

  <!-- Panel 2: Unified Raw Diff & Hunk Tokens (Center) -->
  <g transform="translate(444, 106)">
    <rect width="392" height="584" rx="14" fill="#0a0e17" stroke="#202b3f" stroke-width="1.5" />
    <rect width="392" height="42" rx="14" fill="#0e131f" />
    <text x="18" y="26" fill="#10b981" font-size="11" font-weight="800" font-mono="true">02 // UNIFIED RAW GIT DIFF HUNK VIEW</text>
    <rect x="290" y="10" width="88" height="22" rx="6" fill="#10b981" fill-opacity="0.15" />
    <text x="300" y="25" fill="#10b981" font-size="9.5" font-weight="700" font-mono="true">UNIFIED</text>

    <!-- Raw Hunk Preview -->
    <g transform="translate(18, 56)">
      <rect width="356" height="40" rx="8" fill="#0c1220" stroke="#202b3f" stroke-width="1" />
      <text x="14" y="24" fill="#67e8f9" font-size="11" font-mono="true">@@ -40,7 +40,9 @@ workspace-actions.ts</text>
    </g>

    <g transform="translate(18, 108)">
      <rect width="356" height="456" rx="10" fill="#07090e" stroke="#162035" stroke-width="1.2" />

