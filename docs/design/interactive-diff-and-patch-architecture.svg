        <circle cx="20" cy="80" r="3" fill="#06b6d4" />
        <text x="32" y="84" fill="#cbd5e1" font-size="10.5">Copia en portapapeles para revisiones PR</text>

        <circle cx="20" cy="108" r="3" fill="#06b6d4" />
        <text x="32" y="112" fill="#cbd5e1" font-size="10.5">Sintaxis compatible con `git apply patch.diff`</text>

        <rect x="14" y="136" width="300" height="104" rx="6" fill="#07090e" stroke="#202b3f" stroke-width="0.8" />
        <text x="24" y="160" fill="#fcd34d" font-size="10" font-mono="true">GIT CLI SYNERGY</text>
        <text x="24" y="182" fill="#94a3b8" font-size="9.5" font-mono="true">&gt; git diff HEAD -- safe-path.ts</text>
        <text x="24" y="202" fill="#94a3b8" font-size="9.5" font-mono="true">&gt; git checkout -- safe-path.ts (revert)</text>
        <text x="24" y="222" fill="#10b981" font-size="9.5" font-mono="true">✓ HEAD STATE SYNCHRONIZED</text>
      </g>
    </g>
