      <g transform="translate(12, 16)">
        <rect width="332" height="28" rx="4" fill="#082f49" fill-opacity="0.4" />
        <rect width="3" height="28" fill="#06b6d4" />
        <text x="12" y="18" fill="#38bdf8" font-size="10" font-weight="700" font-mono="true">@@ -82,6 +82,9 @@ validateWorkspace</text>

        <g transform="translate(0, 34)">
          <rect width="332" height="24" rx="3" fill="#1f1418" />
          <rect width="3" height="24" fill="#f43f5e" />
          <text x="12" y="16" fill="#fda4af" font-size="10" font-mono="true">-  return runCommand(cmd, path);</text>
        </g>

        <g transform="translate(0, 64)">
          <rect width="332" height="24" rx="3" fill="#0f261e" />
          <rect width="3" height="24" fill="#10b981" />
          <text x="12" y="16" fill="#6ee7b7" font-size="10" font-weight="700" font-mono="true">+  const safeCwd = resolveSafeCwd(path);</text>
        </g>

        <g transform="translate(0, 92)">
          <rect width="332" height="24" rx="3" fill="#0f261e" />
          <rect width="3" height="24" fill="#10b981" />
          <text x="12" y="16" fill="#6ee7b7" font-size="10" font-weight="700" font-mono="true">+  return runCommand(cmd, safeCwd);</text>
        </g>

        <g transform="translate(0, 120)">
          <rect width="332" height="24" rx="3" fill="#0a0e17" />
          <text x="12" y="16" fill="#64748b" font-size="10" font-mono="true">   return true;</text>
        </g>
      </g>

      <!-- Patch Export Tools -->
      <g transform="translate(14, 180)">
        <rect width="328" height="260" rx="8" fill="#0a0e17" stroke="#162035" stroke-width="1" />
