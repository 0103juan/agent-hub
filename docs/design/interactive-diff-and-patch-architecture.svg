  <!-- Panel 3: Zero-Leak Rollback & Confirmation Guard (Right) -->
  <g transform="translate(858, 106)">
    <rect width="386" height="584" rx="14" fill="#0a0e17" stroke="#202b3f" stroke-width="1.5" />
    <rect width="386" height="42" rx="14" fill="#0e131f" />
    <text x="18" y="26" fill="#f43f5e" font-size="11" font-weight="800" font-mono="true">03 // SAFE ROLLBACK &amp; DISCARD GUARD</text>
    <rect x="296" y="10" width="76" height="22" rx="6" fill="#f43f5e" fill-opacity="0.15" />
    <text x="306" y="25" fill="#fda4af" font-size="9.5" font-weight="700" font-mono="true">ROLLBACK</text>

