<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="100%" height="100%" style="background:#07090e; font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
  <defs>
    <linearGradient id="hud-bg-37" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a0e17" />
      <stop offset="60%" stop-color="#060910" />
      <stop offset="100%" stop-color="#04060a" />
    </linearGradient>
    <filter id="neon-glow-37" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <pattern id="grid-37" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M 28 0 L 0 0 0 28" fill="none" stroke="#162035" stroke-width="0.75" stroke-opacity="0.5" />
      <circle cx="28" cy="28" r="0.8" fill="#06b6d4" fill-opacity="0.2" />
    </pattern>
  </defs>

  <rect width="1280" height="720" fill="url(#hud-bg-37)" />
  <rect width="1280" height="720" fill="url(#grid-37)" />

  <!-- Master Header Bar -->
  <rect x="36" y="22" width="1208" height="68" rx="14" fill="#0a0e17" stroke="#202b3f" stroke-width="1.5" />
  <circle cx="70" cy="56" r="18" fill="#06b6d4" fill-opacity="0.12" stroke="#06b6d4" stroke-width="1.5" />
  <!-- Git Compare Icon -->
  <circle cx="64" cy="50" r="3.5" fill="#f43f5e" />
  <circle cx="64" cy="62" r="3.5" fill="#10b981" />
  <path d="M64 53.5 L64 58.5 M72 50 C76 50 76 62 72 62" fill="none" stroke="#06b6d4" stroke-width="2" stroke-linecap="round" />
  <circle cx="72" cy="50" r="3.5" fill="#f43f5e" />
  <circle cx="72" cy="62" r="3.5" fill="#10b981" />

  <text x="102" y="48" fill="#f8fafc" font-size="15" font-weight="800" letter-spacing="0.5">AGENTHUB // INTERACTIVE GIT DIFF &amp; PATCH ENGINE</text>
