<!DOCTYPE html>
<html lang="es" class="h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tactical Split Workspace &amp; Multitasking Grid — Showcase</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    /* 5 Canonical Elevation Layers */
    .bg-layer-1 { background-color: #07090e; }
    .bg-layer-2 { background-color: #0a0e17; }
    .bg-layer-3 { background-color: #0c1220; }
    .bg-layer-4 { background-color: #162035; }
    .border-layer-5 { border-color: #202b3f; }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body class="bg-[#07090e] text-slate-200 font-sans h-full overflow-hidden flex flex-col antialiased selection:bg-cyan-500/30 selection:text-cyan-200">

  <!-- Top Tactical Navigation & Split Toolbar -->
  <header class="h-14 border-b border-[#202b3f] bg-[#0a0e17] flex items-center justify-between px-6 shrink-0 z-20">
    <div class="flex items-center gap-4">
      <div class="flex items-center justify-center w-8 h-8 rounded-lg bg-cyan-500/15 border border-cyan-500/30 text-cyan-400 font-mono font-bold text-sm">
        #67
      </div>
      <div>
        <div class="flex items-center gap-2">
          <h1 class="text-sm font-bold tracking-tight text-white">Espacio de Trabajo Dividido y Malla Multitarea</h1>
          <span class="px-2 py-0.5 text-[10px] font-mono rounded bg-cyan-500/20 text-cyan-300 border border-cyan-500/40">SPEC CARD #67</span>
        </div>
        <p class="text-[11px] text-slate-400 font-mono">Hasta 4 Agentes Concurrentes · sameChat Memo (60 FPS) · CWD Independiente</p>
      </div>
    </div>

    <!-- Layout & Concurrency Switcher Toolbar -->
    <div class="flex items-center gap-3">
      <!-- Layout Mode Pills -->
      <div class="flex items-center gap-1 bg-[#07090e] border border-[#202b3f] p-0.5 rounded-lg font-mono text-xs">
        <button id="layout-cols-btn" class="layout-toggle-btn active flex items-center gap-1.5 px-2.5 py-1 rounded-md bg-cyan-500/20 text-cyan-200 border border-cyan-500/40 font-bold transition cursor-pointer" title="Disposición en Columnas">
          <svg class="w-3 h-3 text-cyan-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 4v16m6-16v16"/></svg>
          <span class="hidden sm:inline">Columnas</span>
        </button>
        <button id="layout-rows-btn" class="layout-toggle-btn flex items-center gap-1.5 px-2.5 py-1 rounded-md text-slate-400 hover:text-slate-200 hover:bg-[#162035] transition cursor-pointer" title="Disposición en Filas">
          <svg class="w-3 h-3 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 9h16m-16 6h16"/></svg>
          <span class="hidden sm:inline">Filas</span>
        </button>
        <button id="layout-grid-btn" class="layout-toggle-btn flex items-center gap-1.5 px-2.5 py-1 rounded-md text-slate-400 hover:text-slate-200 hover:bg-[#162035] transition cursor-pointer" title="Disposición en Malla 2x2">
          <svg class="w-3 h-3 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4h7v7H4zM13 4h7v7h-7zM4 13h7v7H4zM13 13h7v7h-7z"/></svg>
          <span class="hidden sm:inline">Malla 2x2</span>
        </button>
      </div>

      <!-- Add Pane Button -->
      <button id="add-pane-btn" class="flex items-center gap-1 px-2.5 py-1 rounded-lg bg-[#0c1220] hover:bg-[#162035] text-slate-300 hover:text-white border border-[#202b3f] text-xs font-mono transition cursor-pointer" title="Añadir panel concurrente (máximo 4)">
        <svg class="w-3 h-3 text-cyan-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/></svg>
        <span>+ Panel (<span id="pane-count-badge">3</span>/4)</span>
      </button>

      <a href="master-design-portal-and-component-gallery-showcase.html" class="px-3 py-1.5 rounded-lg bg-[#0c1220] hover:bg-[#162035] text-slate-300 hover:text-white border border-[#202b3f] text-xs font-medium transition cursor-pointer">
        Volver al Portal
      </a>
    </div>
  </header>

  <!-- Main Canvas: Dynamic Panes Container -->
  <main class="flex-1 overflow-hidden relative flex flex-col bg-[#07090e]">

    <!-- Top Telemetry Ribbon -->
    <div class="h-8 border-b border-[#202b3f] bg-[#0a0e17] px-4 flex items-center justify-between text-xs font-mono text-slate-400 shrink-0">
      <div class="flex items-center gap-3">
        <span class="flex items-center gap-1.5 text-emerald-400">
          <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
          <span>MEMO SAMECHAT: 60 FPS ACTIVO</span>
        </span>
        <span class="text-slate-600">|</span>
        <span class="text-cyan-300">STREAMING AISLADO: 0 REFRACTIONS</span>
      </div>
      <div class="flex items-center gap-2">
        <button id="sim-token-stream-btn" class="px-2 py-0.5 rounded bg-cyan-600/30 hover:bg-cyan-600/50 text-cyan-200 border border-cyan-500/40 text-[10.5px] cursor-pointer">
          Simular Token Stream en Panel 1
        </button>
      </div>
    </div>

    <!-- Dynamic Grid / Columns Area -->
    <div id="workspace-container" class="flex-1 overflow-x-auto no-scrollbar flex divide-x divide-[#202b3f]">
      <!-- Panes will be dynamically populated -->
    </div>
  </main>

  <!-- Interactive JavaScript Logic -->
  <script>
    const INITIAL_PANES = [
      {
        id: "session-01",
        role: "Arquitecto",
        roleColor: "text-purple-400 bg-purple-950/40 border-purple-500/40",
        model: "Claude 3.5 Sonnet",
        project: "agent-hub",
        branch: "main",
        status: "idle",
        messages: [
          { sender: "Arquitecto", text: "Plan técnico validado. Descomponiendo interfaces para el Tester.", time: "01:35:10" }
        ]
      },
      {
        id: "session-02",
        role: "Tester",
        roleColor: "text-emerald-400 bg-emerald-950/40 border-emerald-500/40",
        model: "Claude 3.5 Sonnet",
        project: "agent-hub",
        branch: "feat/tests",
        status: "idle",
        messages: [
          { sender: "Tester", text: "Suite TDD preparada. 14 pruebas redactadas esperando implementación.", time: "01:35:22" }
        ]
      },
      {
        id: "session-03",
        role: "Desarrollador",
        roleColor: "text-blue-400 bg-blue-950/40 border-blue-500/40",
        model: "Claude 3.7 Sonnet (Thinking)",
        project: "mcp-server",
        branch: "main",
        status: "idle",
        messages: [
          { sender: "Desarrollador", text: "Conectando endpoints MCP a la base de datos Postgres...", time: "01:35:45" }
        ]
      }
    ];

    let currentPanes = [...INITIAL_PANES];
    let currentLayout = 'cols'; // 'cols' | 'rows' | 'grid'
    let maximizedPaneId = null;

    const container = document.getElementById('workspace-container');
    const colsBtn = document.getElementById('layout-cols-btn');
    const rowsBtn = document.getElementById('layout-rows-btn');
    const gridBtn = document.getElementById('layout-grid-btn');
    const addPaneBtn = document.getElementById('add-pane-btn');
    const paneCountBadge = document.getElementById('pane-count-badge');
    const simStreamBtn = document.getElementById('sim-token-stream-btn');

    function applyLayout(layout) {
      currentLayout = layout;
      [colsBtn, rowsBtn, gridBtn].forEach(btn => {
        btn.className = "layout-toggle-btn flex items-center gap-1.5 px-2.5 py-1 rounded-md text-slate-400 hover:text-slate-200 hover:bg-[#162035] transition cursor-pointer";
      });

      if (layout === 'cols') {
        colsBtn.className = "layout-toggle-btn active flex items-center gap-1.5 px-2.5 py-1 rounded-md bg-cyan-500/20 text-cyan-200 border border-cyan-500/40 font-bold transition cursor-pointer";
        container.className = "flex-1 overflow-x-auto no-scrollbar flex divide-x divide-[#202b3f]";
      } else if (layout === 'rows') {
        rowsBtn.className = "layout-toggle-btn active flex items-center gap-1.5 px-2.5 py-1 rounded-md bg-cyan-500/20 text-cyan-200 border border-cyan-500/40 font-bold transition cursor-pointer";
        container.className = "flex-1 overflow-y-auto no-scrollbar flex flex-col divide-y divide-[#202b3f]";
      } else if (layout === 'grid') {
        gridBtn.className = "layout-toggle-btn active flex items-center gap-1.5 px-2.5 py-1 rounded-md bg-cyan-500/20 text-cyan-200 border border-cyan-500/40 font-bold transition cursor-pointer";
        container.className = "flex-1 p-2 grid grid-cols-2 grid-rows-2 gap-2 overflow-hidden";
      }

      renderPanes();
    }

    colsBtn.addEventListener('click', () => applyLayout('cols'));
    rowsBtn.addEventListener('click', () => applyLayout('rows'));
    gridBtn.addEventListener('click', () => applyLayout('grid'));

    function renderPanes() {
      paneCountBadge.textContent = currentPanes.length;
      container.innerHTML = '';

      currentPanes.forEach((pane, idx) => {
        const isMaximized = maximizedPaneId === pane.id;
        if (maximizedPaneId && !isMaximized) return; // Hide others when maximized

        const paneDiv = document.createElement('div');
        const flexClass = currentLayout === 'cols'
          ? 'min-w-[340px] flex-1 flex flex-col bg-[#07090e] overflow-hidden'
          : currentLayout === 'rows'
            ? 'min-h-[220px] flex-1 flex flex-col bg-[#07090e] overflow-hidden'
            : 'flex flex-col bg-[#07090e] rounded-xl border border-[#202b3f] overflow-hidden';

        paneDiv.className = isMaximized ? 'w-full h-full flex flex-col bg-[#07090e] z-30' : flexClass;
        paneDiv.id = `pane-${pane.id}`;

        paneDiv.innerHTML = `
          <!-- Header -->
          <div class="h-10 px-3 bg-[#0a0e17] border-b border-[#202b3f] flex items-center justify-between gap-2 shrink-0 text-xs">
            <!-- Left Info -->
            <div class="flex items-center gap-2 min-w-0">
              <span class="px-2 py-0.5 rounded font-mono text-[10px] font-bold border ${pane.roleColor}">
                ${pane.role}
              </span>
              <span class="truncate font-mono text-[11px] text-slate-300 font-semibold" title="Proyecto: ${pane.project}">
                📁 ${pane.project}
              </span>
              <span class="truncate font-mono text-[10px] text-emerald-400 border border-emerald-500/30 px-1.5 py-0.2 rounded bg-emerald-950/30" title="Rama: ${pane.branch}">
                ⑂ ${pane.branch}
              </span>
            </div>

            <!-- Right Pane Controls -->
            <div class="flex items-center gap-1">
              <button class="maximize-btn p-1 rounded hover:bg-[#162035] text-slate-400 hover:text-white transition cursor-pointer" title="${isMaximized ? 'Restaurar cuadrícula' : 'Maximizar este panel'}">
                ${isMaximized
                  ? '<svg class="w-3.5 h-3.5 text-cyan-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 14h6m0 0v6m0-6L3 21m17-7h-6m0 0v6m0-6l7 7M10 4H4m0 0v6m0-6l7 7m10-7h-6m0 0v6m0-6l7 7"/></svg>'
                  : '<svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 8V4m0 0h4M4 4l5 5m11-1V4m0 0h-4m4 0l-5 5M4 16v4m0 0h4m-4 0l5-5m11 5l-5-5m5 5v-4m0 4h-4"/></svg>'
                }
              </button>
              <button class="close-btn p-1 rounded hover:bg-[#162035] text-slate-400 hover:text-rose-400 transition cursor-pointer" title="Cerrar panel">
                <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
              </button>
            </div>
          </div>

          <!-- Message Stream Area -->
          <div class="flex-1 p-3 overflow-y-auto space-y-2 text-xs no-scrollbar messages-area">
            ${pane.messages.map(m => `
              <div class="p-2.5 rounded-lg bg-[#0a0e17] border border-[#202b3f] space-y-1">
                <div class="flex justify-between items-center text-[10px] text-slate-500 font-mono">
                  <span class="text-cyan-300 font-bold">${m.sender}</span>
                  <span>${m.time}</span>
                </div>
                <div class="text-slate-200 leading-relaxed font-mono text-[11px]">${m.text}</div>
              </div>
            `).join('')}
          </div>

          <!-- Composer Footer -->
          <div class="p-2 bg-[#0a0e17] border-t border-[#202b3f] flex items-center gap-2 shrink-0">
            <input type="text" placeholder="Instrucción para ${pane.role}..." class="flex-1 bg-[#07090e] border border-[#202b3f] rounded-lg px-2.5 py-1 text-xs text-slate-200 placeholder:text-slate-500 focus:outline-none focus:border-cyan-500 font-mono">
            <button class="send-btn px-2.5 py-1 rounded-lg bg-cyan-600 hover:bg-cyan-500 text-slate-950 font-bold text-xs transition cursor-pointer">
              Enviar
            </button>
          </div>
        `;

        // Maximize handler
        paneDiv.querySelector('.maximize-btn').addEventListener('click', () => {
          maximizedPaneId = maximizedPaneId === pane.id ? null : pane.id;
          renderPanes();
        });

        // Close handler
        paneDiv.querySelector('.close-btn').addEventListener('click', () => {
          if (currentPanes.length <= 1) {
            alert("No puedes cerrar el único panel activo.");
            return;
          }
          currentPanes = currentPanes.filter(p => p.id !== pane.id);
          if (maximizedPaneId === pane.id) maximizedPaneId = null;
          renderPanes();
        });

        // Send message handler
        const input = paneDiv.querySelector('input');
        const sendBtn = paneDiv.querySelector('.send-btn');
        const handleSend = () => {
          const text = input.value.trim();
          if (!text) return;
          pane.messages.push({
            sender: "Usuario",
            text,
            time: new Date().toTimeString().split(' ')[0]
          });
          input.value = '';
          renderPanes();
        };

        sendBtn.addEventListener('click', handleSend);
        input.addEventListener('keydown', (e) => {
          if (e.key === 'Enter') handleSend();
        });

        container.appendChild(paneDiv);
      });
    }

    addPaneBtn.addEventListener('click', () => {
      if (currentPanes.length >= 4) {
        alert("Máximo 4 paneles concurrentes soportados para garantizar 60 FPS.");
        return;
      }

      const newId = `session-0${currentPanes.length + 1}`;
      currentPanes.push({
        id: newId,
        role: "Revisor",
        roleColor: "text-amber-400 bg-amber-950/40 border-amber-500/40",
        model: "Claude 3.5 Sonnet",
        project: "docs",
        branch: "review-diff",
        status: "idle",
        messages: [
          { sender: "Revisor", text: "Inspeccionando diffs de la entrega antes del merge.", time: new Date().toTimeString().split(' ')[0] }
        ]
      });
      renderPanes();
    });

    // Simulated token stream in pane 1 showing memo isolation
    simStreamBtn.addEventListener('click', () => {
      const pane1 = currentPanes[0];
      const tokens = ["Generando", " especificación", " de", " API...", " Contratos", " validados", " 100%."];
      let i = 0;

      const newMsg = {
        sender: "Arquitecto (Streaming)",
        text: "",
        time: new Date().toTimeString().split(' ')[0]
      };
      pane1.messages.push(newMsg);
      renderPanes();

      const timer = setInterval(() => {
        if (i < tokens.length) {
          newMsg.text += tokens[i];
          const paneEl = document.getElementById(`pane-${pane1.id}`);
          if (paneEl) {
            const lastMsgEl = paneEl.querySelector('.messages-area div:last-child div:last-child');
            if (lastMsgEl) lastMsgEl.textContent = newMsg.text;
          }
          i++;
        } else {
          clearInterval(timer);
          newMsg.sender = "Arquitecto";
          renderPanes();
        }
      }, 150);
    });

    renderPanes();
  </script>
</body>
</html>
