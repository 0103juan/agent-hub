          <text x="10" y="17" font-family="'JetBrains Mono', monospace" font-size="10" fill="#cbd5e1">⚡ Explicar arquitectura del proyecto</text>

          <rect y="32" width="288" height="26" rx="6" fill="#0a0e17" stroke="#202b3f" stroke-width="1" />
          <text x="10" y="49" font-family="'JetBrains Mono', monospace" font-size="10" fill="#cbd5e1">🛡️ Auditar seguridad y secretos</text>

          <rect y="64" width="288" height="26" rx="6" fill="#0a0e17" stroke="#202b3f" stroke-width="1" />
          <text x="10" y="81" font-family="'JetBrains Mono', monospace" font-size="10" fill="#cbd5e1">✓ Correr suite de pruebas unitarias</text>
        </g>
      </g>

      <!-- Onboarding Checklist Card -->
