        <rect width="320" height="126" rx="10" fill="#08101a" stroke="#06b6d4" stroke-opacity="0.3" stroke-width="1" />
        <text x="14" y="24" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#06b6d4">Ventajas de Arquitectura</text>
        <text x="14" y="46" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" fill="#cbd5e1">· Control de costos en tiempo real por chat.</text>
        <text x="14" y="68" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" fill="#cbd5e1">· Prevención de desbordamiento de contexto.</text>
        <text x="14" y="90" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" fill="#cbd5e1">· Handoff fluido entre roles de protocolo.</text>
        <text x="14" y="112" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" fill="#cbd5e1">· Zero-layout shift al alternar el deck.</text>
      </g>
    </g>
  </g>

  <!-- COLUMN 2: Message Stream & Checkpoint Hub -->
