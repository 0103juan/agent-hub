        <!-- Logo Emblem -->
        <circle cx="160" cy="46" r="22" fill="#0c1220" stroke="#06b6d4" stroke-width="1.5" />
        <text x="160" y="52" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="14" font-weight="800" fill="#06b6d4">AH</text>

        <!-- Welcome Text -->
        <text x="160" y="90" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700" fill="#f1f5f9">AGENTHUB TACTICAL HUD</text>
        <text x="160" y="108" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" fill="#94a3b8">Enjambre listo para desarrollo asistido.</text>

        <!-- Quick Prompts Chips -->
        <g transform="translate(16, 126)">
