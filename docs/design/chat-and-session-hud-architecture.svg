  <!-- Footer Info Bar -->
  <g transform="translate(48, 672)">
    <circle cx="6" cy="0" r="3.5" fill="#10b981" />
    <text x="18" y="3.5" font-family="'JetBrains Mono', monospace" font-size="11" fill="#94a3b8">Status: <tspan fill="#10b981" font-weight="600">Production Ready · 100% Tactical HUD Synchronized</tspan></text>
    <text x="560" y="3.5" font-family="'JetBrains Mono', monospace" font-size="11" fill="#64748b">|</text>
    <text x="580" y="3.5" font-family="'JetBrains Mono', monospace" font-size="11" fill="#94a3b8">Components: <tspan fill="#cbd5e1">ChatView.tsx &amp; MessageList.tsx</tspan></text>
    <text x="960" y="3.5" font-family="'JetBrains Mono', monospace" font-size="11" fill="#64748b">Tactical Dark HUD v0.1.2</text>
