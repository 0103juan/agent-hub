    <rect width="388" height="536" rx="14" fill="#0a0e17" stroke="#202b3f" stroke-width="1.5" />
    <rect width="388" height="42" rx="14" fill="#0c1220" />
    <path d="M 0 42 L 388 42" stroke="#202b3f" stroke-width="1" />
    
    <circle cx="24" cy="21" r="5" fill="#6366f1" />
