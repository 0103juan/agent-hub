        <text x="14" y="24" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#10b981">Primeros Pasos (Onboarding)</text>
        
        <!-- Checklist items -->
        <g transform="translate(14, 38)">
          <text x="0" y="16" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" fill="#10b981">☑ 1. Conectar cuenta de IA (Claude/Gemini/Codex)</text>
          <text x="0" y="38" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" fill="#10b981">☑ 2. Abrir repositorio de trabajo</text>
          <text x="0" y="60" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" fill="#94a3b8">☐ 3. Lanzar equipo enjambre (Squad Canvas)</text>
        </g>

        <!-- Footer -->
        <g transform="translate(14, 114)">
          <text x="0" y="10" font-family="'JetBrains Mono', monospace" font-size="9.5" fill="#64748b">Atajos: Ctrl+K paleta · Ctrl+/ atajos de teclado</text>
        </g>
