        <text x="82" y="26" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" fill="#f1f5f9">Refactoriza el motor de sintaxis en TS</text>
      </g>

      <!-- Assistant Bubble with Process & Diff -->
      <g transform="translate(0, 84)">
        <rect width="348" height="236" rx="10" fill="#07090e" stroke="#202b3f" stroke-width="1" />
        
        <!-- Header -->
        <g transform="translate(14, 16)">
          <circle cx="6" cy="6" r="4" fill="#06b6d4" />
          <text x="18" y="10" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#06b6d4">AgentHub · Desarrollador</text>
          <text x="240" y="10" font-family="'JetBrains Mono', monospace" font-size="10" fill="#64748b">15:48:22</text>
        </g>

        <!-- Message Body -->
        <text x="14" y="46" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" fill="#cbd5e1">Se añadieron clases de lookahead y operadores cian.</text>

        <!-- Modified files pill container -->
        <g transform="translate(14, 62)">
          <rect width="320" height="74" rx="6" fill="#0a0e17" stroke="#202b3f" stroke-width="1" />
          <text x="10" y="18" font-family="'JetBrains Mono', monospace" font-size="10" fill="#94a3b8">Archivos modificados (2):</text>
          
          <!-- File Pill 1 -->
          <rect x="10" y="28" width="180" height="24" rx="4" fill="#0c1220" stroke="#202b3f" stroke-width="1" />
          <text x="20" y="44" font-family="'JetBrains Mono', monospace" font-size="10" fill="#38bdf8">📄 syntax-highlighter.tsx</text>
          
          <!-- File Pill 2 -->
          <rect x="200" y="28" width="110" height="24" rx="4" fill="#0c1220" stroke="#202b3f" stroke-width="1" />
          <text x="210" y="44" font-family="'JetBrains Mono', monospace" font-size="10" fill="#38bdf8">📄 styles.css</text>

          <text x="10" y="66" font-family="'JetBrains Mono', monospace" font-size="9" fill="#10b981">✓ Diff inspeccionado y validado</text>
        </g>

        <!-- Checkpoint Rollback Footer -->
        <g transform="translate(14, 150)">
          <line x1="0" y1="0" x2="320" y2="0" stroke="#202b3f" stroke-width="1" />
          <text x="0" y="18" font-family="'JetBrains Mono', monospace" font-size="10" fill="#94a3b8">Recibo RDD: <tspan fill="#38bdf8">#a8f4c19</tspan></text>
          
          <!-- Rollback Button -->
          <rect x="200" y="4" width="120" height="24" rx="5" fill="#202b3f" stroke="#f59e0b" stroke-opacity="0.4" stroke-width="1" />
          <text x="214" y="20" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="600" fill="#f59e0b">↺ Deshacer turno</text>
        </g>

        <!-- Suggestion Action Button -->
        <g transform="translate(14, 192)">
          <rect width="320" height="30" rx="6" fill="#0891b2" />
          <text x="160" y="20" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#ffffff">Plan Aprobado: Ejecutar ahora →</text>
        </g>
      </g>

      <!-- System Event Foldable -->
      <g transform="translate(0, 332)">
        <rect width="348" height="42" rx="8" fill="#0c1220" stroke="#202b3f" stroke-width="1" />
        <text x="14" y="25" font-family="'JetBrains Mono', monospace" font-size="10" fill="#94a3b8">▶ 4 eventos de sistema colapsados (Git diff, tests pass)</text>
      </g>
    </g>
  </g>

  <!-- COLUMN 3: Onboarding & Empty State Architecture -->
  <g transform="translate(864, 92)" filter="url(#shadow-card)">
    <rect width="360" height="536" rx="14" fill="#0a0e17" stroke="#202b3f" stroke-width="1.5" />
    <rect width="360" height="42" rx="14" fill="#0c1220" />
    <path d="M 0 42 L 360 42" stroke="#202b3f" stroke-width="1" />
    
    <circle cx="24" cy="21" r="5" fill="#10b981" />
    <text x="40" y="25" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700" fill="#f1f5f9">3. Onboarding &amp; Empty State</text>

