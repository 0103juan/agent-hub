<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" fill="none">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="hud-bg" x1="0" y1="0" x2="1280" y2="720" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#07090e" />
      <stop offset="50%" stop-color="#0a0e17" />
      <stop offset="100%" stop-color="#0c1220" />
    </linearGradient>

    <!-- Radial Glows -->
    <radialGradient id="cyan-radial" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(260, 180) rotate(45) scale(400)">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="indigo-radial" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(1000, 500) rotate(45) scale(400)">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.10" />
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0" />
    </radialGradient>

    <!-- Filters -->
    <filter id="shadow-card" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.75" />
    </filter>
    <filter id="glow-pill" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#202b3f" stroke-width="0.5" stroke-opacity="0.5" />
      <circle cx="40" cy="40" r="1" fill="#06b6d4" fill-opacity="0.25" />
    </pattern>
  </defs>

  <!-- Background Layer -->
  <rect width="1280" height="720" fill="url(#hud-bg)" />
  <rect width="1280" height="720" fill="url(#cyan-radial)" />
  <rect width="1280" height="720" fill="url(#indigo-radial)" />
  <rect width="1280" height="720" fill="url(#grid)" />

  <!-- Outer HUD Frame -->
  <rect x="24" y="24" width="1232" height="672" rx="16" stroke="#202b3f" stroke-width="1.5" />
  <path d="M 24 64 L 1256 64" stroke="#202b3f" stroke-width="1" />
  <path d="M 24 656 L 1256 656" stroke="#202b3f" stroke-width="1" />

  <!-- Corner Ticks -->
  <path d="M 24 44 L 44 24" stroke="#06b6d4" stroke-width="2" />
  <path d="M 1256 44 L 1236 24" stroke="#06b6d4" stroke-width="2" />
  <path d="M 24 636 L 44 656" stroke="#06b6d4" stroke-width="2" />
  <path d="M 1256 636 L 1236 656" stroke="#06b6d4" stroke-width="2" />

  <!-- Header -->
  <g transform="translate(48, 44)">
    <circle cx="6" cy="0" r="4" fill="#06b6d4" filter="url(#glow-pill)" />
    <text x="20" y="4" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="700" fill="#06b6d4" letter-spacing="1.5">AGENTHUB HUD CORE // CONVERSATION &amp; SESSION ARCHITECTURE</text>
    <text x="960" y="4" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="500" fill="#94a3b8">Interactive Deck · Rollback Checkpoints · Onboarding</text>
  </g>

  <!-- 3-Column Architecture Layout -->
  
  <!-- COLUMN 1: Session Header & Control Deck -->
  <g transform="translate(56, 92)" filter="url(#shadow-card)">
    <rect width="360" height="536" rx="14" fill="#0a0e17" stroke="#202b3f" stroke-width="1.5" />
    <rect width="360" height="42" rx="14" fill="#0c1220" />
    <path d="M 0 42 L 360 42" stroke="#202b3f" stroke-width="1" />
    
    <circle cx="24" cy="21" r="5" fill="#06b6d4" />
    <text x="40" y="25" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700" fill="#f1f5f9">1. Session Header &amp; Deck</text>

    <!-- Card Body -->
    <g transform="translate(20, 60)">
      <text x="0" y="16" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="600" fill="#94a3b8">Barra superior modular integrada:</text>

      <!-- Mockup Header -->
      <g transform="translate(0, 28)">
        <rect width="320" height="44" rx="8" fill="#07090e" stroke="#202b3f" stroke-width="1" />
        <circle cx="18" cy="22" r="5" fill="#10b981" />
        <text x="32" y="26" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600" fill="#f1f5f9">portafolio / <tspan fill="#38bdf8">agent-hub</tspan></text>
        
        <rect x="230" y="10" width="76" height="24" rx="6" fill="#0c1220" stroke="#202b3f" stroke-width="1" />
        <text x="244" y="26" font-family="'JetBrains Mono', monospace" font-size="10" fill="#06b6d4">Controles ⌄</text>
      </g>

      <!-- Control Deck Expanded Card -->
      <g transform="translate(0, 88)">
        <rect width="320" height="220" rx="10" fill="#07090e" stroke="#202b3f" stroke-width="1" />
        <text x="14" y="24" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#06b6d4">Deck de Controles Tácticos</text>
        
        <!-- Controls row -->
        <g transform="translate(14, 38)">
          <rect width="138" height="32" rx="6" fill="#0c1220" stroke="#202b3f" stroke-width="1" />
          <text x="10" y="20" font-family="'JetBrains Mono', monospace" font-size="10" fill="#cbd5e1">Esfuerzo: <tspan fill="#06b6d4">Alto</tspan></text>

          <rect x="150" y="0" width="142" height="32" rx="6" fill="#0c1220" stroke="#202b3f" stroke-width="1" />
          <text x="160" y="20" font-family="'JetBrains Mono', monospace" font-size="10" fill="#cbd5e1">Rol: <tspan fill="#10b981">Desarrollador</tspan></text>
        </g>

        <!-- Context window meter -->
        <g transform="translate(14, 82)">
          <text x="0" y="14" font-family="'JetBrains Mono', monospace" font-size="10" fill="#94a3b8">Ventana Contexto (18.4k / 200k)</text>
          <text x="290" y="14" text-anchor="end" font-family="'JetBrains Mono', monospace" font-size="10" fill="#10b981">9.2%</text>
          <rect y="22" width="292" height="6" rx="3" fill="#0c1220" stroke="#202b3f" stroke-width="0.5" />
          <rect y="22" width="27" height="6" rx="3" fill="#06b6d4" />
        </g>

        <!-- Session Budget meter -->
        <g transform="translate(14, 134)">
          <text x="0" y="14" font-family="'JetBrains Mono', monospace" font-size="10" fill="#94a3b8">Gasto Acumulado: <tspan fill="#10b981">$0.0412</tspan></text>
          <text x="290" y="14" text-anchor="end" font-family="'JetBrains Mono', monospace" font-size="10" fill="#cbd5e1">Límite: $2.00</text>
          <rect y="22" width="292" height="6" rx="3" fill="#0c1220" stroke="#202b3f" stroke-width="0.5" />
          <rect y="22" width="6" height="6" rx="3" fill="#10b981" />
        </g>

        <!-- Permissions selector -->
        <g transform="translate(14, 182)">
          <rect width="292" height="26" rx="5" fill="#0c1220" stroke="#202b3f" stroke-width="1" />
          <text x="10" y="17" font-family="'JetBrains Mono', monospace" font-size="10" fill="#94a3b8">Permisos: <tspan fill="#cbd5e1">Lectura y Escritura (full)</tspan></text>
        </g>
      </g>

      <!-- Key Benefits Card -->
