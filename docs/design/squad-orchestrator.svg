<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%" style="background:#07090e; font-family: Inter, system-ui, sans-serif;">
  <defs>
    <!-- Background Gradients -->
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="65%">
      <stop offset="0%" stop-color="#1e1b4b" stop-opacity="0.4" />
      <stop offset="60%" stop-color="#0e131f" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#07090e" stop-opacity="1" />
    </radialGradient>

    <!-- Node Glows -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="coreGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="14" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Beam Gradients -->
    <linearGradient id="beamArch" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="beamDev" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="beamTest" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#10b981" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="beamRev" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="beamDebug" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#f43f5e" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="beamDesign" x1="100%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#ec4899" stop-opacity="0.9"/>
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="tacticalGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#162035" stroke-width="1" stroke-opacity="0.6"/>
      <circle cx="0" cy="0" r="1.5" fill="#2a3750"/>
    </pattern>
  </defs>

  <!-- Dark Tactical Canvas -->
  <rect width="800" height="500" fill="url(#bgGlow)"/>
  <rect width="800" height="500" fill="url(#tacticalGrid)"/>

  <!-- Orbital Range Rings -->
  <circle cx="400" cy="250" r="190" fill="none" stroke="#202b3f" stroke-width="1.5" stroke-dasharray="6 8"/>
  <circle cx="400" cy="250" r="120" fill="none" stroke="#202b3f" stroke-width="1.2" stroke-opacity="0.7"/>
  <circle cx="400" cy="250" r="60" fill="none" stroke="#6366f1" stroke-width="1" stroke-opacity="0.3" stroke-dasharray="4 4"/>

  <!-- Neural Beams (Connection paths) -->
  <!-- Center (400, 250) to Arquitecto (400, 70) -->
  <line x1="400" y1="250" x2="400" y2="70" stroke="url(#beamArch)" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Center to Tester (580, 150) -->
  <line x1="400" y1="250" x2="580" y2="150" stroke="url(#beamTest)" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Center to Desarrollador (580, 350) -->
  <line x1="400" y1="250" x2="580" y2="350" stroke="url(#beamDev)" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Center to Revisor (400, 430) -->
  <line x1="400" y1="250" x2="400" y2="430" stroke="url(#beamRev)" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Center to Depurador (220, 350) -->
  <line x1="400" y1="250" x2="220" y2="350" stroke="url(#beamDebug)" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Center to Diseñador (220, 150) -->
  <line x1="400" y1="250" x2="220" y2="150" stroke="url(#beamDesign)" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Inter-agent handoff arcs -->
  <!-- Arquitecto -> Tester -->
  <path d="M 425 80 Q 530 90 570 135" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="4 4" stroke-opacity="0.6"/>
  <!-- Tester -> Desarrollador -->
  <path d="M 595 175 Q 630 250 595 325" fill="none" stroke="#10b981" stroke-width="1.5" stroke-dasharray="4 4" stroke-opacity="0.6"/>
  <!-- Desarrollador -> Revisor -->
  <path d="M 565 365 Q 510 420 425 435" fill="none" stroke="#a855f7" stroke-width="1.5" stroke-dasharray="4 4" stroke-opacity="0.6"/>

  <!-- Satellite Nodes -->

  <!-- 1. Arquitecto (Top) -->
  <g transform="translate(400, 70)" filter="url(#glow)">
    <circle r="26" fill="#0c192e" stroke="#38bdf8" stroke-width="2"/>
    <circle r="12" fill="#38bdf8" fill-opacity="0.2"/>
    <!-- Icon Blueprint / Compass -->
    <path d="M -8 6 L 0 -10 L 8 6 M -5 0 L 5 0" stroke="#38bdf8" stroke-width="2" stroke-linecap="round"/>
    <text y="42" text-anchor="middle" fill="#93c5fd" font-size="11" font-weight="700" letter-spacing="0.05em">ARQUITECTO</text>
    <text y="54" text-anchor="middle" fill="#64748b" font-size="9" font-family="monospace">ESPECIFICAR</text>
  </g>

  <!-- 2. Tester (Top-Right) -->
  <g transform="translate(580, 150)" filter="url(#glow)">
    <circle r="26" fill="#06241a" stroke="#10b981" stroke-width="2"/>
    <circle r="12" fill="#10b981" fill-opacity="0.2"/>
    <!-- Checkmark Icon -->
    <path d="M -7 1 L -2 6 L 8 -5" stroke="#10b981" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <text y="42" text-anchor="middle" fill="#6ee7b7" font-size="11" font-weight="700" letter-spacing="0.05em">TESTER</text>
    <text y="54" text-anchor="middle" fill="#64748b" font-size="9" font-family="monospace">VALIDAR</text>
  </g>

  <!-- 3. Desarrollador (Bottom-Right) -->
  <g transform="translate(580, 350)" filter="url(#glow)">
    <circle r="26" fill="#201035" stroke="#a855f7" stroke-width="2"/>
    <circle r="12" fill="#a855f7" fill-opacity="0.2"/>
    <!-- Code Brackets Icon -->
    <path d="M -7 -4 L -11 0 L -7 4 M 7 -4 L 11 0 L 7 4 M -2 7 L 2 -7" stroke="#c084fc" stroke-width="2" stroke-linecap="round"/>
    <text y="42" text-anchor="middle" fill="#d8b4fe" font-size="11" font-weight="700" letter-spacing="0.05em">DESARROLLADOR</text>
    <text y="54" text-anchor="middle" fill="#64748b" font-size="9" font-family="monospace">IMPLEMENTAR</text>
  </g>

  <!-- 4. Revisor (Bottom) -->
  <g transform="translate(400, 430)" filter="url(#glow)">
    <circle r="26" fill="#291a08" stroke="#f59e0b" stroke-width="2"/>
    <circle r="12" fill="#f59e0b" fill-opacity="0.2"/>
    <!-- Shield Icon -->
    <path d="M 0 -8 L 8 -4 C 8 4 0 9 0 9 C 0 9 -8 4 -8 -4 Z" fill="none" stroke="#fbbf24" stroke-width="2"/>
    <text y="42" text-anchor="middle" fill="#fde68a" font-size="11" font-weight="700" letter-spacing="0.05em">REVISOR</text>
    <text y="54" text-anchor="middle" fill="#64748b" font-size="9" font-family="monospace">AUDITORÍA</text>
  </g>

  <!-- 5. Depurador (Bottom-Left) -->
  <g transform="translate(220, 350)" filter="url(#glow)">
    <circle r="26" fill="#2e0d16" stroke="#f43f5e" stroke-width="2"/>
    <circle r="12" fill="#f43f5e" fill-opacity="0.2"/>
    <!-- Bug Icon -->
    <circle cx="0" cy="0" r="5" stroke="#fda4af" stroke-width="2" fill="none"/>
    <path d="M -8 -4 L -5 -2 M -8 0 L -5 0 M -8 4 L -5 2 M 8 -4 L 5 -2 M 8 0 L 5 0 M 8 4 L 5 2" stroke="#fda4af" stroke-width="1.8"/>
    <text y="42" text-anchor="middle" fill="#fca5a5" font-size="11" font-weight="700" letter-spacing="0.05em">DEPURADOR</text>
    <text y="54" text-anchor="middle" fill="#64748b" font-size="9" font-family="monospace">RAÍZ DEL ERROR</text>
  </g>

  <!-- 6. Diseñador (Top-Left) -->
  <g transform="translate(220, 150)" filter="url(#glow)">
    <circle r="26" fill="#2a0f21" stroke="#ec4899" stroke-width="2"/>
    <circle r="12" fill="#ec4899" fill-opacity="0.2"/>
    <!-- Palette Icon -->
    <circle cx="-3" cy="-3" r="2" fill="#f472b6"/>
    <circle cx="3" cy="-3" r="2" fill="#f472b6"/>
    <circle cx="4" cy="3" r="2" fill="#f472b6"/>
    <path d="M 0 -8 C 6 -8 8 -2 8 2 C 8 6 5 8 2 8 C -1 8 -3 6 -5 4 C -7 2 -8 -2 -8 -4 C -8 -7 -4 -8 0 -8 Z" fill="none" stroke="#f472b6" stroke-width="1.8"/>
    <text y="42" text-anchor="middle" fill="#fbcfe8" font-size="11" font-weight="700" letter-spacing="0.05em">DISEÑADOR</text>
    <text y="54" text-anchor="middle" fill="#64748b" font-size="9" font-family="monospace">UI / IDENTIDAD</text>
  </g>

  <!-- Central Singularity / Orchestrator Hub -->
  <g transform="translate(400, 250)" filter="url(#coreGlow)">
    <!-- Concentric core rings -->
    <circle r="46" fill="#0e131f" stroke="#6366f1" stroke-width="3"/>
    <circle r="36" fill="#131a29" stroke="#818cf8" stroke-width="1.5" stroke-dasharray="4 3"/>
    <circle r="24" fill="#1e1b4b" stroke="#38bdf8" stroke-width="1.5"/>

    <!-- Central Hexagon / Signal Core -->
    <polygon points="0,-14 12,-7 12,7 0,14 -12,7 -12,-7" fill="#6366f1" fill-opacity="0.4" stroke="#a5b4fc" stroke-width="2"/>
    <circle r="4" fill="#ffffff"/>

    <text y="62" text-anchor="middle" fill="#ffffff" font-size="12" font-weight="800" letter-spacing="0.1em">SQUAD ORCHESTRATOR</text>
    <text y="75" text-anchor="middle" fill="#818cf8" font-size="9" font-family="monospace">AGENTHUB CORE</text>
  </g>
</svg>
