<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 900" width="1400" height="900">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#05070c"/>
      <stop offset="50%" stop-color="#070a13"/>
      <stop offset="100%" stop-color="#0a101f"/>
    </linearGradient>

    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#14b8a6"/>
    </linearGradient>

    <linearGradient id="roseGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f43f5e"/>
      <stop offset="100%" stop-color="#e11d48"/>
    </linearGradient>

    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>

    <!-- Card Backgrounds -->
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0e1526" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#080c18" stop-opacity="0.98"/>
    </linearGradient>

    <!-- Glow & Shadow Filters -->
    <filter id="cyanGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.65"/>
    </filter>

    <!-- Tactical Grid Pattern -->
    <pattern id="tacticalGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#162238" stroke-width="0.5" stroke-opacity="0.4"/>
      <circle cx="40" cy="40" r="1" fill="#06b6d4" fill-opacity="0.25"/>
    </pattern>
  </defs>

  <!-- Deep Obsidian Canvas -->
  <rect width="1400" height="900" fill="url(#bgGrad)"/>
  <rect width="1400" height="900" fill="url(#tacticalGrid)"/>

  <!-- Top Accent Beam -->
  <rect x="0" y="0" width="1400" height="3" fill="url(#cyanGrad)"/>

  <!-- ================= HEADER SECTION ================= -->
  <g transform="translate(60, 45)">
    <!-- Header Badge -->
    <rect x="0" y="0" width="180" height="26" rx="6" fill="#06b6d4" fill-opacity="0.12" stroke="#06b6d4" stroke-opacity="0.35"/>
    <text x="12" y="17" font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="11" font-weight="700" fill="#22d3ee" letter-spacing="1.5">SPEC CARD #43 • HUD</text>

    <!-- Title & Subtitle -->
    <text x="0" y="58" font-family="'Inter', system-ui, sans-serif" font-size="26" font-weight="800" fill="#f8fafc" letter-spacing="-0.5">Tactical Notifications &amp; Shortcuts Engine Architecture</text>
    <text x="0" y="82" font-family="'Inter', system-ui, sans-serif" font-size="13" font-weight="400" fill="#94a3b8">Bandeja de avisos en tiempo real, detección de fallos críticos, mapeo de 22 atajos tácticos y teclas físicas &lt;kbd&gt;</text>

    <!-- Status Indicators Right -->
    <g transform="translate(1080, 5)">
      <rect x="0" y="0" width="195" height="34" rx="8" fill="#0a0f1d" stroke="#202b3f" stroke-width="1"/>
      <circle cx="20" cy="17" r="4.5" fill="#10b981" filter="url(#cyanGlow)"/>
      <text x="34" y="21" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#34d399">ACCESSIBILITY: AAA</text>
    </g>
  </g>

  <!-- ================= PANEL 1: NOTIFICATIONS HUB ================= -->
  <g transform="translate(60, 160)" filter="url(#cardShadow)">
    <rect width="610" height="680" rx="16" fill="url(#cardBg)" stroke="#1e2c45" stroke-width="1.2"/>

    <!-- Top Bar inside Panel 1 -->
    <rect width="610" height="48" rx="16" fill="#0a101d" stroke="#1a253a" stroke-width="1"/>
    <circle cx="28" cy="24" r="5" fill="#06b6d4"/>
    <text x="44" y="28" font-family="'Inter', sans-serif" font-size="14" font-weight="700" fill="#f1f5f9">Reactive Notifications &amp; Alerts Dispatcher</text>
    <text x="470" y="28" font-family="'JetBrains Mono', monospace" font-size="11" fill="#64748b">NOTIFICATIONS.TSX</text>

    <!-- Bell Component Breakdown -->
    <g transform="translate(24, 70)">
      <rect width="562" height="150" rx="14" fill="#090e1a" stroke="#1e2c45"/>
      <text x="16" y="24" font-family="'Inter', sans-serif" font-size="12" font-weight="700" fill="#f8fafc">Anatomía de la Campana Táctica (Header HUD)</text>

      <!-- Simulated Bell Trigger -->
      <g transform="translate(20, 48)">
        <rect width="40" height="40" rx="10" fill="#162035" stroke="#202b3f"/>
        <path d="M 20 12 C 16 12 14 15 14 19 L 14 23 L 12 25 L 12 26 L 28 26 L 28 25 L 26 23 L 26 19 C 26 15 24 12 20 12 Z M 18 27 C 18 28.1 18.9 29 20 29 C 21.1 29 22 28.1 22 27 Z" fill="#22d3ee"/>
        <!-- Badge -->
        <rect x="25" y="-3" width="18" height="18" rx="9" fill="#e11d48" stroke="#05070c" stroke-width="2"/>
        <text x="31" y="10" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="800" fill="#ffffff">3</text>
      </g>

      <g transform="translate(85, 48)">
        <text x="0" y="14" font-family="'Inter', sans-serif" font-size="12" font-weight="700" fill="#f8fafc">Campana con Badging Inteligente</text>
        <text x="0" y="32" font-family="'JetBrains Mono', monospace" font-size="10" fill="#94a3b8">unread = notices.length - (readIndex + 1)</text>
        <text x="0" y="48" font-family="'Inter', sans-serif" font-size="11" fill="#cbd5e1">Si hay avisos con error/fallo: badge rojo <tspan fill="#f43f5e">#e11d48</tspan>; si son ordinarios: <tspan fill="#06b6d4">#06b6d4</tspan>.</text>
      </g>

      <!-- Logic Banner -->
      <g transform="translate(16, 105)">
        <rect width="530" height="30" rx="6" fill="#050811" stroke="#1c273e"/>
        <text x="12" y="19" font-family="'JetBrains Mono', monospace" font-size="10" fill="#22d3ee">Filtro de fallos: /fall|error|no se pudo/i.test(notice.text) → Auto-alerta sonora</text>
      </g>
    </g>

    <!-- Simulated Dropdown Popover List -->
    <g transform="translate(24, 235)">
      <rect width="562" height="420" rx="14" fill="#0a0f1d" stroke="#1f2d47"/>
      <text x="16" y="24" font-family="'Inter', sans-serif" font-size="12" font-weight="700" fill="#f8fafc">Bandeja Desplegable de Avisos (Popover z-50)</text>

      <!-- Item 1: Failure -->
      <g transform="translate(16, 40)">
        <rect width="530" height="74" rx="10" fill="#450a0a" fill-opacity="0.3" stroke="#991b1b" stroke-opacity="0.5"/>
        <circle cx="24" cy="24" r="8" fill="#f43f5e" fill-opacity="0.2"/>
        <text x="44" y="24" font-family="'Inter', sans-serif" font-size="12" font-weight="700" fill="#fca5a5">Fallo de compilación en hook post-commit</text>
        <text x="44" y="42" font-family="'JetBrains Mono', monospace" font-size="10" fill="#fecaca">Error TS2322: Type 'string' is not assignable to type 'number'</text>
        <text x="44" y="58" font-family="'JetBrains Mono', monospace" font-size="9" fill="#94a3b8">hace 2 min • <tspan fill="#22d3ee">Ir a sesión #feat-auth</tspan></text>
      </g>

      <!-- Item 2: Success -->
      <g transform="translate(16, 122)">
        <rect width="530" height="74" rx="10" fill="#07090e" stroke="#1f2d47"/>
        <circle cx="24" cy="24" r="8" fill="#10b981" fill-opacity="0.2"/>
        <text x="44" y="24" font-family="'Inter', sans-serif" font-size="12" font-weight="700" fill="#f8fafc">Tests de flujos completados exitosamente</text>
        <text x="44" y="42" font-family="'JetBrains Mono', monospace" font-size="10" fill="#34d399">14 de 14 tests aprobados en 62ms (0 regresiones)</text>
        <text x="44" y="58" font-family="'JetBrains Mono', monospace" font-size="9" fill="#94a3b8">hace 8 min • <tspan fill="#22d3ee">Ir a sesión #test-runner</tspan></text>
      </g>

      <!-- Item 3: Information -->
      <g transform="translate(16, 204)">
        <rect width="530" height="74" rx="10" fill="#07090e" stroke="#1f2d47"/>
        <circle cx="24" cy="24" r="8" fill="#06b6d4" fill-opacity="0.2"/>
        <text x="44" y="24" font-family="'Inter', sans-serif" font-size="12" font-weight="700" fill="#f8fafc">Nuevo servidor MCP vinculado al portafolio</text>
        <text x="44" y="42" font-family="'JetBrains Mono', monospace" font-size="10" fill="#cbd5e1">11 herramientas registradas en Claude y Google Antigravity</text>
        <text x="44" y="58" font-family="'JetBrains Mono', monospace" font-size="9" fill="#94a3b8">hace 25 min • <tspan fill="#22d3ee">Ir a MCP Manager</tspan></text>
      </g>

      <!-- Item 4: Quota Notice -->
      <g transform="translate(16, 286)">
        <rect width="530" height="74" rx="10" fill="#07090e" stroke="#1f2d47"/>
        <circle cx="24" cy="24" r="8" fill="#f59e0b" fill-opacity="0.2"/>
        <text x="44" y="24" font-family="'Inter', sans-serif" font-size="12" font-weight="700" fill="#f8fafc">Aviso de cuota de ventana al 78%</text>
        <text x="44" y="42" font-family="'JetBrains Mono', monospace" font-size="10" fill="#fde68a">Ventana de 5 horas cerca del umbral de advertencia (85%)</text>
        <text x="44" y="58" font-family="'JetBrains Mono', monospace" font-size="9" fill="#94a3b8">hace 40 min • <tspan fill="#22d3ee">Ir a Telemetría</tspan></text>
      </g>

      <!-- Footer Action -->
      <g transform="translate(16, 375)">
        <text x="0" y="16" font-family="'JetBrains Mono', monospace" font-size="10" fill="#64748b">Historial de avisos persistido en memoria de sesión • Esc para cerrar</text>
      </g>
    </g>
  </g>

  <!-- ================= PANEL 2: KEYBOARD SHORTCUTS MATRIX ================= -->
  <g transform="translate(730, 160)" filter="url(#cardShadow)">
    <rect width="610" height="680" rx="16" fill="url(#cardBg)" stroke="#1e2c45" stroke-width="1.2"/>

    <!-- Top Bar inside Panel 2 -->
    <rect width="610" height="48" rx="16" fill="#0a101d" stroke="#1a253a" stroke-width="1"/>
    <circle cx="28" cy="24" r="5" fill="#a855f7"/>
    <text x="44" y="28" font-family="'Inter', sans-serif" font-size="14" font-weight="700" fill="#f1f5f9">Keyboard Shortcuts Matrix &amp; Keycap Architecture</text>
    <text x="460" y="28" font-family="'JetBrains Mono', monospace" font-size="11" fill="#64748b">SHORTCUTSMODAL.TSX</text>

    <!-- Category Filter Strip Architecture -->
    <g transform="translate(24, 70)">
      <rect width="562" height="68" rx="14" fill="#090e1a" stroke="#1e2c45"/>
      <text x="16" y="20" font-family="'Inter', sans-serif" font-size="10" font-weight="700" fill="#64748b" letter-spacing="1">CATEGORÍAS SEMÁNTICAS</text>

      <g transform="translate(16, 30)">
        <!-- Pill 1 -->
        <rect width="58" height="24" rx="6" fill="#06b6d4" fill-opacity="0.2" stroke="#22d3ee"/>
        <text x="12" y="16" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" fill="#22d3ee">Todos</text>

        <!-- Pill 2 -->
        <g transform="translate(66, 0)">
          <rect width="78" height="24" rx="6" fill="#082f49" stroke="#0284c7"/>
          <text x="10" y="16" font-family="'JetBrains Mono', monospace" font-size="10" fill="#38bdf8">Navegación</text>
        </g>

        <!-- Pill 3 -->
        <g transform="translate(152, 0)">
          <rect width="54" height="24" rx="6" fill="#1e1b4b" stroke="#4338ca"/>
          <text x="12" y="16" font-family="'JetBrains Mono', monospace" font-size="10" fill="#818cf8">Chat</text>
        </g>

        <!-- Pill 4 -->
        <g transform="translate(214, 0)">
          <rect width="68" height="24" rx="6" fill="#451a03" stroke="#b45309"/>
          <text x="10" y="16" font-family="'JetBrains Mono', monospace" font-size="10" fill="#fbbf24">Ventanas</text>
        </g>

        <!-- Pill 5 -->
        <g transform="translate(290, 0)">
          <rect width="90" height="24" rx="6" fill="#064e3b" stroke="#047857"/>
          <text x="10" y="16" font-family="'JetBrains Mono', monospace" font-size="10" fill="#34d399">Herramientas</text>
        </g>

        <!-- Pill 6 -->
        <g transform="translate(388, 0)">
          <rect width="62" height="24" rx="6" fill="#3b0764" stroke="#7e22ce"/>
          <text x="10" y="16" font-family="'JetBrains Mono', monospace" font-size="10" fill="#c084fc">Agente</text>
        </g>
      </g>
    </g>

    <!-- Keycap Physical Anatomy Callout -->
    <g transform="translate(24, 150)">
      <rect width="562" height="110" rx="14" fill="#0c1220" stroke="#06b6d4" stroke-width="1.2" stroke-opacity="0.3"/>
      <text x="16" y="24" font-family="'Inter', sans-serif" font-size="12" font-weight="700" fill="#f8fafc">Anatomía de Tecla Física &lt;kbd&gt; (Biselado HUD)</text>

      <!-- Keycap 1 -->
      <g transform="translate(20, 42)">
        <rect width="65" height="42" rx="8" fill="#070b14" stroke="#202b3f" stroke-width="1.2"/>
        <line x1="2" y1="40" x2="63" y2="40" stroke="#162035" stroke-width="2"/>
        <text x="14" y="26" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="800" fill="#22d3ee">Ctrl</text>
      </g>

      <text x="95" y="68" font-family="'JetBrains Mono', monospace" font-size="14" font-weight="800" fill="#64748b">+</text>

      <!-- Keycap 2 -->
      <g transform="translate(115, 42)">
        <rect width="50" height="42" rx="8" fill="#070b14" stroke="#202b3f" stroke-width="1.2"/>
        <line x1="2" y1="40" x2="48" y2="40" stroke="#162035" stroke-width="2"/>
        <text x="18" y="26" font-family="'JetBrains Mono', monospace" font-size="14" font-weight="800" fill="#22d3ee">K</text>
      </g>

      <g transform="translate(180, 50)">
        <text x="0" y="14" font-family="'Inter', sans-serif" font-size="12" font-weight="700" fill="#f8fafc">CSS Keycap Styling:</text>
        <text x="0" y="30" font-family="'JetBrains Mono', monospace" font-size="10" fill="#94a3b8">shadow-[inset_0_-2px_0_#162035,0_1px_2px_rgba(0,0,0,0.5)]</text>
      </g>
    </g>

    <!-- Key Shortcuts Table -->
    <g transform="translate(24, 275)">
      <rect width="562" height="380" rx="14" fill="#090e1a" stroke="#1e2c45"/>
      <text x="16" y="24" font-family="'Inter', sans-serif" font-size="12" font-weight="700" fill="#f8fafc">Mapeo de Atajos Frecuentes del HUD</text>

      <!-- Row 1 -->
      <g transform="translate(16, 40)">
        <rect width="530" height="42" rx="8" fill="#0b101c" stroke="#182338"/>
        <text x="16" y="26" font-family="'Inter', sans-serif" font-size="12" font-weight="500" fill="#e2e8f0">Paleta global de comandos y acciones</text>
        <rect x="420" y="9" width="95" height="24" rx="6" fill="#070b14" stroke="#202b3f"/>
        <text x="438" y="25" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#22d3ee">Ctrl K</text>
      </g>

      <!-- Row 2 -->
      <g transform="translate(16, 88)">
        <rect width="530" height="42" rx="8" fill="#0b101c" stroke="#182338"/>
        <text x="16" y="26" font-family="'Inter', sans-serif" font-size="12" font-weight="500" fill="#e2e8f0">Lanzador rápido flotante (Spotlight Bar)</text>
        <rect x="400" y="9" width="115" height="24" rx="6" fill="#070b14" stroke="#202b3f"/>
        <text x="412" y="25" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#22d3ee">Alt Espacio</text>
      </g>

      <!-- Row 3 -->
      <g transform="translate(16, 136)">
        <rect width="530" height="42" rx="8" fill="#0b101c" stroke="#182338"/>
        <text x="16" y="26" font-family="'Inter', sans-serif" font-size="12" font-weight="500" fill="#e2e8f0">Terminal integrada CRT con ANSI y shells</text>
        <rect x="425" y="9" width="90" height="24" rx="6" fill="#070b14" stroke="#202b3f"/>
        <text x="446" y="25" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#22d3ee">Ctrl `</text>
      </g>

      <!-- Row 4 -->
      <g transform="translate(16, 184)">
        <rect width="530" height="42" rx="8" fill="#0b101c" stroke="#182338"/>
        <text x="16" y="26" font-family="'Inter', sans-serif" font-size="12" font-weight="500" fill="#e2e8f0">Panel de archivos y diffs de Git Worktree</text>
        <rect x="425" y="9" width="90" height="24" rx="6" fill="#070b14" stroke="#202b3f"/>
        <text x="444" y="25" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#22d3ee">Ctrl B</text>
      </g>

      <!-- Row 5 -->
      <g transform="translate(16, 232)">
        <rect width="530" height="42" rx="8" fill="#0b101c" stroke="#182338"/>
        <text x="16" y="26" font-family="'Inter', sans-serif" font-size="12" font-weight="500" fill="#e2e8f0">Activar o desactivar modo «Plan primero»</text>
        <rect x="390" y="9" width="125" height="24" rx="6" fill="#070b14" stroke="#202b3f"/>
        <text x="400" y="25" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#22d3ee">Ctrl Shift P</text>
      </g>

      <!-- Row 6 -->
      <g transform="translate(16, 280)">
        <rect width="530" height="42" rx="8" fill="#0b101c" stroke="#182338"/>
        <text x="16" y="26" font-family="'Inter', sans-serif" font-size="12" font-weight="500" fill="#e2e8f0">Iniciar o detener el dictado de voz nativo</text>
        <rect x="390" y="9" width="125" height="24" rx="6" fill="#070b14" stroke="#202b3f"/>
        <text x="400" y="25" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#22d3ee">Ctrl Shift D</text>
      </g>

      <!-- Footer Info -->
      <g transform="translate(16, 345)">
        <text x="0" y="16" font-family="'JetBrains Mono', monospace" font-size="10" fill="#64748b">22 atajos mapeados con prevención de conflictos con el navegador y VS Code</text>
      </g>
    </g>
  </g>

  <!-- ================= FOOTER / ARCHITECTURE CREDITS ================= -->
  <g transform="translate(60, 860)">
    <text x="0" y="15" font-family="'JetBrains Mono', monospace" font-size="11" fill="#475569">AGENTHUB PROTOCOL SPECIFICATION • 100% PURIFIED HUD TOKENS • WCAG AAA READY</text>
    <text x="1060" y="15" font-family="'JetBrains Mono', monospace" font-size="11" fill="#06b6d4">14/14 TESTS PASSING • BUNDLE: 847 kB</text>
  </g>
</svg>
