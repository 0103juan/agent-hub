<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 900" width="1400" height="900">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#05070c"/>
      <stop offset="50%" stop-color="#070a13"/>
      <stop offset="100%" stop-color="#0a101f"/>
    </linearGradient>

    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#14b8a6"/>
    </linearGradient>

    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>

    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>

    <!-- Card Backgrounds -->
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0e1526" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#080c18" stop-opacity="0.98"/>
    </linearGradient>

    <!-- Glow & Shadow Filters -->
    <filter id="cyanGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.65"/>
    </filter>

    <!-- Tactical Grid Pattern -->
    <pattern id="tacticalGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#162238" stroke-width="0.5" stroke-opacity="0.4"/>
      <circle cx="40" cy="40" r="1" fill="#06b6d4" fill-opacity="0.25"/>
    </pattern>
  </defs>

  <!-- Deep Obsidian Canvas -->
  <rect width="1400" height="900" fill="url(#bgGrad)"/>
  <rect width="1400" height="900" fill="url(#tacticalGrid)"/>

  <!-- Top Accent Beam -->
  <rect x="0" y="0" width="1400" height="3" fill="url(#cyanGrad)"/>

  <!-- ================= HEADER SECTION ================= -->
  <g transform="translate(60, 45)">
    <!-- Header Badge -->
    <rect x="0" y="0" width="180" height="26" rx="6" fill="#06b6d4" fill-opacity="0.12" stroke="#06b6d4" stroke-opacity="0.35"/>
    <text x="12" y="17" font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="11" font-weight="700" fill="#22d3ee" letter-spacing="1.5">SPEC CARD #42 • HUD</text>

    <!-- Title & Subtitle -->
    <text x="0" y="58" font-family="'Inter', system-ui, sans-serif" font-size="26" font-weight="800" fill="#f8fafc" letter-spacing="-0.5">MCP Mesh, Memory Matrix &amp; Split Workspace Architecture</text>
    <text x="0" y="82" font-family="'Inter', system-ui, sans-serif" font-size="13" font-weight="400" fill="#94a3b8">Sincronización multi-proveedor de herramientas, inyección de memoria persistente, drawer jerárquico y 100% token purity</text>

    <!-- Status Indicators Right -->
    <g transform="translate(1080, 5)">
      <rect x="0" y="0" width="195" height="34" rx="8" fill="#0a0f1d" stroke="#202b3f" stroke-width="1"/>
      <circle cx="20" cy="17" r="4.5" fill="#10b981" filter="url(#cyanGlow)"/>
      <text x="34" y="21" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#34d399">ZERO INDIGO RESIDUALS</text>
    </g>
  </g>

  <!-- ================= PANEL 1: MCP MESH NETWORK ================= -->
  <g transform="translate(60, 160)" filter="url(#cardShadow)">
    <rect width="610" height="680" rx="16" fill="url(#cardBg)" stroke="#1e2c45" stroke-width="1.2"/>

    <!-- Panel 1 Top Bar -->
    <rect width="610" height="48" rx="16" fill="#0a101d" stroke="#1a253a" stroke-width="1"/>
    <circle cx="28" cy="24" r="5" fill="#10b981"/>
    <text x="44" y="28" font-family="'Inter', sans-serif" font-size="14" font-weight="700" fill="#f1f5f9">MCP Mesh &amp; Tool Context Sync Engine</text>
    <text x="480" y="28" font-family="'JetBrains Mono', monospace" font-size="11" fill="#64748b">MCPMANAGER.TSX</text>

    <!-- Top Sync Status & Dual Providers -->
    <g transform="translate(24, 70)">
      <!-- Box Claude -->
      <g>
        <rect width="270" height="68" rx="12" fill="#0c1220" stroke="#f97316" stroke-opacity="0.3"/>
        <text x="16" y="22" font-family="'Inter', sans-serif" font-size="10" font-weight="700" fill="#fb923c" letter-spacing="1">CLAUDE DESKTOP / CODE</text>
        <text x="16" y="44" font-family="'JetBrains Mono', monospace" font-size="16" font-weight="800" fill="#f8fafc">11 Servidores</text>
        <text x="16" y="58" font-family="'JetBrains Mono', monospace" font-size="9" fill="#94a3b8">~/.claude/claude_desktop_config.json</text>
      </g>

      <!-- Box Google Antigravity -->
      <g transform="translate(292, 0)">
        <rect width="270" height="68" rx="12" fill="#0c1220" stroke="#06b6d4" stroke-opacity="0.3"/>
        <text x="16" y="22" font-family="'Inter', sans-serif" font-size="10" font-weight="700" fill="#22d3ee" letter-spacing="1">GOOGLE ANTIGRAVITY (AGY)</text>
        <text x="16" y="44" font-family="'JetBrains Mono', monospace" font-size="16" font-weight="800" fill="#f8fafc">11 Servidores</text>
        <text x="16" y="58" font-family="'JetBrains Mono', monospace" font-size="9" fill="#94a3b8">~/.gemini/antigravity-cli/mcp/</text>
      </g>
    </g>

    <!-- MCP Server Cards in Mesh -->
    <g transform="translate(24, 155)">
      <rect width="562" height="340" rx="14" fill="#090e1a" stroke="#1e2c45"/>
      <text x="16" y="24" font-family="'Inter', sans-serif" font-size="12" font-weight="700" fill="#f8fafc">Servidores Activos en la Malla MCP</text>

      <!-- Server 1: filesystem -->
      <g transform="translate(16, 42)">
        <rect width="530" height="62" rx="10" fill="#0d1424" stroke="#1f2d47"/>
        <circle cx="24" cy="24" r="10" fill="#10b981" fill-opacity="0.2"/>
        <text x="44" y="22" font-family="'Inter', sans-serif" font-size="12" font-weight="700" fill="#f8fafc">filesystem</text>
        <text x="44" y="38" font-family="'JetBrains Mono', monospace" font-size="10" fill="#22d3ee">15 herramientas • read_file, write_file, edit_file</text>
        <text x="44" y="52" font-family="'JetBrains Mono', monospace" font-size="9" fill="#94a3b8">Directorio permitido: C:\Users\juan0\Documents\GitHub\portafolio</text>
        <rect x="445" y="14" width="70" height="20" rx="5" fill="#10b981" fill-opacity="0.15" stroke="#10b981" stroke-opacity="0.4"/>
        <text x="456" y="28" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="700" fill="#34d399">ONLINE</text>
      </g>

      <!-- Server 2: postgres -->
      <g transform="translate(16, 114)">
        <rect width="530" height="62" rx="10" fill="#0d1424" stroke="#1f2d47"/>
        <circle cx="24" cy="24" r="10" fill="#06b6d4" fill-opacity="0.2"/>
        <text x="44" y="22" font-family="'Inter', sans-serif" font-size="12" font-weight="700" fill="#f8fafc">postgres</text>
        <text x="44" y="38" font-family="'JetBrains Mono', monospace" font-size="10" fill="#22d3ee">1 herramienta • query (Read-only SQL safety)</text>
        <text x="44" y="52" font-family="'JetBrains Mono', monospace" font-size="9" fill="#94a3b8">Host: localhost:5432 / DB: agenthub_telemetry</text>
        <rect x="445" y="14" width="70" height="20" rx="5" fill="#10b981" fill-opacity="0.15" stroke="#10b981" stroke-opacity="0.4"/>
        <text x="456" y="28" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="700" fill="#34d399">ONLINE</text>
      </g>

      <!-- Server 3: playwright -->
      <g transform="translate(16, 186)">
        <rect width="530" height="62" rx="10" fill="#0d1424" stroke="#1f2d47"/>
        <circle cx="24" cy="24" r="10" fill="#a855f7" fill-opacity="0.2"/>
        <text x="44" y="22" font-family="'Inter', sans-serif" font-size="12" font-weight="700" fill="#f8fafc">playwright</text>
        <text x="44" y="38" font-family="'JetBrains Mono', monospace" font-size="10" fill="#22d3ee">18 herramientas • browser_navigate, snapshot, click</text>
        <text x="44" y="52" font-family="'JetBrains Mono', monospace" font-size="9" fill="#94a3b8">Motor Chromium Headless para verificación E2E</text>
        <rect x="445" y="14" width="70" height="20" rx="5" fill="#10b981" fill-opacity="0.15" stroke="#10b981" stroke-opacity="0.4"/>
        <text x="456" y="28" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="700" fill="#34d399">ONLINE</text>
      </g>

      <!-- Server 4: github -->
      <g transform="translate(16, 258)">
        <rect width="530" height="62" rx="10" fill="#0d1424" stroke="#1f2d47"/>
        <circle cx="24" cy="24" r="10" fill="#06b6d4" fill-opacity="0.2"/>
        <text x="44" y="22" font-family="'Inter', sans-serif" font-size="12" font-weight="700" fill="#f8fafc">github</text>
        <text x="44" y="38" font-family="'JetBrains Mono', monospace" font-size="10" fill="#22d3ee">24 herramientas • PRs, issues, diff checks</text>
        <text x="44" y="52" font-family="'JetBrains Mono', monospace" font-size="9" fill="#94a3b8">OAuth vinculado con scope repo y pull_request</text>
        <rect x="445" y="14" width="70" height="20" rx="5" fill="#10b981" fill-opacity="0.15" stroke="#10b981" stroke-opacity="0.4"/>
        <text x="456" y="28" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="700" fill="#34d399">ONLINE</text>
      </g>
    </g>

    <!-- Bottom Synchronization Action Banner -->
    <g transform="translate(24, 515)">
      <rect width="562" height="140" rx="12" fill="#090e1a" stroke="#1e2c45"/>
      <text x="16" y="24" font-family="'Inter', sans-serif" font-size="12" font-weight="700" fill="#f8fafc">Protocolo de Salud y Sincronización Automática</text>
      
      <g transform="translate(16, 40)">
        <rect width="530" height="42" rx="8" fill="#050811" stroke="#182235"/>
        <text x="14" y="25" font-family="'JetBrains Mono', monospace" font-size="10" fill="#94a3b8">postToHost({ command: 'syncAllMcps' })</text>
        <rect x="430" y="8" width="90" height="26" rx="6" fill="url(#cyanGrad)"/>
        <text x="442" y="25" font-family="'Inter', sans-serif" font-size="10" font-weight="700" fill="#020617">Sincronizar</text>
      </g>

      <text x="16" y="105" font-family="'Inter', sans-serif" font-size="11" fill="#94a3b8">
        El host lee las definiciones MCP de ambas herramientas, verifica que las rutas relativas no escapen del proyecto y actualiza ambos ficheros JSON de configuración sin reiniciar.
      </text>
    </g>
  </g>

  <!-- ================= PANEL 2: MEMORY MATRIX & SPLIT WORKSPACE ================= -->
  <g transform="translate(730, 160)" filter="url(#cardShadow)">
    <rect width="610" height="680" rx="16" fill="url(#cardBg)" stroke="#1e2c45" stroke-width="1.2"/>

    <!-- Panel 2 Top Bar -->
    <rect width="610" height="48" rx="16" fill="#0a101d" stroke="#1a253a" stroke-width="1"/>
    <circle cx="28" cy="24" r="5" fill="#a855f7"/>
    <text x="44" y="28" font-family="'Inter', sans-serif" font-size="14" font-weight="700" fill="#f1f5f9">Memory Matrix &amp; Split Workspace Engine</text>
    <text x="470" y="28" font-family="'JetBrains Mono', monospace" font-size="11" fill="#64748b">MEMORY &amp; SPLIT.TSX</text>

    <!-- Memory Tail Injection Gauge -->
    <g transform="translate(24, 70)">
      <rect width="562" height="150" rx="14" fill="#090e1a" stroke="#1e2c45"/>
      <text x="16" y="24" font-family="'Inter', sans-serif" font-size="12" font-weight="700" fill="#f8fafc">Ventana de Inyección de Memoria (.agent-hub/experience.md)</text>
      
      <!-- Injection Gauge Bar -->
      <g transform="translate(16, 44)">
        <div class="flex">
          <text x="0" y="12" font-family="'Inter', sans-serif" font-size="11" font-weight="600" fill="#cbd5e1">Capacidad Activa: 12.8k / 20.0k caracteres inyectados en turno</text>
          <text x="480" y="12" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#34d399">64%</text>
        </div>
        <rect x="0" y="20" width="530" height="10" rx="5" fill="#050811" stroke="#1c2638"/>
        <rect x="0" y="20" width="340" height="10" rx="5" fill="url(#emeraldGrad)"/>
      </g>

      <g transform="translate(16, 95)">
        <rect width="530" height="38" rx="8" fill="#070c18" stroke="#1c273e"/>
        <text x="12" y="23" font-family="'JetBrains Mono', monospace" font-size="10" fill="#22d3ee">Estructura Ficha: [SEÑAL: Contexto de fallo] → [EVIDENCIA] → [LECCIÓN: Regla no obvia]</text>
      </g>
    </g>

    <!-- Memory Lesson Card Example -->
    <g transform="translate(24, 235)">
      <rect width="562" height="180" rx="14" fill="#0c1220" stroke="#06b6d4" stroke-width="1.2" stroke-opacity="0.35"/>
      <rect x="0" y="0" width="562" height="34" rx="14" fill="#080e1a"/>
      
      <circle cx="20" cy="17" r="4.5" fill="#22d3ee"/>
      <text x="34" y="21" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#f8fafc">LECCIÓN ESTRUCTURADA #14</text>
      <text x="460" y="21" font-family="'JetBrains Mono', monospace" font-size="10" fill="#10b981">VERIFICADA</text>

      <g transform="translate(16, 48)">
        <text x="0" y="14" font-family="'Inter', sans-serif" font-size="10" font-weight="700" fill="#f59e0b" letter-spacing="1">SEÑAL (DISPARADOR):</text>
        <text x="0" y="30" font-family="'Inter', sans-serif" font-size="11" fill="#e2e8f0">require.main === module en entorno empaquetado Electron</text>

        <text x="0" y="58" font-family="'Inter', sans-serif" font-size="10" font-weight="700" fill="#10b981" letter-spacing="1">EVIDENCIA TÉCNICA:</text>
        <text x="0" y="74" font-family="'JetBrains Mono', monospace" font-size="10" fill="#22d3ee">src/server/standalone.ts #L42-L48 • tests/flows.test.ts (14/14)</text>

        <text x="0" y="102" font-family="'Inter', sans-serif" font-size="10" font-weight="700" fill="#a855f7" letter-spacing="1">REGLA NO OBVIA APRENDIDA:</text>
        <text x="0" y="118" font-family="'Inter', sans-serif" font-size="11" fill="#cbd5e1">Validar siempre !process.versions.electron antes de auto-iniciar el servidor standalone.</text>
      </g>
    </g>

    <!-- Split Workspace 2x2 Topology & Broadcast Engine -->
    <g transform="translate(24, 430)">
      <rect width="562" height="225" rx="14" fill="#090e1a" stroke="#1e2c45"/>
      <text x="16" y="24" font-family="'Inter', sans-serif" font-size="12" font-weight="700" fill="#f8fafc">Arquitectura Split Workspace (Columnas / Cuadrícula)</text>

