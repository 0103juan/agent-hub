        <!-- Col 1 -->
        <rect width="260" height="90" rx="8" fill="#0d1424" stroke="#06b6d4" stroke-width="1.2"/>
        <rect width="260" height="22" rx="8" fill="#131e33"/>
        <text x="10" y="15" font-family="'Inter', sans-serif" font-size="10" font-weight="700" fill="#22d3ee">Chat Activo #1 (Arquitecto)</text>
        <text x="10" y="42" font-family="'JetBrains Mono', monospace" font-size="9" fill="#94a3b8">Claude 3.7 Sonnet (Thinking Active)</text>
        <text x="10" y="60" font-family="'Inter', sans-serif" font-size="10" fill="#f1f5f9">Diseño de interfaz y arquitectura...</text>

        <!-- Col 2 -->
        <g transform="translate(270, 0)">
          <rect width="260" height="90" rx="8" fill="#0d1424" stroke="#1f2d47"/>
          <rect width="260" height="22" rx="8" fill="#0a0f1d"/>
          <text x="10" y="15" font-family="'Inter', sans-serif" font-size="10" font-weight="600" fill="#94a3b8">Chat #2 (Desarrollador)</text>
          <text x="10" y="42" font-family="'JetBrains Mono', monospace" font-size="9" fill="#94a3b8">Antigravity 2.0 Flash Lite</text>
          <text x="10" y="60" font-family="'Inter', sans-serif" font-size="10" fill="#f1f5f9">Implementación de componentes...</text>
        </g>
      </g>

      <!-- Broadcast Input -->
      <g transform="translate(16, 145)">
        <rect width="530" height="42" rx="8" fill="#050811" stroke="#1c2638"/>
        <text x="14" y="26" font-family="'Inter', sans-serif" font-size="11" fill="#64748b">Enviar el mismo mensaje a todas las columnas (Broadcast)...</text>
        <rect x="435" y="8" width="85" height="26" rx="6" fill="url(#cyanGrad)"/>
        <text x="448" y="25" font-family="'Inter', sans-serif" font-size="10" font-weight="700" fill="#020617">Broadcast ↵</text>
      </g>

      <text x="16" y="210" font-family="'JetBrains Mono', monospace" font-size="10" fill="#64748b">Layouts soportados: [cols: 1-4 columnas] • [rows: apiladas] • [grid: cuadrícula 2x2]</text>
