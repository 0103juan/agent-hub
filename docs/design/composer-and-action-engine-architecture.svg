        <g transform="translate(10, 52)">
          <rect width="328" height="38" rx="6" fill="#0c1220" stroke="#202b3f" stroke-width="1" />
          <text x="12" y="24" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#c084fc">/plan</text>
          <text x="80" y="24" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" fill="#cbd5e1">Plan paso a paso antes de tocar código</text>
        </g>

        <!-- Command 3: /audit -->
        <g transform="translate(10, 94)">
          <rect width="328" height="38" rx="6" fill="#0c1220" stroke="#202b3f" stroke-width="1" />
          <text x="12" y="24" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#10b981">/audit</text>
          <text x="80" y="24" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" fill="#cbd5e1">Auditar rama actual vs main</text>
        </g>

        <!-- Command 4: /compact -->
        <g transform="translate(10, 136)">
          <rect width="328" height="38" rx="6" fill="#0c1220" stroke="#202b3f" stroke-width="1" />
          <text x="12" y="24" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#fbbf24">/compact</text>
          <text x="80" y="24" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" fill="#cbd5e1">Resumir contexto para liberar tokens</text>
        </g>

        <!-- Footer -->
        <g transform="translate(12, 196)">
          <text x="0" y="10" font-family="'JetBrains Mono', monospace" font-size="10" fill="#64748b">Navega con flechas ↑↓ y pulsa Enter para aplicar</text>
        </g>
      </g>

      <!-- Action Palette Trigger Card -->
      <g transform="translate(0, 260)">
        <rect width="348" height="196" rx="10" fill="#07090e" stroke="#202b3f" stroke-width="1" />
        <text x="14" y="24" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#06b6d4">Paleta de Acciones Rápidas (Ctrl+K)</text>
        
