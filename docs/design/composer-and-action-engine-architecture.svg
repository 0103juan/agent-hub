        <text x="14" y="24" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#c084fc">Pipeline Agéntico Escalable</text>
        <text x="14" y="48" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" fill="#cbd5e1">· Inyección de contexto ODD por turnos.</text>
        <text x="14" y="70" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" fill="#cbd5e1">· Protocolo de roles especializado.</text>
        <text x="14" y="92" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" fill="#cbd5e1">· Auditoría cruzada RDD antes del commit.</text>
        <text x="14" y="114" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" fill="#cbd5e1">· Recibos inmutables en memoria persistente.</text>
