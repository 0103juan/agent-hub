        <text x="14" y="22" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#06b6d4">Resiliencia y Concurrencia</text>
        <text x="14" y="44" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" fill="#cbd5e1">· Auto-drain en background sin bloquear UI.</text>
        <text x="14" y="64" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" fill="#cbd5e1">· Miniaturas de imágenes cacheadas localmente.</text>
        <text x="14" y="84" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" fill="#cbd5e1">· Cero pérdida de attachments en cola.</text>
      </g>
