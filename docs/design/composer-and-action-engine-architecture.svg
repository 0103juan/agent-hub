            <text x="74" y="17" font-family="'JetBrains Mono', monospace" font-size="12" fill="#64748b">→</text>

            <rect x="88" width="64" height="26" rx="5" fill="#0c1220" stroke="#c084fc" stroke-width="1" />
            <text x="120" y="17" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="10" fill="#c084fc">Coordina</text>

            <text x="162" y="17" font-family="'JetBrains Mono', monospace" font-size="12" fill="#64748b">→</text>

            <rect x="176" width="60" height="26" rx="5" fill="#0c1220" stroke="#10b981" stroke-width="1" />
            <text x="206" y="17" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="10" fill="#10b981">Desarrolla</text>

            <text x="246" y="17" font-family="'JetBrains Mono', monospace" font-size="12" fill="#64748b">→</text>

            <rect x="258" width="50" height="26" rx="5" fill="#0c1220" stroke="#38bdf8" stroke-width="1" />
            <text x="283" y="17" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="10" fill="#38bdf8">Revisa</text>
