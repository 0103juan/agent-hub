            <rect width="292" height="42" rx="6" fill="#0a0e17" stroke="#202b3f" stroke-width="1" />
            <text x="10" y="18" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" fill="#f1f5f9">☑ Copia aislada (Worktree Git)</text>
            <text x="10" y="32" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" fill="#94a3b8">Rama y carpeta propias, fusión segura al final.</text>

            <rect y="48" width="292" height="42" rx="6" fill="#0a0e17" stroke="#202b3f" stroke-width="1" />
            <text x="10" y="66" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" fill="#f1f5f9">☑ Aprobar cada traspaso (HITL)</text>
            <text x="10" y="80" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" fill="#94a3b8">El equipo se detiene entre agentes hasta tu OK.</text>
