    <rect width="360" height="42" rx="14" fill="#0c1220" />
    <path d="M 0 42 L 360 42" stroke="#202b3f" stroke-width="1" />
    
    <circle cx="24" cy="21" r="5" fill="#f43f5e" />
    <text x="40" y="25" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700" fill="#f1f5f9">1. Voz Nativa &amp; Cola con Adjuntos</text>

    <!-- Card Body -->
    <g transform="translate(20, 60)">
      <text x="0" y="16" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="600" fill="#94a3b8">Captura de audio y buffer de turnos:</text>

      <!-- Voice Recording Banner Mockup -->
      <g transform="translate(0, 28)">
        <rect width="320" height="56" rx="10" fill="#07090e" stroke="#f43f5e" stroke-opacity="0.4" stroke-width="1" />
        <circle cx="22" cy="28" r="6" fill="#f43f5e" />
        <text x="36" y="24" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#f43f5e">Grabando voz (0:14)</text>
        <text x="36" y="42" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" fill="#94a3b8">Habla con naturalidad · Web Audio API</text>
        
        <rect x="240" y="14" width="66" height="28" rx="6" fill="#10b981" />
        <text x="273" y="32" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#ffffff">Listo ✓</text>
      </g>

      <!-- Enriched Queue Card -->
      <g transform="translate(0, 98)">
        <rect width="320" height="240" rx="10" fill="#07090e" stroke="#202b3f" stroke-width="1" />
        
        <!-- Queue Header -->
        <g transform="translate(14, 18)">
          <text x="0" y="12" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#fbbf24">Cola Activa (2 mensajes)</text>
          <text x="290" y="12" text-anchor="end" font-family="'JetBrains Mono', monospace" font-size="10" fill="#64748b">Auto-drain</text>
        </g>

        <!-- Queue Item 1 with Attachments -->
        <g transform="translate(14, 38)">
          <rect width="292" height="82" rx="8" fill="#0a0e17" stroke="#202b3f" stroke-width="1" />
          <text x="12" y="20" font-family="'JetBrains Mono', monospace" font-size="10" fill="#fbbf24">#1</text>
          <text x="36" y="20" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="600" fill="#f1f5f9">Mejora el footer y los tests</text>
          
          <!-- Attachment Chips -->
          <g transform="translate(12, 34)">
            <rect width="120" height="22" rx="4" fill="#07090e" stroke="#202b3f" stroke-width="1" />
            <text x="10" y="15" font-family="'JetBrains Mono', monospace" font-size="9.5" fill="#38bdf8">🖼️ captura.png</text>

            <rect x="128" width="130" height="22" rx="4" fill="#07090e" stroke="#202b3f" stroke-width="1" />
            <text x="138" y="15" font-family="'JetBrains Mono', monospace" font-size="9.5" fill="#38bdf8">📄 flows.test.ts</text>
          </g>

          <text x="12" y="72" font-family="'JetBrains Mono', monospace" font-size="9" fill="#10b981">✓ Listo para procesar al terminar</text>
        </g>

        <!-- Queue Item 2 -->
        <g transform="translate(14, 130)">
          <rect width="292" height="48" rx="8" fill="#0a0e17" stroke="#202b3f" stroke-width="1" />
          <text x="12" y="20" font-family="'JetBrains Mono', monospace" font-size="10" fill="#fbbf24">#2</text>
          <text x="36" y="20" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="600" fill="#f1f5f9">Genera reporte de tokens y coste</text>
          <text x="12" y="38" font-family="'JetBrains Mono', monospace" font-size="9" fill="#64748b">En espera de turno previo...</text>
        </g>

        <!-- Resume Button -->
        <g transform="translate(14, 190)">
          <rect width="292" height="34" rx="8" fill="#0c1220" stroke="#06b6d4" stroke-opacity="0.4" stroke-width="1" />
          <text x="146" y="22" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#06b6d4">Reanudar cola de ejecución ↵</text>
