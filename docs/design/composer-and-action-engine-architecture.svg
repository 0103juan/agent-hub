          <rect width="328" height="38" rx="6" fill="#0a0e17" stroke="#06b6d4" stroke-opacity="0.4" stroke-width="1" />
          <text x="12" y="24" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#06b6d4">/goal</text>
          <text x="80" y="24" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" fill="#cbd5e1">Ejecutar tarea larga autónoma sin parar</text>
