<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" fill="none">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg" x1="0" y1="0" x2="1280" y2="720" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#07090e" />
      <stop offset="50%" stop-color="#0a0e17" />
      <stop offset="100%" stop-color="#0c1220" />
    </linearGradient>

    <!-- Radial Glows -->
    <radialGradient id="cyan-glow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(240, 200) rotate(45) scale(380)">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.14" />
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="purple-glow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(1040, 500) rotate(45) scale(380)">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0" />
    </radialGradient>

    <!-- Drop Shadow Filter -->
    <filter id="card-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.75" />
    </filter>
    <filter id="neon" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#202b3f" stroke-width="0.5" stroke-opacity="0.5" />
      <circle cx="40" cy="40" r="1" fill="#06b6d4" fill-opacity="0.25" />
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1280" height="720" fill="url(#bg)" />
  <rect width="1280" height="720" fill="url(#cyan-glow)" />
  <rect width="1280" height="720" fill="url(#purple-glow)" />
  <rect width="1280" height="720" fill="url(#grid)" />

  <!-- Outer HUD Frame -->
  <rect x="24" y="24" width="1232" height="672" rx="16" stroke="#202b3f" stroke-width="1.5" />
  <path d="M 24 64 L 1256 64" stroke="#202b3f" stroke-width="1" />
  <path d="M 24 656 L 1256 656" stroke="#202b3f" stroke-width="1" />

  <!-- Corner Brackets -->
  <path d="M 24 44 L 44 24" stroke="#06b6d4" stroke-width="2" />
  <path d="M 1256 44 L 1236 24" stroke="#06b6d4" stroke-width="2" />
  <path d="M 24 636 L 44 656" stroke="#06b6d4" stroke-width="2" />
  <path d="M 1256 636 L 1236 656" stroke="#06b6d4" stroke-width="2" />

  <!-- Header -->
  <g transform="translate(48, 44)">
    <circle cx="6" cy="0" r="4" fill="#06b6d4" filter="url(#neon)" />
    <text x="20" y="4" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="700" fill="#06b6d4" letter-spacing="1.5">AGENTHUB HUD CORE // COMPOSER &amp; ACTION ENGINE ARCHITECTURE</text>
    <text x="940" y="4" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="500" fill="#94a3b8">Voice Audio WebAPI · Multi-Attachment Queue · Flow Launcher</text>
  </g>

