          <text x="10" y="20" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" fill="#10b981">🧪 Correr Tests</text>
          <text x="10" y="34" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" fill="#94a3b8">npm run test:flows</text>

          <rect x="162" width="154" height="42" rx="6" fill="#0a0e17" stroke="#202b3f" stroke-width="1" />
          <text x="172" y="20" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" fill="#06b6d4">⚡ Compilar Webview</text>
          <text x="172" y="34" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" fill="#94a3b8">npm run build:webview</text>

          <rect y="48" width="154" height="42" rx="6" fill="#0a0e17" stroke="#202b3f" stroke-width="1" />
          <text x="10" y="68" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" fill="#f59e0b">🛡️ Escanear Secretos</text>
          <text x="10" y="82" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" fill="#94a3b8">Auditoría preventiva</text>

          <rect x="162" y="48" width="154" height="42" rx="6" fill="#0a0e17" stroke="#202b3f" stroke-width="1" />
          <text x="172" y="68" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" fill="#c084fc">📐 Diff Interactivo</text>
          <text x="172" y="82" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" fill="#94a3b8">git diff inspección</text>
