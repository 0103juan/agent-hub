<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#07090e" />
      <stop offset="50%" stop-color="#0a0e17" />
      <stop offset="100%" stop-color="#0e131f" />
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#131927" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#0b101b" stop-opacity="0.95" />
    </linearGradient>

    <linearGradient id="composerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="100%" stop-color="#0e131f" />
    </linearGradient>

    <filter id="softGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#6366f1" flood-opacity="0.25" />
    </filter>

    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.6" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="960" height="480" fill="url(#bgGrad)" />
  <rect width="960" height="480" fill="none" stroke="#202b3f" stroke-width="1.5" />

  <!-- Grid Accents -->
  <g stroke="#161f30" stroke-width="1" stroke-dasharray="3,3">
    <line x1="40" y1="80" x2="920" y2="80" />
    <line x1="40" y1="420" x2="920" y2="420" />
    <line x1="480" y1="80" x2="480" y2="420" />
  </g>

  <!-- Header -->
  <g transform="translate(40, 30)">
    <rect width="36" height="36" rx="8" fill="#1e1b4b" stroke="#6366f1" stroke-width="1.5" />
    <path d="M10 18h16M18 10v16" stroke="#818cf8" stroke-width="2" stroke-linecap="round" />
    <text x="48" y="24" fill="#f8fafc" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="17" font-weight="800" letter-spacing="-0.02em">
      ARQUITECTURA DEL COMPOSER Y CONTROL DE SESIÓN
    </text>
    <text x="48" y="40" fill="#94a3b8" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="11">
      Centro de comandos táctico: contexto, attachments, selector de rol/modelo, flujos y streaming
    </text>
    <rect x="760" y="8" width="120" height="24" rx="12" fill="#131927" stroke="#202b3f" />
    <circle cx="774" cy="20" r="4" fill="#6366f1" />
    <text x="784" y="24" fill="#cbd5e1" font-family="'JetBrains Mono', monospace" font-size="10">HUD CHAT v2.5</text>
  </g>

  <!-- Section 1: Chat Deck & Session Header (Left 410px) -->
  <g transform="translate(40, 95)" filter="url(#cardShadow)">
    <rect width="415" height="305" rx="14" fill="url(#cardGrad)" stroke="#202b3f" stroke-width="1.2" />
    <rect width="415" height="36" rx="14" fill="#151d2e" />
    <path d="M0 24h415" stroke="#202b3f" stroke-width="1" />
    <circle cx="20" cy="18" r="4" fill="#38bdf8" />
    <text x="32" y="22" fill="#e2e8f0" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="700">1. Cabecera y Control de Sesión (ChatView)</text>

    <!-- Project Breadcrumb -->
    <g transform="translate(16, 50)">
      <rect width="383" height="38" rx="8" fill="#090d16" stroke="#202b3f" />
      <circle cx="20" cy="19" r="4" fill="#6366f1" />
      <text x="32" y="23" fill="#cbd5e1" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="600">portafolio /</text>
      <text x="100" y="23" fill="#ffffff" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="700">Rediseño Interfaz HUD</text>
      
      <rect x="300" y="8" width="70" height="22" rx="6" fill="#1e1b4b" stroke="#4f46e5" />
      <text x="312" y="23" fill="#a5b4fc" font-family="'JetBrains Mono', monospace" font-size="10">Ctrl + H</text>
    </g>

    <!-- Compact Control Strip -->
    <g transform="translate(16, 98)">
      <rect width="383" height="52" rx="8" fill="#090d16" stroke="#202b3f" />
      
      <!-- Account Badge -->
      <g transform="translate(12, 10)">
        <rect width="130" height="32" rx="6" fill="#131927" stroke="#202b3f" />
        <circle cx="16" cy="16" r="3.5" fill="#f59e0b" />
        <text x="26" y="20" fill="#f1f5f9" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="600">Claude 3.5 Sonnet</text>
      </g>

      <!-- Role Badge -->
      <g transform="translate(150, 10)">
        <rect width="110" height="32" rx="6" fill="#1e1b4b" stroke="#6366f1" />
        <text x="12" y="20" fill="#ddd6fe" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700">DISEÑADOR</text>
      </g>

      <!-- Context Gauge -->
      <g transform="translate(268, 10)">
        <rect width="103" height="32" rx="6" fill="#131927" stroke="#202b3f" />
        <text x="10" y="20" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="9">CTX:</text>
        <rect x="36" y="14" width="40" height="4" rx="2" fill="#202b3f" />
        <rect x="36" y="14" width="16" height="4" rx="2" fill="#10b981" />
        <text x="80" y="20" fill="#34d399" font-family="'JetBrains Mono', monospace" font-size="9">14%</text>
      </g>
    </g>

    <!-- Squad Members Intercom Bar -->
    <g transform="translate(16, 160)">
      <rect width="383" height="125" rx="10" fill="#070a12" stroke="#0891b2" stroke-width="1.2" />
      <rect width="383" height="26" rx="10" fill="#083344" />
      <text x="14" y="18" fill="#e0f2fe" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="700">INTERCOM DE SQUAD (3 AGENTES COOPERATIVOS)</text>

      <g transform="translate(12, 36)">
        <!-- Sibling 1 -->
        <rect width="170" height="36" rx="6" fill="#111827" stroke="#202b3f" />
        <text x="10" y="22" fill="#ddd6fe" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="700">@arquitecto</text>
        <circle cx="150" cy="18" r="4" fill="#10b981" />

        <!-- Sibling 2 -->
        <g transform="translate(185, 0)">
          <rect width="174" height="36" rx="6" fill="#111827" stroke="#202b3f" />
          <text x="10" y="22" fill="#bfdbfe" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="700">@desarrollador</text>
          <circle cx="154" cy="18" r="4" fill="#f59e0b" />
        </g>
      </g>

      <!-- Turn Status Banner -->
      <g transform="translate(12, 82)">
        <rect width="359" height="32" rx="6" fill="#131927" stroke="#202b3f" />
        <circle cx="16" cy="16" r="3.5" fill="#10b981" />
        <text x="26" y="20" fill="#e2e8f0" font-family="'Plus Jakarta Sans', sans-serif" font-size="10">Estado: Diseñador produciendo componentes UI reactivos</text>
      </g>
    </g>
  </g>

  <!-- Connect 1 -> 2 -->
  <path d="M455 240 L500 240" stroke="#6366f1" stroke-width="2" stroke-dasharray="4,4" />
  <polygon points="502,240 496,236 496,244" fill="#6366f1" />

  <!-- Section 2: Composer Station (Right 410px) -->
  <g transform="translate(505, 95)" filter="url(#cardShadow)">
    <rect width="415" height="305" rx="14" fill="url(#cardGrad)" stroke="#202b3f" stroke-width="1.2" />
    <rect width="415" height="36" rx="14" fill="#151d2e" />
    <path d="M0 24h415" stroke="#202b3f" stroke-width="1" />
    <circle cx="20" cy="18" r="4" fill="#10b981" />
    <text x="32" y="22" fill="#e2e8f0" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="700">2. Estación Táctica de Prompt (Composer)</text>

    <!-- Toolbar Strip (Context, Files, Diff, Problems, Test, Commit, Flujos) -->
    <g transform="translate(14, 46)">
      <rect width="387" height="34" rx="8" fill="#090d16" stroke="#202b3f" />
      
      <!-- Context Button -->
      <rect x="6" y="5" width="62" height="24" rx="5" fill="#131927" stroke="#202b3f" />
      <text x="14" y="21" fill="#cbd5e1" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="600">+ Context</text>

      <!-- Files Button -->
      <rect x="74" y="5" width="56" height="24" rx="5" fill="#831843" fill-opacity="0.3" stroke="#f472b6" stroke-width="0.8" />
      <text x="82" y="21" fill="#fbcfe8" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="600">Archivos</text>

      <!-- Diff Button -->
      <rect x="136" y="5" width="46" height="24" rx="5" fill="#131927" stroke="#202b3f" />
      <text x="146" y="21" fill="#cbd5e1" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="600">Diff</text>

      <!-- Test Button -->
      <rect x="188" y="5" width="46" height="24" rx="5" fill="#064e3b" fill-opacity="0.4" stroke="#34d399" stroke-width="0.8" />
      <text x="198" y="21" fill="#a7f3d0" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="600">Test</text>

      <!-- Flujos Launcher -->
      <rect x="306" y="5" width="75" height="24" rx="5" fill="#581c87" fill-opacity="0.4" stroke="#c084fc" stroke-width="0.8" />
      <text x="316" y="21" fill="#e9d5ff" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="700">⚡ Flujos (3)</text>
    </g>

    <!-- Main Textarea Container -->
    <g transform="translate(14, 90)">
      <rect width="387" height="150" rx="12" fill="url(#composerGrad)" stroke="#3730a3" stroke-width="1.2" filter="url(#softGlow)" />
      
      <!-- Textarea Content -->
      <text x="16" y="26" fill="#cbd5e1" font-family="'Plus Jakarta Sans', sans-serif" font-size="11">
        Refactoriza la vista de sesión usando el nuevo estándar
      </text>
      <text x="16" y="44" fill="#818cf8" font-family="'JetBrains Mono', monospace" font-size="11">
        @desarrollador verifica los unit tests tras el cambio
      </text>

      <!-- Bottom Bar inside Composer -->
      <g transform="translate(0, 105)">
        <line x1="0" y1="0" x2="387" y2="0" stroke="#202b3f" stroke-width="1" />
        
        <!-- Keyboard shortcuts hint -->
        <text x="14" y="26" fill="#64748b" font-family="'JetBrains Mono', monospace" font-size="9">
          Ctrl+Enter enviar · ~120 tokens
        </text>

        <!-- Voice and Send Action -->
        <g transform="translate(300, 8)">
          <!-- Voice Icon -->
          <circle cx="16" cy="15" r="14" fill="#131927" stroke="#202b3f" />
          <path d="M16 9v8M13 13c0 1.6 1.3 3 3 3s3-1.4 3-3" stroke="#94a3b8" stroke-width="1.2" stroke-linecap="round" fill="none" />

          <!-- Send Button -->
          <rect x="38" y="0" width="40" height="30" rx="8" fill="#4f46e5" />
          <path d="M52 15l10-4-4 10-2-3-4-3z" fill="#ffffff" />
        </g>
      </g>
    </g>

    <!-- Queue & Status Footer -->
    <g transform="translate(14, 252)">
      <rect width="387" height="40" rx="8" fill="#090d16" stroke="#202b3f" />
      <circle cx="18" cy="20" r="4" fill="#f59e0b" />
      <text x="30" y="24" fill="#e2e8f0" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="600">
        Cola de mensajes: lista para enviar al finalizar el turno
      </text>
    </g>
  </g>

  <!-- Footer Info -->
  <g transform="translate(40, 428)">
    <text x="0" y="20" fill="#64748b" font-family="'JetBrains Mono', monospace" font-size="11">
      COMPONENTES: src/webview/components/chat/ChatView.tsx &amp; Composer.tsx
    </text>
    <text x="920" y="20" text-anchor="end" fill="#64748b" font-family="'JetBrains Mono', monospace" font-size="11">
      WCAG AA CONTRAST COMPLIANT (≥ 4.5:1)
    </text>
  </g>
</svg>
