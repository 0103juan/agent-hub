<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#07090e" />
      <stop offset="50%" stop-color="#0a0d16" />
      <stop offset="100%" stop-color="#07090e" />
    </linearGradient>
    <linearGradient id="primaryGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0e131f" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#0a0d16" stop-opacity="0.98" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
    .sans { font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
  </style>

  <!-- Background Canvas -->
  <rect width="960" height="540" fill="url(#bgGrad)" />

  <!-- Subtle Blueprint Grid -->
  <g opacity="0.08" stroke="#38bdf8" stroke-width="1">
    <path d="M 0 40 L 960 40 M 0 80 L 960 80 M 0 120 L 960 120 M 0 160 L 960 160 M 0 200 L 960 200 M 0 240 L 960 240 M 0 280 L 960 280 M 0 320 L 960 320 M 0 360 L 960 360 M 0 400 L 960 400 M 0 440 L 960 440 M 0 480 L 960 480 M 0 520 L 960 520" />
    <path d="M 60 0 L 60 540 M 120 0 L 120 540 M 180 0 L 180 540 M 240 0 L 240 540 M 300 0 L 300 540 M 360 0 L 360 540 M 420 0 L 420 540 M 480 0 L 480 540 M 540 0 L 540 540 M 600 0 L 600 540 M 660 0 L 660 540 M 720 0 L 720 540 M 780 0 L 780 540 M 840 0 L 840 540 M 900 0 L 900 540" />
  </g>

  <!-- Top Header Banner -->
  <g transform="translate(60, 28)">
    <rect x="0" y="0" width="840" height="42" rx="8" fill="#0e131f" stroke="#202b3f" stroke-width="1.5" />
    <circle cx="24" cy="21" r="5" fill="#f59e0b" filter="url(#glow)" />
    <text x="42" y="26" fill="#f8fafc" font-size="13" font-weight="700" class="sans" letter-spacing="0.5">AGENTHUB HUD :: SCRATCHPAD &amp; BRANCH MANAGER ARCHITECTURE</text>
    <rect x="670" y="9" width="150" height="24" rx="4" fill="#f59e0b" fill-opacity="0.15" stroke="#f59e0b" stroke-width="1" />
    <text x="745" y="25" fill="#fbbf24" font-size="11" font-weight="600" text-anchor="middle" class="mono">DEV WORKFLOW V2</text>
  </g>

  <!-- Container Left: Scratchpad Drawer (Fixed Right Panel Preview) -->
  <g transform="translate(60, 88)">
    <rect x="0" y="0" width="370" height="422" rx="12" fill="url(#cardGrad)" stroke="#202b3f" stroke-width="1.5" />
    
    <!-- Drawer Header -->
    <rect x="0" y="0" width="370" height="44" rx="12" fill="#0a0d16" />
    <rect x="0" y="43" width="370" height="1" fill="#202b3f" />

    <g transform="translate(16, 12)">
      <rect x="0" y="0" width="20" height="20" rx="4" fill="#f59e0b" fill-opacity="0.2" stroke="#f59e0b" stroke-width="1" />
      <path d="M 5 6 L 15 6 M 5 10 L 15 10 M 5 14 L 11 14" stroke="#fbbf24" stroke-width="1.5" stroke-linecap="round" />
      <text x="28" y="15" fill="#f8fafc" font-size="12" font-weight="700" class="sans">Borrador Táctico</text>
      
      <!-- Toolbar icons -->
      <g transform="translate(160, 0)">
        <rect x="0" y="0" width="22" height="20" rx="4" fill="#131927" stroke="#202b3f" />
        <path d="M 6 10 L 9 13 L 16 7" stroke="#10b981" stroke-width="1.5" fill="none" stroke-linecap="round" />
        
        <rect x="28" y="0" width="22" height="20" rx="4" fill="#131927" stroke="#202b3f" />
        <path d="M 33 6 L 45 6 M 33 10 L 45 10 M 33 14 L 41 14" stroke="#94a3b8" stroke-width="1" />

        <rect x="56" y="0" width="56" height="20" rx="4" fill="#10b981" fill-opacity="0.15" stroke="#10b981" stroke-width="1" />
        <text x="84" y="14" fill="#34d399" font-size="10" font-weight="600" text-anchor="middle" class="mono">Guardado</text>

        <rect x="118" y="0" width="20" height="20" rx="4" fill="#131927" stroke="#202b3f" />
        <path d="M 123 5 L 133 15 M 133 5 L 123 15" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round" />
      </g>
    </g>

    <!-- Drawer Textarea Body -->
    <rect x="12" y="56" width="346" height="308" rx="8" fill="#05070c" stroke="#202b3f" stroke-width="1" />
    <g transform="translate(24, 76)">
      <text x="0" y="0" fill="#38bdf8" font-size="12" font-weight="700" class="mono">## Tareas de la Iteración 10</text>
      
      <text x="0" y="24" fill="#34d399" font-size="11" class="mono">[x] Rediseñar CommandPalette con filtros</text>
      <text x="0" y="44" fill="#34d399" font-size="11" class="mono">[x] Elevar InteractiveDiffModal Split/Unified</text>
      <text x="0" y="64" fill="#cbd5e1" font-size="11" class="mono">[ ] Pulir ScratchpadDrawer táctico</text>
      <text x="0" y="84" fill="#cbd5e1" font-size="11" class="mono">[ ] Actualizar BranchManagerModal Git/Worktree</text>
      
      <line x1="0" y1="104" x2="320" y2="104" stroke="#202b3f" stroke-width="1" stroke-dasharray="4 4" />
      
      <text x="0" y="126" fill="#a5b4fc" font-size="11" class="mono">// Snippet de prompt contextual para el agente:</text>
      <text x="0" y="146" fill="#94a3b8" font-size="11" class="mono">Por favor verifica los contratos de interfaz</text>
      <text x="0" y="166" fill="#94a3b8" font-size="11" class="mono">y compila con --prefix de producción.</text>
    </g>

    <!-- Drawer Footer Actions -->
    <rect x="0" y="374" width="370" height="48" rx="12" fill="#0a0d16" />
    <rect x="0" y="374" width="370" height="1" fill="#202b3f" />

    <g transform="translate(14, 388)">
      <text x="0" y="14" fill="#64748b" font-size="9" class="mono">scratchpad.md · 42 palabras</text>
      
      <rect x="194" y="0" width="148" height="26" rx="6" fill="#6366f1" />
      <path d="M 206 13 L 216 8 L 216 18 Z" fill="#ffffff" />
      <text x="272" y="17" fill="#ffffff" font-size="11" font-weight="600" text-anchor="middle" class="sans">Enviar al Agente</text>
    </g>
  </g>

  <!-- Container Right: Git Branch & Worktree Manager -->
  <g transform="translate(450, 88)">
    <rect x="0" y="0" width="450" height="422" rx="12" fill="url(#cardGrad)" stroke="#202b3f" stroke-width="1.5" />
    
    <!-- Modal Header -->
    <rect x="0" y="0" width="450" height="44" rx="12" fill="#0a0d16" />
    <rect x="0" y="43" width="450" height="1" fill="#202b3f" />

    <g transform="translate(16, 12)">
      <rect x="0" y="0" width="20" height="20" rx="4" fill="#10b981" fill-opacity="0.2" stroke="#10b981" stroke-width="1" />
      <circle cx="10" cy="7" r="3" fill="#34d399" />
      <circle cx="6" cy="14" r="2.5" fill="#34d399" />
      <circle cx="14" cy="14" r="2.5" fill="#34d399" />
      <text x="28" y="15" fill="#f8fafc" font-size="12" font-weight="700" class="sans">Gestor de Ramas &amp; Worktrees</text>

      <rect x="390" y="0" width="22" height="20" rx="4" fill="#131927" stroke="#202b3f" />
      <path d="M 396 5 L 406 15 M 406 5 L 396 15" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round" />
    </g>

    <!-- Current Branch Active Card -->
    <g transform="translate(16, 56)">
      <rect x="0" y="0" width="418" height="54" rx="8" fill="#131927" stroke="#10b981" stroke-width="1" />
      <circle cx="20" cy="27" r="5" fill="#10b981" filter="url(#glow)" />
      
      <text x="34" y="22" fill="#94a3b8" font-size="10" font-weight="600" class="mono">RAMA ACTUAL ACTIVA</text>
      <text x="34" y="40" fill="#f8fafc" font-size="13" font-weight="700" class="mono">feature/tactical-hud-v2</text>

      <rect x="310" y="14" width="94" height="24" rx="4" fill="#07090e" stroke="#202b3f" />
      <text x="357" y="30" fill="#34d399" font-size="10" font-weight="600" text-anchor="middle" class="mono">WORKING TREE</text>
    </g>

    <!-- Branch Filter & Create Input -->
    <g transform="translate(16, 120)">
      <rect x="0" y="0" width="290" height="34" rx="6" fill="#07090e" stroke="#202b3f" />
      <circle cx="16" cy="17" r="4" fill="none" stroke="#64748b" stroke-width="1.2" />
      <text x="28" y="21" fill="#64748b" font-size="11" class="mono">Filtrar ramas...</text>

      <rect x="300" y="0" width="118" height="34" rx="6" fill="#6366f1" fill-opacity="0.2" stroke="#6366f1" stroke-width="1" />
      <text x="359" y="21" fill="#a5b4fc" font-size="11" font-weight="600" text-anchor="middle" class="mono">+ Nueva Rama</text>
    </g>

    <!-- Branch List Stream -->
    <g transform="translate(16, 166)">
      <!-- Item 1: Squad branch -->
      <g transform="translate(0, 0)">
        <rect x="0" y="0" width="418" height="42" rx="6" fill="#0a0d16" stroke="#202b3f" />
        <rect x="12" y="11" width="54" height="20" rx="3" fill="#6366f1" fill-opacity="0.2" stroke="#6366f1" stroke-opacity="0.4" />
        <text x="39" y="25" fill="#a5b4fc" font-size="9" font-weight="700" text-anchor="middle" class="mono">SQUAD</text>
        <text x="74" y="26" fill="#f8fafc" font-size="12" font-weight="600" class="mono">squad/design-system-audit</text>
        
        <rect x="328" y="9" width="76" height="22" rx="4" fill="#131927" stroke="#202b3f" />
        <text x="366" y="24" fill="#38bdf8" font-size="10" font-weight="600" text-anchor="middle" class="mono">Checkout</text>
      </g>

      <!-- Item 2: Main branch -->
      <g transform="translate(0, 48)">
        <rect x="0" y="0" width="418" height="42" rx="6" fill="#0a0d16" stroke="#202b3f" />
        <rect x="12" y="11" width="54" height="20" rx="3" fill="#10b981" fill-opacity="0.15" stroke="#10b981" stroke-opacity="0.3" />
        <text x="39" y="25" fill="#34d399" font-size="9" font-weight="700" text-anchor="middle" class="mono">BASE</text>
        <text x="74" y="26" fill="#e2e8f0" font-size="12" font-weight="500" class="mono">main</text>
        
        <rect x="328" y="9" width="76" height="22" rx="4" fill="#131927" stroke="#202b3f" />
        <text x="366" y="24" fill="#38bdf8" font-size="10" font-weight="600" text-anchor="middle" class="mono">Checkout</text>
      </g>

      <!-- Item 3: Feature branch -->
      <g transform="translate(0, 96)">
        <rect x="0" y="0" width="418" height="42" rx="6" fill="#0a0d16" stroke="#202b3f" />
        <rect x="12" y="11" width="54" height="20" rx="3" fill="#06b6d4" fill-opacity="0.15" stroke="#06b6d4" stroke-opacity="0.3" />
        <text x="39" y="25" fill="#22d3ee" font-size="9" font-weight="700" text-anchor="middle" class="mono">FEAT</text>
        <text x="74" y="26" fill="#e2e8f0" font-size="12" font-weight="500" class="mono">feature/context-window-gauge</text>
        
        <rect x="328" y="9" width="76" height="22" rx="4" fill="#131927" stroke="#202b3f" />
        <text x="366" y="24" fill="#38bdf8" font-size="10" font-weight="600" text-anchor="middle" class="mono">Checkout</text>
      </g>
    </g>

    <!-- Branch Manager Footer Status -->
    <g transform="translate(0, 374)">
      <rect x="0" y="0" width="450" height="48" rx="12" fill="#0a0d16" />
      <rect x="0" y="0" width="450" height="1" fill="#202b3f" />
      <g transform="translate(16, 18)">
        <circle cx="6" cy="6" r="3" fill="#10b981" />
        <text x="16" y="9" fill="#94a3b8" font-size="10" class="mono">3 RAMAS LOCALES · 1 WORKTREE ACTIVO</text>
      </g>
    </g>
  </g>
</svg>
