<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 380" width="100%" height="100%" style="background:#07090e; font-family: Inter, system-ui, sans-serif;">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="docBg" cx="50%" cy="50%" r="75%">
      <stop offset="0%" stop-color="#1e1b4b" stop-opacity="0.35" />
      <stop offset="70%" stop-color="#0e131f" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#07090e" stop-opacity="1" />
    </radialGradient>

    <!-- Glowing Filters -->
    <filter id="docGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Linear Flow Gradient -->
    <linearGradient id="docPipelineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="35%" stop-color="#6366f1"/>
      <stop offset="70%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>

    <!-- Pattern -->
    <pattern id="docGrid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#162035" stroke-width="1" stroke-opacity="0.5"/>
    </pattern>
  </defs>

  <rect width="800" height="380" fill="url(#docBg)"/>
  <rect width="800" height="380" fill="url(#docGrid)"/>

  <!-- Title & Context -->
  <g transform="translate(40, 36)">
    <rect width="32" height="32" rx="8" fill="#6366f1" fill-opacity="0.2" stroke="#818cf8" stroke-width="1.5"/>
    <!-- Document icon -->
    <path d="M 12 8 L 20 8 L 20 24 L 10 24 L 10 10 Z M 16 8 L 16 12 L 20 12" fill="none" stroke="#a5b4fc" stroke-width="1.8"/>
    <text x="44" y="16" fill="#f3f6fc" font-size="14" font-weight="800" letter-spacing="0.04em">PIPELINE DE DOCUMENTACIÓN VIVA DEL PROYECTO</text>
    <text x="44" y="29" fill="#94a3b8" font-size="10" font-family="monospace">ESPECIFICACIÓN ➔ PRUEBAS ➔ CÓDIGO ➔ INFORME DE EQUIPO ➔ MEMORIA</text>
  </g>

  <!-- Flow Connector Bar -->
  <path d="M 120 180 L 680 180" stroke="url(#docPipelineGrad)" stroke-width="4" stroke-linecap="round"/>

  <!-- Step 1: Specs -->
  <g transform="translate(60, 130)">
    <rect width="130" height="100" rx="12" fill="#0e131f" stroke="#38bdf8" stroke-width="1.5" filter="url(#docGlow)"/>
    <circle cx="24" cy="24" r="10" fill="#0c192e" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="24" y="28" text-anchor="middle" fill="#38bdf8" font-size="10" font-weight="800">1</text>
    <text x="42" y="27" fill="#93c5fd" font-size="11" font-weight="700">ESPECIFICACIÓN</text>
    <text x="14" y="52" fill="#e2e8f0" font-size="10" font-family="monospace">docs/specs/*.md</text>
    <text x="14" y="68" fill="#64748b" font-size="9">Criterios Given/When/Then del Arquitecto</text>
  </g>

  <!-- Step 2: Scratchpad & Tasks -->
  <g transform="translate(240, 130)">
    <rect width="130" height="100" rx="12" fill="#0e131f" stroke="#6366f1" stroke-width="1.5"/>
    <circle cx="24" cy="24" r="10" fill="#1e1b4b" stroke="#6366f1" stroke-width="1.5"/>
    <text x="24" y="28" text-anchor="middle" fill="#818cf8" font-size="10" font-weight="800">2</text>
    <text x="42" y="27" fill="#c7d2fe" font-size="11" font-weight="700">BORRADOR</text>
    <text x="14" y="52" fill="#e2e8f0" font-size="10" font-family="monospace">scratchpad.md</text>
    <text x="14" y="68" fill="#64748b" font-size="9">Checklist de tareas atómicas y notas de sesión</text>
  </g>

  <!-- Step 3: Team Report -->
  <g transform="translate(420, 130)">
    <rect width="130" height="100" rx="12" fill="#0e131f" stroke="#a855f7" stroke-width="1.5"/>
    <circle cx="24" cy="24" r="10" fill="#2e1065" stroke="#a855f7" stroke-width="1.5"/>
    <text x="24" y="28" text-anchor="middle" fill="#c084fc" font-size="10" font-weight="800">3</text>
    <text x="42" y="27" fill="#e9d5ff" font-size="11" font-weight="700">INFORME SQUAD</text>
    <text x="14" y="52" fill="#e2e8f0" font-size="10" font-family="monospace">team-report.md</text>
    <text x="14" y="68" fill="#64748b" font-size="9">Diffs, costo, tokens y cuerpo del Pull Request</text>
  </g>

  <!-- Step 4: Memory -->
  <g transform="translate(600, 130)">
    <rect width="140" height="100" rx="12" fill="#0e131f" stroke="#10b981" stroke-width="1.5" filter="url(#docGlow)"/>
    <circle cx="24" cy="24" r="10" fill="#06241a" stroke="#10b981" stroke-width="1.5"/>
    <text x="24" y="28" text-anchor="middle" fill="#34d399" font-size="10" font-weight="800">4</text>
    <text x="42" y="27" fill="#6ee7b7" font-size="11" font-weight="700">MEMORIA VIVA</text>
    <text x="14" y="52" fill="#e2e8f0" font-size="10" font-family="monospace">experience.md</text>
    <text x="14" y="68" fill="#64748b" font-size="9">Reglas de oro, trampas superadas y lecciones</text>
  </g>

  <!-- Bottom Legend / Specs -->
  <g transform="translate(60, 275)">
    <rect width="680" height="55" rx="10" fill="#0e131f" stroke="#202b3f" stroke-width="1"/>
    <text x="20" y="24" fill="#f3f6fc" font-size="11" font-weight="700">Sincronización en Tiempo Real con VS Code &amp; Electron:</text>
    <text x="20" y="40" fill="#94a3b8" font-size="10">Los archivos creados o editados por agentes o el usuario se refrescan en vivo en el árbol sin recargas forzadas.</text>
  </g>
</svg>
