<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="100%" height="100%">
  <defs>
    <!-- Dark HUD Gradients -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#07090e" />
      <stop offset="100%" stop-color="#0c111e" />
    </linearGradient>
    <linearGradient id="card-active-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#062238" stop-opacity="0.6" />
      <stop offset="50%" stop-color="#0b1220" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#0d1424" stop-opacity="0.9" />
    </linearGradient>
    <linearGradient id="card-idle-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="100%" stop-color="#0e1526" />
    </linearGradient>
    <linearGradient id="cyan-accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>

    <!-- Filters -->
    <filter id="cyan-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="drop-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000" flood-opacity="0.5" />
    </filter>
  </defs>

  <style>
    .font-mono { font-family: 'JetBrains Mono', 'Fira Code', 'Courier New', monospace; }
    .font-sans { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    .title { font-size: 20px; font-weight: 800; letter-spacing: 1.5px; fill: #f8fafc; }
    .sub { font-size: 11px; font-weight: 600; letter-spacing: 1px; fill: #94a3b8; }
    .label { font-size: 11px; fill: #cbd5e1; }
  </style>

  <!-- Base Grid Background -->
  <rect width="1200" height="700" fill="url(#bg-grad)" />

  <!-- Subtle Cyber Grid -->
  <g stroke="#202b3f" stroke-width="0.5" stroke-opacity="0.35">
    <line x1="0" y1="80" x2="1200" y2="80" />
    <line x1="0" y1="220" x2="1200" y2="220" />
    <line x1="0" y1="460" x2="1200" y2="460" />
    <line x1="300" y1="0" x2="300" y2="700" />
    <line x1="600" y1="0" x2="600" y2="700" />
    <line x1="900" y1="0" x2="900" y2="700" />
  </g>

  <!-- Header Section -->
  <g transform="translate(60, 40)">
    <rect x="0" y="0" width="4" height="32" fill="#06b6d4" rx="2" />
    <text x="16" y="18" class="font-sans title">AGENT-HUB // ACCOUNTS &amp; CREDENTIAL PROFILES ARCHITECTURE</text>
    <text x="16" y="32" class="font-mono sub">MULTI-PROVIDER CREDENTIAL ROUTING · AUTOMATIC QUOTA FAILOVER · TACTICAL DARK HUD</text>
  </g>

  <!-- Main View Container Preview -->
  <g transform="translate(60, 95)" filter="url(#drop-shadow)">
    <!-- Accounts Header Bar -->
    <rect x="0" y="0" width="1080" height="60" rx="10" fill="#0a0e17" stroke="#202b3f" stroke-width="1.5" />

    <g transform="translate(20, 14)">
      <!-- Key Icon -->
      <rect x="0" y="0" width="32" height="32" rx="7" fill="url(#cyan-accent)" />
      <path d="M12 17 A4 4 0 1 1 15 13 L22 13 L22 17 L20 17 L20 15 L18 15 L18 17 L16 17 L15 16 Z" fill="#ffffff" />

      <!-- Title & Subtitle -->
      <text x="44" y="14" class="font-sans" font-size="13" font-weight="700" fill="#f8fafc">Gestor de Cuentas y Suscripciones</text>
      <text x="44" y="27" class="font-mono" font-size="9" fill="#94a3b8">Suscripciones y credenciales usadas por las CLIs · Conmutación automática</text>
    </g>

    <!-- Header Actions Right -->
    <g transform="translate(730, 14)">
      <!-- Connected Counter Pill -->
      <rect x="0" y="0" width="145" height="32" rx="16" fill="#060a12" stroke="#202b3f" stroke-width="1" />
      <circle cx="16" cy="16" r="3.5" fill="#10b981">
        <animate attributeName="opacity" values="1;0.4;1" dur="2s" repeatCount="indefinite" />
      </circle>
      <text x="26" y="20" class="font-mono" font-size="10" font-weight="600" fill="#6ee7b7">4 de 4 conectadas</text>

      <!-- Refresh Button -->
      <rect x="155" y="0" width="90" height="32" rx="6" fill="#121929" stroke="#1e2c47" stroke-width="1" />
      <text x="175" y="20" class="font-mono" font-size="10" font-weight="600" fill="#cbd5e1">Refrescar</text>

      <!-- Vincular Cuenta Button -->
      <rect x="255" y="0" width="130" height="32" rx="6" fill="url(#cyan-accent)" />
      <text x="272" y="20" class="font-mono" font-size="10" font-weight="700" fill="#ffffff">+ Vincular cuenta</text>
    </g>
  </g>

  <!-- Provider Section Preview (Google Antigravity) -->
  <g transform="translate(60, 175)" filter="url(#drop-shadow)">
    <rect x="0" y="0" width="1080" height="240" rx="10" fill="#090e1a" stroke="#202b3f" stroke-width="1.5" />

    <!-- Section Header Strip -->
    <g transform="translate(20, 16)">
      <path d="M4 7 L9 12 L14 7" stroke="#94a3b8" stroke-width="2" fill="none" />
      <rect x="22" y="0" width="22" height="22" rx="4" fill="#202b3f" />
      <text x="28" y="15" class="font-mono" font-size="11" font-weight="700" fill="#38bdf8">G</text>
      <text x="52" y="16" class="font-sans" font-size="12" font-weight="700" fill="#f8fafc">Google Antigravity</text>
      <rect x="180" y="2" width="70" height="18" rx="9" fill="#060a12" stroke="#202b3f" stroke-width="1" />
      <text x="190" y="14" class="font-mono" font-size="9" fill="#94a3b8">2 cuentas</text>
      <text x="260" y="15" class="font-mono" font-size="10" fill="#64748b">agy CLI oficial · Modelos Gemini 3.8</text>

      <text x="1020" y="16" text-anchor="end" class="font-mono" font-size="10" font-weight="600" fill="#10b981">2/2 activas</text>
    </g>

    <line x1="20" y1="48" x2="1060" y2="48" stroke="#202b3f" stroke-width="1" />

    <!-- Profile Card 1: ACTIVE IN CHAT -->
    <g transform="translate(20, 60)">
      <rect x="0" y="0" width="1040" height="78" rx="8" fill="url(#card-active-grad)" stroke="#06b6d4" stroke-width="1.5" filter="url(#cyan-glow)" />

      <!-- Provider Badge & Name -->
      <g transform="translate(16, 16)">
        <rect x="0" y="0" width="34" height="34" rx="6" fill="#082f49" stroke="#0ea5e9" stroke-width="1" />
        <text x="11" y="22" class="font-mono" font-size="14" font-weight="800" fill="#38bdf8">G</text>

        <text x="46" y="15" class="font-sans" font-size="12" font-weight="700" fill="#f8fafc">Google Work Account</text>
        <rect x="185" y="4" width="125" height="16" rx="8" fill="rgba(6,182,212,0.2)" stroke="#06b6d4" stroke-width="0.8" />
        <text x="193" y="15" class="font-mono" font-size="8.5" font-weight="700" fill="#67e8f9">ACTIVO EN ESTE CHAT</text>

        <rect x="318" y="4" width="75" height="16" rx="8" fill="rgba(16,185,129,0.15)" stroke="#10b981" stroke-width="0.8" />
        <text x="326" y="15" class="font-mono" font-size="8.5" font-weight="700" fill="#6ee7b7">PRO / TEAM</text>

        <text x="46" y="32" class="font-mono" font-size="10" fill="#34d399">dev.juan@company.com</text>
      </g>

      <!-- Right Actions -->
      <g transform="translate(890, 16)">
        <rect x="0" y="4" width="95" height="26" rx="5" fill="#1e1b4b" stroke="#6366f1" stroke-width="1" />
        <circle cx="12" cy="17" r="4" fill="#a5b4fc" />
        <text x="24" y="20" class="font-mono" font-size="9" font-weight="600" fill="#c7d2fe">En uso</text>

        <rect x="102" y="4" width="30" height="26" rx="5" fill="#1e1320" stroke="#f43f5e" stroke-width="1" />
        <path d="M112 12 L112 22 M118 17 L122 17" stroke="#fb7185" stroke-width="1.5" stroke-linecap="round" />
      </g>

      <!-- Model Chips Line -->
      <g transform="translate(16, 52)">
        <text x="0" y="14" class="font-mono" font-size="9" fill="#64748b">MODELOS (3):</text>
        <rect x="75" y="3" width="130" height="16" rx="4" fill="#060a12" stroke="#202b3f" stroke-width="1" />
        <text x="82" y="14" class="font-mono" font-size="8.5" fill="#cbd5e1">gemini-3.8-pro-preview</text>

        <rect x="212" y="3" width="115" height="16" rx="4" fill="#060a12" stroke="#202b3f" stroke-width="1" />
        <text x="219" y="14" class="font-mono" font-size="8.5" fill="#cbd5e1">gemini-2.5-flash-lite</text>

        <rect x="334" y="3" width="125" height="16" rx="4" fill="#060a12" stroke="#202b3f" stroke-width="1" />
        <text x="341" y="14" class="font-mono" font-size="8.5" fill="#cbd5e1">gemini-2.5-pro-coding</text>
      </g>
    </g>

    <!-- Profile Card 2: Connected Secondary -->
    <g transform="translate(20, 148)">
      <rect x="0" y="0" width="1040" height="78" rx="8" fill="url(#card-idle-grad)" stroke="#202b3f" stroke-width="1" />

      <g transform="translate(16, 16)">
        <rect x="0" y="0" width="34" height="34" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1" />
        <text x="11" y="22" class="font-mono" font-size="14" font-weight="800" fill="#94a3b8">G</text>

        <text x="46" y="15" class="font-sans" font-size="12" font-weight="700" fill="#cbd5e1">Google Personal Backup</text>
        <rect x="205" y="4" width="70" height="16" rx="8" fill="rgba(16,185,129,0.15)" stroke="#10b981" stroke-width="0.8" />
        <text x="213" y="15" class="font-mono" font-size="8.5" font-weight="700" fill="#6ee7b7">FREE TIER</text>

        <text x="46" y="32" class="font-mono" font-size="10" fill="#10b981">juan.personal@gmail.com</text>
      </g>

      <!-- Right Action: Usar en chat -->
      <g transform="translate(865, 16)">
        <rect x="0" y="4" width="115" height="26" rx="5" fill="#162035" stroke="#202b3f" stroke-width="1" />
        <circle cx="12" cy="17" r="4" stroke="#06b6d4" stroke-width="1.2" fill="none" />
        <text x="24" y="20" class="font-mono" font-size="9" font-weight="600" fill="#cbd5e1">Usar en chat</text>

        <rect x="122" y="4" width="30" height="26" rx="5" fill="#141c2e" stroke="#202b3f" stroke-width="1" />
        <path d="M132 12 L132 22 M138 17 L142 17" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round" />
      </g>

      <g transform="translate(16, 52)">
        <text x="0" y="14" class="font-mono" font-size="9" fill="#64748b">MODELOS (2):</text>
        <rect x="75" y="3" width="130" height="16" rx="4" fill="#060a12" stroke="#202b3f" stroke-width="1" />
        <text x="82" y="14" class="font-mono" font-size="8.5" fill="#94a3b8">gemini-2.5-flash</text>

        <rect x="212" y="3" width="125" height="16" rx="4" fill="#060a12" stroke="#202b3f" stroke-width="1" />
        <text x="219" y="14" class="font-mono" font-size="8.5" fill="#94a3b8">gemini-2.5-flash-lite</text>
      </g>
    </g>
  </g>

  <!-- Key Architecture Features 3 Cards -->
  <g transform="translate(60, 435)">
    <!-- Feature 1 -->
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="340" height="205" rx="8" fill="#0c1220" stroke="#202b3f" stroke-width="1.2" />
      <text x="16" y="26" class="font-mono" font-size="11" font-weight="700" fill="#06b6d4">01 // QUOTA FAILOVER MATRIX</text>
      <text x="16" y="48" class="font-sans label" fill="#94a3b8">
        <tspan x="16" dy="0">• <tspan fill="#f8fafc" font-weight="600">Smart CLI Multi-Account Dispatch:</tspan></tspan>
        <tspan x="26" dy="16">Automated hot-swap when provider API hits</tspan>
        <tspan x="26" dy="16">rate limits (429/ResourceExhausted).</tspan>

        <tspan x="16" dy="24">• <tspan fill="#f8fafc" font-weight="600">Zero-Session Disruption:</tspan></tspan>
        <tspan x="26" dy="16">Re-routes prompt silently to secondary backup</tspan>
        <tspan x="26" dy="16">profile without losing thread history.</tspan>
      </text>
    </g>

    <!-- Feature 2 -->
    <g transform="translate(370, 0)">
      <rect x="0" y="0" width="340" height="205" rx="8" fill="#0c1220" stroke="#202b3f" stroke-width="1.2" />
      <text x="16" y="26" class="font-mono" font-size="11" font-weight="700" fill="#a855f7">02 // TACTICAL HUD CARDS</text>
      <text x="16" y="48" class="font-sans label" fill="#94a3b8">
        <tspan x="16" dy="0">• <tspan fill="#f8fafc" font-weight="600">Luminous Active State Glow:</tspan></tspan>
        <tspan x="26" dy="16">Cyan-indigo ring-1 border with subtle outer</tspan>
        <tspan x="26" dy="16">bloom for the active chat profile.</tspan>

        <tspan x="16" dy="24">• <tspan fill="#f8fafc" font-weight="600">Click-to-Copy Email Clip:</tspan></tspan>
        <tspan x="26" dy="16">Instant clipboard copy with green confirmation</tspan>
        <tspan x="26" dy="16">checkmark and monospace typography.</tspan>
      </text>
    </g>

    <!-- Feature 3 -->
    <g transform="translate(740, 0)">
      <rect x="0" y="0" width="340" height="205" rx="8" fill="#0c1220" stroke="#202b3f" stroke-width="1.2" />
      <text x="16" y="26" class="font-mono" font-size="11" font-weight="700" fill="#10b981">03 // SECURE CREDENTIAL MESH</text>
      <text x="16" y="48" class="font-sans label" fill="#94a3b8">
        <tspan x="16" dy="0">• <tspan fill="#f8fafc" font-weight="600">Host Vault Storage:</tspan></tspan>
        <tspan x="26" dy="16">Secrets remain strictly on host machine;</tspan>
        <tspan x="26" dy="16">webview only receives metadata &amp; state.</tspan>

        <tspan x="16" dy="24">• <tspan fill="#f8fafc" font-weight="600">Direct Auth Dispatch:</tspan></tspan>
        <tspan x="26" dy="16">One-click OAuth browser launcher with</tspan>
        <tspan x="26" dy="16">tactical feedback indicators.</tspan>
      </text>
    </g>
  </g>

  <!-- Bottom Footer Line -->
  <g transform="translate(60, 660)">
    <line x1="0" y1="0" x2="1080" y2="0" stroke="#202b3f" stroke-width="1" />
    <text x="0" y="20" class="font-mono" font-size="10" fill="#64748b">AGENT-HUB SPECIFICATION // ITERATION 23 (LOOP 3 - ITER 5) // PROFILES &amp; CREDENTIALS</text>
    <text x="1080" y="20" text-anchor="end" class="font-mono" font-size="10" fill="#06b6d4">WCAG AA COMPLIANT · PALETTE: #07090e · #0a0e17 · #0c1220 · #06b6d4</text>
  </g>
</svg>