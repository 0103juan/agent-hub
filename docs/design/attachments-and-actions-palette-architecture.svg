<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 640" width="100%" height="100%" style="background:#07090e; font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19"/>
      <stop offset="50%" stop-color="#07090e"/>
      <stop offset="100%" stop-color="#05070a"/>
    </linearGradient>

    <!-- Card Gradient -->
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#141c2e"/>
      <stop offset="100%" stop-color="#0e131f"/>
    </linearGradient>

    <!-- Glowing Filters -->
    <filter id="shadowBox" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.75"/>
    </filter>
  </defs>

  <!-- Background Grid -->
  <rect width="1000" height="640" fill="url(#bgGrad)"/>
  <g opacity="0.08" stroke="#38bdf8" stroke-width="1">
    <path d="M0,80 H1000 M0,160 H1000 M0,240 H1000 M0,320 H1000 M0,400 H1000 M0,480 H1000 M0,560 H1000" />
    <path d="M100,0 V640 M200,0 V640 M300,0 V640 M400,0 V640 M500,0 V640 M600,0 V640 M700,0 V640 M800,0 V640 M900,0 V640" />
  </g>

  <!-- Header -->
  <g transform="translate(40, 36)">
    <rect x="0" y="0" width="14" height="14" fill="#06b6d4" rx="2" />
    <text x="24" y="12" fill="#f8fafc" font-size="14" font-weight="700" letter-spacing="0.1em">AGENTHUB // ARCHITECTURE</text>
    <text x="260" y="12" fill="#06b6d4" font-size="12" font-weight="600">ACTION PALETTE, ATTACHMENT TRAY &amp; DIFF RENDERING</text>
    <text x="0" y="30" fill="#94a3b8" font-size="11">Tactical Dark HUD Protocol: File Attachments, Multi-Group Workspace Actions &amp; High-Contrast Diff View</text>
  </g>

  <!-- Top Badges / Status -->
  <g transform="translate(740, 36)">
    <rect x="0" y="0" width="100" height="22" rx="4" fill="#162035" stroke="#202b3f" />
    <circle cx="12" cy="11" r="3" fill="#10b981" />
    <text x="22" y="15" fill="#e2e8f0" font-size="10">PALETTE: ACTIVE</text>

    <rect x="110" y="0" width="110" height="22" rx="4" fill="#162035" stroke="#202b3f" />
    <text x="120" y="15" fill="#38bdf8" font-size="10">DIFF HUD v2</text>
  </g>

  <!-- Section 1: Attachment Ingestion Pipeline (Left) -->
  <g transform="translate(40, 90)" filter="url(#shadowBox)">
    <rect width="280" height="250" rx="10" fill="url(#cardGrad)" stroke="#202b3f" stroke-width="1.5"/>
    <rect width="280" height="32" rx="10" fill="#111827"/>
    <rect x="12" y="10" width="8" height="12" fill="#6366f1" rx="1.5"/>
    <text x="28" y="21" fill="#f1f5f9" font-size="11" font-weight="700">01. ATTACHMENT PIPELINE</text>

    <g transform="translate(16, 44)">
      <!-- Item 1: Text & Code -->
      <rect width="248" height="38" rx="6" fill="#090d16" stroke="#4338ca" stroke-opacity="0.4"/>
      <text x="12" y="18" fill="#818cf8" font-size="10" font-weight="700">📄 Code &amp; Markdown Files</text>
      <text x="12" y="30" fill="#94a3b8" font-size="8">Lines range #L1-L40 • Token count est (~4 ch/t)</text>

      <!-- Item 2: Images -->
      <g transform="translate(0, 46)">
        <rect width="248" height="38" rx="6" fill="#090d16" stroke="#0891b2" stroke-opacity="0.4"/>
        <text x="12" y="18" fill="#22d3ee" font-size="10" font-weight="700">🖼️ Image Previews</text>
        <text x="12" y="30" fill="#94a3b8" font-size="8">56x56 square thumbnail • Hover delete chip</text>
      </g>

      <!-- Item 3: Audio & Video -->
      <g transform="translate(0, 92)">
        <rect width="248" height="38" rx="6" fill="#090d16" stroke="#d97706" stroke-opacity="0.4"/>
        <text x="12" y="18" fill="#fbbf24" font-size="10" font-weight="700">🎵 Audio &amp; Media Attachments</text>
        <text x="12" y="30" fill="#94a3b8" font-size="8">Format badges (WAV/MP3/MP4) • Multimodal CLI</text>
      </g>

      <!-- Item 4: Token Aggregator -->
      <g transform="translate(0, 138)">
        <rect width="248" height="34" rx="6" fill="#162035" stroke="#202b3f"/>
        <text x="12" y="16" fill="#e2e8f0" font-size="9" font-weight="700">Token Aggregator &amp; Clear-All</text>
        <text x="12" y="27" fill="#64748b" font-size="8">Real-time prompt payload size display</text>
      </g>
    </g>
  </g>

  <!-- Section 2: Action Palette Catalog (Center) -->
  <g transform="translate(360, 90)" filter="url(#shadowBox)">
    <rect width="320" height="250" rx="10" fill="url(#cardGrad)" stroke="#202b3f" stroke-width="1.5"/>
    <rect width="320" height="32" rx="10" fill="#111827"/>
    <rect x="12" y="10" width="8" height="12" fill="#06b6d4" rx="1.5"/>
    <text x="28" y="21" fill="#f1f5f9" font-size="11" font-weight="700">02. WORKSPACE ACTION PALETTE</text>

    <g transform="translate(16, 44)">
      <!-- Action Groups -->
      <rect width="288" height="42" rx="6" fill="#090d16" stroke="#202b3f"/>
      <text x="12" y="18" fill="#38bdf8" font-size="10" font-weight="700">CATEGORY ROUTING</text>
      <text x="12" y="32" fill="#94a3b8" font-size="9">Git • Tests • Calidad • Seguridad • Arquitectura</text>

      <!-- Search & Keyboard Filter -->
      <g transform="translate(0, 50)">
        <rect width="288" height="46" rx="6" fill="#090d16" stroke="#0891b2" stroke-dasharray="3 3"/>
        <text x="12" y="18" fill="#22d3ee" font-size="10" font-weight="700">INSTANT FUZZY FILTER</text>
        <text x="12" y="32" fill="#94a3b8" font-size="9">Arrow navigation • Enter triggers first item • Esc exits</text>
      </g>

      <!-- Dispatch Executor -->
      <g transform="translate(0, 104)">
        <rect width="288" height="58" rx="6" fill="#090d16" stroke="#10b981" stroke-dasharray="3 3"/>
        <text x="12" y="18" fill="#34d399" font-size="10" font-weight="700">ACTION DISPATCH EXECUTOR</text>
        <text x="12" y="32" fill="#94a3b8" font-size="9">Inyecta prompt estructurado directo al chat</text>
        <text x="12" y="44" fill="#94a3b8" font-size="9">o dispara modal inspector sin recargar</text>
      </g>
    </g>
  </g>

  <!-- Section 3: DiffLines & Provider Badges (Right) -->
  <g transform="translate(720, 90)" filter="url(#shadowBox)">
    <rect width="240" height="250" rx="10" fill="url(#cardGrad)" stroke="#202b3f" stroke-width="1.5"/>
    <rect width="240" height="32" rx="10" fill="#111827"/>
    <rect x="12" y="10" width="8" height="12" fill="#10b981" rx="1.5"/>
    <text x="28" y="21" fill="#f1f5f9" font-size="11" font-weight="700">03. DIFF LINES &amp; BADGES</text>

    <g transform="translate(16, 44)">
