      <rect width="208" height="34" rx="4" fill="#061c14" stroke="#059669"/>
      <rect x="0" y="0" width="3" height="34" fill="#10b981"/>
      <text x="10" y="15" fill="#34d399" font-size="9" font-weight="700">+ Addition Block</text>
      <text x="10" y="26" fill="#059669" font-size="8">bg-emerald-500/15 border-l-2</text>

      <!-- Diff Line Removed -->
      <g transform="translate(0, 42)">
        <rect width="208" height="34" rx="4" fill="#1f1113" stroke="#991b1b"/>
        <rect x="0" y="0" width="3" height="34" fill="#ef4444"/>
        <text x="10" y="15" fill="#f87171" font-size="9" font-weight="700">- Deletion Block</text>
        <text x="10" y="26" fill="#b91c1c" font-size="8">bg-rose-500/15 border-l-2</text>
      </g>

      <!-- Provider Badges -->
      <g transform="translate(0, 84)">
        <rect width="208" height="74" rx="6" fill="#090d16" stroke="#1f293d"/>
        <text x="10" y="16" fill="#cbd5e1" font-size="9" font-weight="700">PROVIDER BADGES</text>
        <g transform="translate(10, 24)">
          <!-- Claude -->
          <rect width="20" height="20" rx="4" fill="#c2410c" fill-opacity="0.25" stroke="#ea580c"/>
          <text x="6" y="14" fill="#fdba74" font-size="10" font-weight="700">C</text>

          <!-- Google -->
          <g transform="translate(26, 0)">
            <rect width="20" height="20" rx="4" fill="#1d4ed8" fill-opacity="0.25" stroke="#2563eb"/>
            <text x="5" y="14" fill="#93c5fd" font-size="10">✦</text>
          </g>

          <!-- Ollama -->
          <g transform="translate(52, 0)">
            <rect width="20" height="20" rx="4" fill="#047857" fill-opacity="0.25" stroke="#059669"/>
            <text x="5" y="14" fill="#6ee7b7" font-size="10" font-weight="700">O</text>
          </g>

          <!-- Copilot -->
          <g transform="translate(78, 0)">
            <rect width="20" height="20" rx="4" fill="#4338ca" fill-opacity="0.25" stroke="#4f46e5"/>
            <text x="5" y="14" fill="#c7d2fe" font-size="10">🤖</text>
          </g>
        </g>
        <text x="10" y="62" fill="#64748b" font-size="8">High-contrast branding pills</text>
      </g>
    </g>
  </g>

  <!-- Connectors -->
  <g stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="4 2" fill="none" opacity="0.6">
    <path d="M 320, 180 L 360, 180" />
    <path d="M 680, 180 L 720, 180" />
  </g>

  <!-- Bottom Detailed Specification (Full Width) -->
  <g transform="translate(40, 365)" filter="url(#shadowBox)">
    <rect width="920" height="235" rx="10" fill="url(#cardGrad)" stroke="#202b3f" stroke-width="1.5"/>
    <rect width="920" height="32" rx="10" fill="#111827"/>
    <rect x="12" y="10" width="8" height="12" fill="#06b6d4" rx="1.5"/>
    <text x="28" y="21" fill="#f1f5f9" font-size="11" font-weight="700">COMPONENT BLUEPRINT // ATTACHMENTS, ACTIONS &amp; DIFF SPECIFICATION</text>
    <text x="640" y="21" fill="#94a3b8" font-size="10">PALETTE: #07090e / #0e131f / #202b3f | WCAG AAA</text>

    <!-- Sub-block 1: Attachment Chips Tray Layout -->
    <g transform="translate(20, 46)">
      <rect width="270" height="170" rx="8" fill="#080c14" stroke="#202b3f"/>
      <text x="14" y="22" fill="#c7d2fe" font-size="10" font-weight="700">ATTACHMENT TRAY MOCKUP</text>

      <g transform="translate(14, 32)">
        <text x="0" y="12" fill="#64748b" font-size="8">3 adjuntos • ~1,450 tokens de texto</text>
        <text x="195" y="12" fill="#f87171" font-size="8">Quitar todos</text>

        <!-- Chip 1 -->
        <g transform="translate(0, 20)">
          <rect width="242" height="26" rx="5" fill="#0d1424" stroke="#3730a3"/>
          <text x="8" y="17" fill="#818cf8" font-size="9">📄 src/webview/App.tsx#L1-L50</text>
          <text x="210" y="17" fill="#64748b" font-size="8">2.4kb ✕</text>
        </g>

        <!-- Chip 2: Image Thumbnail -->
        <g transform="translate(0, 52)">
          <rect width="44" height="44" rx="6" fill="#131a29" stroke="#38bdf8"/>
          <text x="14" y="26" fill="#38bdf8" font-size="16">🖼️</text>
          <rect x="30" y="-4" width="16" height="16" rx="8" fill="#000000" stroke="#ef4444"/>
          <text x="35" y="8" fill="#ef4444" font-size="9">✕</text>

          <g transform="translate(54, 10)">
            <text x="0" y="12" fill="#e2e8f0" font-size="9" font-weight="700">diagram-preview.png</text>
            <text x="0" y="24" fill="#64748b" font-size="8">128kb • Imagen adjunta</text>
          </g>
        </g>
      </g>
    </g>

    <!-- Sub-block 2: Action Palette Grid Item -->
    <g transform="translate(310, 46)">
      <rect width="280" height="170" rx="8" fill="#080c14" stroke="#202b3f"/>
      <text x="14" y="22" fill="#a5f3fc" font-size="10" font-weight="700">ACTION PALETTE ITEM</text>

      <g transform="translate(14, 32)">
        <!-- Action Card 1 -->
        <rect width="252" height="42" rx="6" fill="#0d1424" stroke="#202b3f"/>
        <rect x="8" y="8" width="26" height="26" rx="4" fill="#082f49" stroke="#0284c7"/>
        <text x="14" y="25" fill="#38bdf8" font-size="11">⚡</text>
        <text x="42" y="20" fill="#f8fafc" font-size="9" font-weight="700">Generar auto-commit</text>
        <text x="42" y="32" fill="#94a3b8" font-size="8">Convencional semántico para cambios staged</text>

        <!-- Action Card 2 -->
        <g transform="translate(0, 48)">
          <rect width="252" height="42" rx="6" fill="#0d1424" stroke="#202b3f"/>
          <rect x="8" y="8" width="26" height="26" rx="4" fill="#2d1538" stroke="#a21caf"/>
          <text x="14" y="25" fill="#e879f9" font-size="11">🛡️</text>
          <text x="42" y="20" fill="#f8fafc" font-size="9" font-weight="700">Auditar seguridad de rama</text>
          <text x="42" y="32" fill="#94a3b8" font-size="8">Secretos, permisos y regresiones de rama</text>
        </g>
      </g>
    </g>

    <!-- Sub-block 3: DiffLines Highlighting Spec -->
    <g transform="translate(610, 46)">
      <rect width="290" height="170" rx="8" fill="#080c14" stroke="#202b3f"/>
      <text x="14" y="22" fill="#86efac" font-size="10" font-weight="700">DIFFLINES HIGHLIGHTING</text>

      <g transform="translate(14, 32)">
        <rect width="262" height="96" rx="6" fill="#05070a" stroke="#202b3f"/>
        <!-- Line 1: Header -->
        <text x="10" y="16" fill="#64748b" font-size="8">@@ -14,6 +14,8 @@ export const SpotlightBar</text>

        <!-- Line 2: Context -->
        <text x="10" y="30" fill="#94a3b8" font-size="8">   const [query, setQuery] = useState('');</text>

        <!-- Line 3: Deletion -->
        <rect x="4" y="36" width="254" height="16" fill="#7f1d1d" fill-opacity="0.3"/>
        <line x1="4" y1="36" x2="4" y2="52" stroke="#ef4444" stroke-width="2"/>
        <text x="10" y="48" fill="#fca5a5" font-size="8">-  const [open, setOpen] = useState(false);</text>

        <!-- Line 4: Addition -->
        <rect x="4" y="54" width="254" height="16" fill="#064e3b" fill-opacity="0.4"/>
        <line x1="4" y1="54" x2="4" y2="70" stroke="#10b981" stroke-width="2"/>
        <text x="10" y="66" fill="#6ee7b7" font-size="8">+  const [open, setOpen] = useState(true);</text>

        <!-- Line 5: Context -->
        <text x="10" y="84" fill="#94a3b8" font-size="8">   useEffect(() =&gt; { ... }, []);</text>
      </g>
    </g>
  </g>
</svg>
