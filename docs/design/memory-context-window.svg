<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" width="100%" height="100%" style="background:#07090e; font-family: Inter, system-ui, sans-serif;">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="memBg" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#1e1b4b" stop-opacity="0.3" />
      <stop offset="70%" stop-color="#0e131f" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#07090e" stop-opacity="1" />
    </radialGradient>

    <!-- Glowing Filters -->
    <filter id="memGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <linearGradient id="activeTailGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>

    <linearGradient id="archiveGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="100%" stop-color="#475569" />
    </linearGradient>

    <!-- Pattern -->
    <pattern id="memGrid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#162035" stroke-width="1" stroke-opacity="0.5"/>
    </pattern>
  </defs>

  <rect width="760" height="360" fill="url(#memBg)"/>
  <rect width="760" height="360" fill="url(#memGrid)"/>

  <!-- Title & Context -->
  <g transform="translate(40, 40)">
    <circle cx="16" cy="16" r="16" fill="#6366f1" fill-opacity="0.2" stroke="#818cf8" stroke-width="1.5"/>
    <path d="M 11 16 C 11 13 13 11 16 11 C 19 11 21 13 21 16 C 21 19 19 21 16 21 C 13 21 11 19 11 16 Z" fill="none" stroke="#a5b4fc" stroke-width="2"/>
    <text x="44" y="15" fill="#f3f6fc" font-size="14" font-weight="800" letter-spacing="0.04em">VENTANA DE CONTEXTO DE MEMORIA VIVA</text>
    <text x="44" y="28" fill="#94a3b8" font-size="10" font-family="monospace">.agent-hub/experience.md · TAIL INJECTION (2.000 CARACTERES)</text>
  </g>

  <!-- Total Memory Bar Container -->
  <g transform="translate(40, 100)">
    <!-- Background Frame -->
    <rect width="680" height="50" rx="10" fill="#0e131f" stroke="#202b3f" stroke-width="1.5"/>

    <!-- Historical / Overflow Block -->
    <rect x="6" y="6" width="380" height="38" rx="6" fill="#202b3f" stroke="#334155" stroke-width="1"/>
    <text x="24" y="24" fill="#94a3b8" font-size="11" font-weight="600">HISTORIAL PERSISTIDO (ARCHIVO)</text>
    <text x="24" y="36" fill="#64748b" font-size="9" font-family="monospace">Conserva todas las lecciones del proyecto en disco</text>

    <!-- Active Tail Window (The 2,000 Chars Injected into Agents) -->
    <rect x="394" y="6" width="280" height="38" rx="6" fill="url(#activeTailGrad)" fill-opacity="0.2" stroke="#10b981" stroke-width="2" filter="url(#memGlow)"/>
    <circle cx="414" cy="25" r="4" fill="#34d399"/>
    <text x="426" y="23" fill="#6ee7b7" font-size="11" font-weight="800">VENTANA ACTIVA (ÚLTIMOS 2.000 CARACTERES)</text>
    <text x="426" y="36" fill="#a7f3d0" font-size="9" font-family="monospace">Inyección directa en el prompt del agente</text>
  </g>

  <!-- Breakdown Cards -->
  <g transform="translate(40, 180)">
    <!-- Card 1: Señal -->
    <rect width="210" height="130" rx="10" fill="#0e131f" stroke="#f59e0b" stroke-width="1.5" stroke-opacity="0.6"/>
    <rect x="14" y="14" width="60" height="18" rx="4" fill="#f59e0b" fill-opacity="0.15" stroke="#f59e0b" stroke-width="1"/>
    <text x="44" y="27" text-anchor="middle" fill="#fde68a" font-size="9" font-weight="800" font-family="monospace">SEÑAL</text>
    <text x="14" y="52" fill="#e2e8f0" font-size="11" font-weight="700">Cuándo aplica</text>
    <text x="14" y="70" fill="#94a3b8" font-size="10" width="180">Condición, disparador o contexto en el que se produce la situación técnica.</text>
    <circle cx="20" cy="115" r="3" fill="#f59e0b"/>
    <text x="30" y="118" fill="#fde68a" font-size="9" font-family="monospace">Disparador situacional</text>

    <!-- Card 2: Lección -->
    <g transform="translate(235, 0)">
      <rect width="210" height="130" rx="10" fill="#0e131f" stroke="#6366f1" stroke-width="1.5" stroke-opacity="0.6"/>
      <rect x="14" y="14" width="70" height="18" rx="4" fill="#6366f1" fill-opacity="0.15" stroke="#818cf8" stroke-width="1"/>
      <text x="49" y="27" text-anchor="middle" fill="#c7d2fe" font-size="9" font-weight="800" font-family="monospace">LECCIÓN</text>
      <text x="14" y="52" fill="#e2e8f0" font-size="11" font-weight="700">Qué aprender</text>
      <text x="14" y="70" fill="#94a3b8" font-size="10">Principio o regla de oro no obvia que evita errores recurrentes.</text>
      <circle cx="20" cy="115" r="3" fill="#818cf8"/>
      <text x="30" y="118" fill="#c7d2fe" font-size="9" font-family="monospace">Regla no obvia</text>
    </g>

    <!-- Card 3: Evidencia -->
    <g transform="translate(470, 0)">
      <rect width="210" height="130" rx="10" fill="#0e131f" stroke="#10b981" stroke-width="1.5" stroke-opacity="0.6"/>
      <rect x="14" y="14" width="75" height="18" rx="4" fill="#10b981" fill-opacity="0.15" stroke="#34d399" stroke-width="1"/>
      <text x="51" y="27" text-anchor="middle" fill="#a7f3d0" font-size="9" font-weight="800" font-family="monospace">EVIDENCIA</text>
      <text x="14" y="52" fill="#e2e8f0" font-size="11" font-weight="700">Comprobación</text>
      <text x="14" y="70" fill="#94a3b8" font-size="10">Ruta de archivo, commit, test o comando verificable.</text>
      <circle cx="20" cy="115" r="3" fill="#34d399"/>
      <text x="30" y="118" fill="#a7f3d0" font-size="9" font-family="monospace">Ruta o comando real</text>
    </g>
  </g>
</svg>
