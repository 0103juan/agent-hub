<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 900" width="1400" height="900">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#05070c"/>
      <stop offset="50%" stop-color="#070a13"/>
      <stop offset="100%" stop-color="#0a101f"/>
    </linearGradient>

    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#14b8a6"/>
    </linearGradient>

    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>

    <linearGradient id="roseGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f43f5e"/>
      <stop offset="100%" stop-color="#be123c"/>
    </linearGradient>

    <!-- Card Backgrounds -->
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0e1526" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#080c18" stop-opacity="0.98"/>
    </linearGradient>

    <!-- Glow & Shadow Filters -->
    <filter id="cyanGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.65"/>
    </filter>

    <!-- Tactical Grid Pattern -->
    <pattern id="tacticalGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#162238" stroke-width="0.5" stroke-opacity="0.4"/>
      <circle cx="40" cy="40" r="1" fill="#06b6d4" fill-opacity="0.25"/>
    </pattern>
  </defs>

  <!-- Deep Obsidian Canvas -->
  <rect width="1400" height="900" fill="url(#bgGrad)"/>
  <rect width="1400" height="900" fill="url(#tacticalGrid)"/>

  <!-- Top Accent Beam -->
  <rect x="0" y="0" width="1400" height="3" fill="url(#cyanGrad)"/>

  <!-- ================= HEADER SECTION ================= -->
  <g transform="translate(60, 45)">
    <!-- Header Badge -->
    <rect x="0" y="0" width="180" height="26" rx="6" fill="#06b6d4" fill-opacity="0.12" stroke="#06b6d4" stroke-opacity="0.35"/>
    <text x="12" y="17" font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="11" font-weight="700" fill="#22d3ee" letter-spacing="1.5">SPEC CARD #44 • HUD</text>

    <!-- Title & Subtitle -->
    <text x="0" y="58" font-family="'Inter', system-ui, sans-serif" font-size="26" font-weight="800" fill="#f8fafc" letter-spacing="-0.5">Interactive Diff &amp; Security Auditor Engine Architecture</text>
    <text x="0" y="82" font-family="'Inter', system-ui, sans-serif" font-size="13" font-weight="400" fill="#94a3b8">Auditoría heurística de secretos .env, contención de workspace, motor diff split/unified y scratchpad sincronizado</text>

    <!-- Status Indicators Right -->
    <g transform="translate(1080, 5)">
      <rect x="0" y="0" width="195" height="34" rx="8" fill="#0a0f1d" stroke="#202b3f" stroke-width="1"/>
      <circle cx="20" cy="17" r="4.5" fill="#10b981" filter="url(#cyanGlow)"/>
      <text x="34" y="21" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#34d399">SECURITY LEVEL: PRO</text>
    </g>
  </g>

  <!-- ================= PANEL 1: INTERACTIVE DIFF & PATCH ENGINE ================= -->
  <g transform="translate(60, 160)" filter="url(#cardShadow)">
    <rect width="610" height="680" rx="16" fill="url(#cardBg)" stroke="#1e2c45" stroke-width="1.2"/>

    <!-- Panel 1 Top Bar -->
    <rect width="610" height="48" rx="16" fill="#0a101d" stroke="#1a253a" stroke-width="1"/>
    <circle cx="28" cy="24" r="5" fill="#06b6d4"/>
    <text x="44" y="28" font-family="'Inter', sans-serif" font-size="14" font-weight="700" fill="#f1f5f9">Interactive Diff &amp; Patch Inspector</text>
    <text x="450" y="28" font-family="'JetBrains Mono', monospace" font-size="11" fill="#64748b">INTERACTIVEDIFF.TSX</text>

    <!-- Header Stats Banner -->
    <g transform="translate(24, 70)">
      <rect width="562" height="64" rx="12" fill="#0c1220" stroke="#1f2d47"/>
      <text x="16" y="26" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700" fill="#22d3ee">src/server/standalone.ts</text>
      <text x="16" y="46" font-family="'JetBrains Mono', monospace" font-size="10" fill="#94a3b8">Rama: <tspan fill="#f8fafc">feature/hud-modernization</tspan> • 4 fragmentos modificados</text>

      <g transform="translate(420, 16)">
        <rect width="125" height="32" rx="8" fill="#07090e" stroke="#202b3f"/>
        <text x="14" y="21" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="800" fill="#34d399">+42</text>
        <text x="52" y="21" font-family="'JetBrains Mono', monospace" font-size="12" fill="#64748b">/</text>
        <text x="68" y="21" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="800" fill="#f43f5e">-18</text>
      </g>
    </g>

    <!-- Diff Code Viewport (Split vs Unified) -->
    <g transform="translate(24, 150)">
      <rect width="562" height="380" rx="14" fill="#07090e" stroke="#1e2c45"/>
      
      <!-- Top Control Line -->
      <rect width="562" height="36" rx="14" fill="#0a0f1d" stroke="#182030"/>
      <text x="16" y="22" font-family="'Inter', sans-serif" font-size="11" font-weight="700" fill="#cbd5e1">Línea de Fragmento: @@ -42,12 +42,18 @@</text>

      <!-- View Mode Buttons -->
      <g transform="translate(415, 6)">
        <rect width="130" height="24" rx="6" fill="#131927" stroke="#202b3f"/>
        <rect width="65" height="24" rx="6" fill="#06b6d4"/>
        <text x="14" y="16" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" fill="#020617">Dividido</text>
        <text x="76" y="16" font-family="'JetBrains Mono', monospace" font-size="10" fill="#94a3b8">Unificado</text>
      </g>

      <!-- Code Lines -->
      <g transform="translate(12, 50)" font-family="'JetBrains Mono', monospace" font-size="11">
        <!-- Neutral line -->
        <text x="0" y="18" fill="#64748b">40</text>
        <text x="24" y="18" fill="#64748b">40</text>
        <text x="48" y="18" fill="#94a3b8">  const isElectron = typeof process !== 'undefined';</text>

        <!-- Deleted line -->
        <g transform="translate(0, 28)">
          <rect x="-8" y="0" width="554" height="22" fill="#f43f5e" fill-opacity="0.15"/>
          <text x="0" y="16" fill="#f43f5e">41</text>
          <text x="24" y="16" fill="#64748b">  </text>
          <text x="40" y="16" fill="#f87171">- if (require.main === module) {</text>
        </g>

        <!-- Deleted line 2 -->
        <g transform="translate(0, 52)">
          <rect x="-8" y="0" width="554" height="22" fill="#f43f5e" fill-opacity="0.15"/>
          <text x="0" y="16" fill="#f43f5e">42</text>
          <text x="24" y="16" fill="#64748b">  </text>
          <text x="40" y="16" fill="#f87171">-   startStandaloneServer(PORT);</text>
        </g>

        <!-- Added line 1 -->
        <g transform="translate(0, 76)">
          <rect x="-8" y="0" width="554" height="22" fill="#10b981" fill-opacity="0.15"/>
          <text x="0" y="16" fill="#64748b">  </text>
          <text x="24" y="16" fill="#34d399">41</text>
          <text x="40" y="16" fill="#6ee7b7">+ const isPackaged = !process.versions.electron;</text>
        </g>

        <!-- Added line 2 -->
        <g transform="translate(0, 100)">
          <rect x="-8" y="0" width="554" height="22" fill="#10b981" fill-opacity="0.15"/>
          <text x="0" y="16" fill="#64748b">  </text>
          <text x="24" y="16" fill="#34d399">42</text>
          <text x="40" y="16" fill="#6ee7b7">+ if (require.main === module &amp;&amp; isPackaged) {</text>
        </g>

        <!-- Added line 3 -->
        <g transform="translate(0, 124)">
          <rect x="-8" y="0" width="554" height="22" fill="#10b981" fill-opacity="0.15"/>
          <text x="0" y="16" fill="#64748b">  </text>
          <text x="24" y="16" fill="#34d399">43</text>
          <text x="40" y="16" fill="#6ee7b7">+   startStandaloneServer(PORT, resolveSafeCwd());</text>
        </g>

        <!-- Neutral line -->
        <g transform="translate(0, 150)">
          <text x="0" y="16" fill="#64748b">43</text>
          <text x="24" y="16" fill="#64748b">44</text>
          <text x="48" y="16" fill="#94a3b8">  }</text>
        </g>
      </g>
    </g>

    <!-- Bottom Actions in Panel 1 -->
    <g transform="translate(24, 545)">
      <rect width="562" height="110" rx="12" fill="#090e1a" stroke="#1e2c45"/>
      <text x="16" y="24" font-family="'Inter', sans-serif" font-size="12" font-weight="700" fill="#f8fafc">Acciones Tácticas de Aprobación de Parches</text>
      
      <g transform="translate(16, 42)">
        <rect width="160" height="34" rx="8" fill="url(#emeraldGrad)"/>
        <text x="24" y="22" font-family="'Inter', sans-serif" font-size="11" font-weight="700" fill="#020617">✓ Aplicar Parche</text>

        <g transform="translate(175, 0)">
          <rect width="170" height="34" rx="8" fill="#131927" stroke="#202b3f"/>
          <text x="24" y="22" font-family="'Inter', sans-serif" font-size="11" font-weight="600" fill="#cbd5e1">Copiar Git Diff</text>
        </g>

        <g transform="translate(360, 0)">
          <rect width="170" height="34" rx="8" fill="#450a0a" fill-opacity="0.4" stroke="#991b1b" stroke-opacity="0.6"/>
          <text x="24" y="22" font-family="'Inter', sans-serif" font-size="11" font-weight="600" fill="#fca5a5">Descartar Cambios</text>
        </g>
      </g>
    </g>
  </g>

  <!-- ================= PANEL 2: SECURITY & AUDITOR ENGINE ================= -->
  <g transform="translate(730, 160)" filter="url(#cardShadow)">
    <rect width="610" height="680" rx="16" fill="url(#cardBg)" stroke="#1e2c45" stroke-width="1.2"/>

    <!-- Top Bar inside Panel 2 -->
    <rect width="610" height="48" rx="16" fill="#0a101d" stroke="#1a253a" stroke-width="1"/>
    <circle cx="28" cy="24" r="5" fill="#f59e0b"/>
    <text x="44" y="28" font-family="'Inter', sans-serif" font-size="14" font-weight="700" fill="#f1f5f9">Security &amp; Workspace Containment Auditor</text>
    <text x="440" y="28" font-family="'JetBrains Mono', monospace" font-size="11" fill="#64748b">SECURITYAUDITOR.TSX</text>

    <!-- Overall Security Scorecard -->
    <g transform="translate(24, 70)">
      <rect width="562" height="120" rx="14" fill="#090e1a" stroke="#10b981" stroke-width="1.2" stroke-opacity="0.4"/>
      
      <circle cx="45" cy="50" r="26" fill="#10b981" fill-opacity="0.15" stroke="#10b981" stroke-width="2"/>
      <text x="32" y="58" font-family="'JetBrains Mono', monospace" font-size="22" font-weight="800" fill="#34d399">100</text>

      <g transform="translate(85, 30)">
        <text x="0" y="16" font-family="'Inter', sans-serif" font-size="15" font-weight="800" fill="#f8fafc">Puntuación de Seguridad Óptima</text>
        <text x="0" y="34" font-family="'Inter', sans-serif" font-size="11" fill="#94a3b8">0 fugas de secretos en .env • Workspace protegido con resolveSafeCwd</text>
        <text x="0" y="52" font-family="'JetBrains Mono', monospace" font-size="10" fill="#22d3ee">14/14 tests de contención y sandboxing aprobados</text>
      </g>
    </g>

    <!-- Security Checkpoints List -->
    <g transform="translate(24, 205)">
      <rect width="562" height="450" rx="14" fill="#090e1a" stroke="#1e2c45"/>
      <text x="16" y="24" font-family="'Inter', sans-serif" font-size="12" font-weight="700" fill="#f8fafc">Comprobaciones de Seguridad en Ejecución</text>

      <!-- Checkpoint 1: Workspace Containment -->
      <g transform="translate(16, 40)">
        <rect width="530" height="74" rx="10" fill="#064e3b" fill-opacity="0.2" stroke="#047857" stroke-opacity="0.5"/>
        <circle cx="24" cy="24" r="8" fill="#10b981" fill-opacity="0.2"/>
        <text x="44" y="24" font-family="'Inter', sans-serif" font-size="12" font-weight="700" fill="#34d399">Contención de Rutas del Sistema (isSystemOrAppDir)</text>
        <text x="44" y="42" font-family="'JetBrains Mono', monospace" font-size="10" fill="#a7f3d0">Bloqueo estricto de C:\Windows\System32 y AppData</text>
        <text x="44" y="58" font-family="'JetBrains Mono', monospace" font-size="9" fill="#94a3b8">Garantiza 0 escapes del agente a carpetas protegidas del OS</text>
        <rect x="445" y="14" width="70" height="20" rx="4" fill="#059669" fill-opacity="0.3"/>
        <text x="458" y="28" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="700" fill="#6ee7b7">PASSED</text>
      </g>

      <!-- Checkpoint 2: Secrets in .env -->
      <g transform="translate(16, 122)">
        <rect width="530" height="74" rx="10" fill="#064e3b" fill-opacity="0.2" stroke="#047857" stroke-opacity="0.5"/>
        <circle cx="24" cy="24" r="8" fill="#10b981" fill-opacity="0.2"/>
        <text x="44" y="24" font-family="'Inter', sans-serif" font-size="12" font-weight="700" fill="#34d399">Heurística de Claves API &amp; Secretos Expuestos</text>
        <text x="44" y="42" font-family="'JetBrains Mono', monospace" font-size="10" fill="#a7f3d0">.env ignorado en git status • Cero tokens commiteados</text>
        <text x="44" y="58" font-family="'JetBrains Mono', monospace" font-size="9" fill="#94a3b8">Búsqueda regex de sk-ant-*, ghp_*, AIzaSy* limpia</text>
        <rect x="445" y="14" width="70" height="20" rx="4" fill="#059669" fill-opacity="0.3"/>
        <text x="458" y="28" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="700" fill="#6ee7b7">PASSED</text>
      </g>

      <!-- Checkpoint 3: SQL Injection -->
      <g transform="translate(16, 204)">
        <rect width="530" height="74" rx="10" fill="#064e3b" fill-opacity="0.2" stroke="#047857" stroke-opacity="0.5"/>
        <circle cx="24" cy="24" r="8" fill="#10b981" fill-opacity="0.2"/>
        <text x="44" y="24" font-family="'Inter', sans-serif" font-size="12" font-weight="700" fill="#34d399">Protección SQL en Servidor MCP postgres</text>
        <text x="44" y="42" font-family="'JetBrains Mono', monospace" font-size="10" fill="#a7f3d0">Solo sentencias SELECT permitidas • DDL/DML bloqueado</text>
        <text x="44" y="58" font-family="'JetBrains Mono', monospace" font-size="9" fill="#94a3b8">Previene modificaciones accidentales o inyecciones DROP</text>
        <rect x="445" y="14" width="70" height="20" rx="4" fill="#059669" fill-opacity="0.3"/>
        <text x="458" y="28" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="700" fill="#6ee7b7">PASSED</text>
      </g>

      <!-- Checkpoint 4: Git Worktree Isolation -->
      <g transform="translate(16, 286)">
        <rect width="530" height="74" rx="10" fill="#064e3b" fill-opacity="0.2" stroke="#047857" stroke-opacity="0.5"/>
        <circle cx="24" cy="24" r="8" fill="#10b981" fill-opacity="0.2"/>
        <text x="44" y="24" font-family="'Inter', sans-serif" font-size="12" font-weight="700" fill="#34d399">Aislamiento de Git Worktree (Squad Isolation)</text>
        <text x="44" y="42" font-family="'JetBrains Mono', monospace" font-size="10" fill="#a7f3d0">Los agentes del equipo trabajan en ramas git separadas</text>
        <text x="44" y="58" font-family="'JetBrains Mono', monospace" font-size="9" fill="#94a3b8">Los cambios requieren PR y revisión humana antes de fusionarse</text>
        <rect x="445" y="14" width="70" height="20" rx="4" fill="#059669" fill-opacity="0.3"/>
        <text x="458" y="28" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="700" fill="#6ee7b7">PASSED</text>
      </g>

      <!-- Re-audit Action Button -->
      <g transform="translate(16, 375)">
        <rect width="530" height="46" rx="8" fill="#0c1220" stroke="#1f2d47"/>
        <text x="16" y="28" font-family="'Inter', sans-serif" font-size="11" fill="#cbd5e1">Auditoría continua activa en segundo plano</text>
        <rect x="400" y="8" width="115" height="30" rx="6" fill="url(#cyanGrad)"/>
        <text x="412" y="27" font-family="'Inter', sans-serif" font-size="10" font-weight="700" fill="#020617">Re-auditar ↻</text>
      </g>
    </g>
  </g>

  <!-- ================= FOOTER / ARCHITECTURE CREDITS ================= -->
  <g transform="translate(60, 860)">
    <text x="0" y="15" font-family="'JetBrains Mono', monospace" font-size="11" fill="#475569">AGENTHUB PROTOCOL SPECIFICATION • 100% PURIFIED HUD TOKENS • WCAG AAA READY</text>
    <text x="1060" y="15" font-family="'JetBrains Mono', monospace" font-size="11" fill="#06b6d4">14/14 TESTS PASSING • BUNDLE: 847 kB</text>
  </g>
</svg>
