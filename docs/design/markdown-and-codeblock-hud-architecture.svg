<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 640" width="100%" height="100%" style="background:#07090e; font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19"/>
      <stop offset="50%" stop-color="#07090e"/>
      <stop offset="100%" stop-color="#05070a"/>
    </linearGradient>

    <!-- Card Gradient -->
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#141c2e"/>
      <stop offset="100%" stop-color="#0e131f"/>
    </linearGradient>

    <!-- Glowing Filters -->
    <filter id="shadowBox" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.75"/>
    </filter>
  </defs>

  <!-- Background Grid -->
  <rect width="1000" height="640" fill="url(#bgGrad)"/>
  <g opacity="0.08" stroke="#38bdf8" stroke-width="1">
    <path d="M0,80 H1000 M0,160 H1000 M0,240 H1000 M0,320 H1000 M0,400 H1000 M0,480 H1000 M0,560 H1000" />
    <path d="M100,0 V640 M200,0 V640 M300,0 V640 M400,0 V640 M500,0 V640 M600,0 V640 M700,0 V640 M800,0 V640 M900,0 V640" />
  </g>

  <!-- Header -->
  <g transform="translate(40, 36)">
    <rect x="0" y="0" width="14" height="14" fill="#6366f1" rx="2" />
    <text x="24" y="12" fill="#f8fafc" font-size="14" font-weight="700" letter-spacing="0.1em">AGENTHUB // ARCHITECTURE</text>
    <text x="260" y="12" fill="#6366f1" font-size="12" font-weight="600">MARKDOWN ENGINE, CODEBLOCK &amp; DIAGRAM VIEWPORT</text>
    <text x="0" y="30" fill="#94a3b8" font-size="11">Tactical Dark HUD Protocol: Syntax Highlighting, Interactive Code Toolbar, GFM Tables &amp; Pan/Zoom Canvas</text>
  </g>

  <!-- Top Badges / Status -->
  <g transform="translate(740, 36)">
    <rect x="0" y="0" width="100" height="22" rx="4" fill="#162035" stroke="#202b3f" />
    <circle cx="12" cy="11" r="3" fill="#10b981" />
    <text x="22" y="15" fill="#e2e8f0" font-size="10">PARSER: LIVE</text>

    <rect x="110" y="0" width="110" height="22" rx="4" fill="#162035" stroke="#202b3f" />
    <text x="120" y="15" fill="#38bdf8" font-size="10">SYNTAX HUD v2</text>
  </g>

  <!-- Section 1: CodeBlock Architecture (Left) -->
  <g transform="translate(40, 90)" filter="url(#shadowBox)">
    <rect width="280" height="250" rx="10" fill="url(#cardGrad)" stroke="#202b3f" stroke-width="1.5"/>
    <rect width="280" height="32" rx="10" fill="#111827"/>
    <rect x="12" y="10" width="8" height="12" fill="#6366f1" rx="1.5"/>
    <text x="28" y="21" fill="#f1f5f9" font-size="11" font-weight="700">01. CODEBLOCK ANATOMY</text>

    <g transform="translate(16, 44)">
      <!-- Header Toolstrip -->
      <rect width="248" height="36" rx="6" fill="#090d16" stroke="#4338ca" stroke-opacity="0.4"/>
      <text x="10" y="16" fill="#818cf8" font-size="9" font-weight="700">TOOLSTRIP HEADER</text>
      <text x="10" y="28" fill="#94a3b8" font-size="8">Lang badge • Wrap • Line numbers • Download</text>

      <!-- Action Strip -->
      <g transform="translate(0, 42)">
        <rect width="248" height="36" rx="6" fill="#090d16" stroke="#0891b2" stroke-opacity="0.4"/>
        <text x="10" y="16" fill="#22d3ee" font-size="9" font-weight="700">ACTION CONTROLS</text>
        <text x="10" y="28" fill="#94a3b8" font-size="8">Copy • Inline diff • Save to workspace • Insert</text>
      </g>

      <!-- Pre & Code viewport -->
      <g transform="translate(0, 84)">
        <rect width="248" height="42" rx="6" fill="#05070a" stroke="#202b3f"/>
        <text x="10" y="16" fill="#e2e8f0" font-size="9" font-weight="700">SURFACE #05070a</text>
        <text x="10" y="28" fill="#94a3b8" font-size="8">Gutter with line index • Syntax coloring</text>
        <text x="10" y="38" fill="#64748b" font-size="7">Collapsible trigger if lines &gt; 30</text>
      </g>

      <!-- Visual Preview toggle -->
      <g transform="translate(0, 132)">
        <rect width="248" height="30" rx="6" fill="#162035" stroke="#202b3f"/>
        <text x="10" y="15" fill="#a5b4fc" font-size="9" font-weight="700">VISUAL TOGGLE</text>
        <text x="10" y="25" fill="#64748b" font-size="8">Auto-detect SVG, Mermaid &amp; HTML</text>
      </g>
    </g>
  </g>

  <!-- Section 2: GFM Table Engine (Center) -->
  <g transform="translate(360, 90)" filter="url(#shadowBox)">
    <rect width="320" height="250" rx="10" fill="url(#cardGrad)" stroke="#202b3f" stroke-width="1.5"/>
    <rect width="320" height="32" rx="10" fill="#111827"/>
    <rect x="12" y="10" width="8" height="12" fill="#06b6d4" rx="1.5"/>
    <text x="28" y="21" fill="#f1f5f9" font-size="11" font-weight="700">02. TACTICAL TABLE ENGINE</text>

    <g transform="translate(16, 44)">
      <!-- Thead spec -->
      <rect width="288" height="40" rx="6" fill="#090d16" stroke="#0891b2"/>
      <text x="12" y="16" fill="#22d3ee" font-size="10" font-weight="700">THEAD HEADER #07090e</text>
      <text x="12" y="30" fill="#94a3b8" font-size="9">Monospace uppercase • Cyan headings • Alignment support</text>

      <!-- Tbody Alternating rows -->
      <g transform="translate(0, 48)">
        <rect width="288" height="48" rx="6" fill="#090d16" stroke="#202b3f"/>
        <text x="12" y="16" fill="#f8fafc" font-size="10" font-weight="700">TBODY ALTERNATING ROWS</text>
        <text x="12" y="30" fill="#94a3b8" font-size="9">Even: #111726/40 • Hover: #162033/60</text>
        <text x="12" y="42" fill="#64748b" font-size="8">Word-break anywhere for hash/paths • Padding py-2</text>
      </g>

      <!-- Spreadsheet copy -->
      <g transform="translate(0, 104)">
        <rect width="288" height="52" rx="6" fill="#090d16" stroke="#10b981" stroke-dasharray="3 3"/>
        <text x="12" y="16" fill="#34d399" font-size="10" font-weight="700">SPREADSHEET EXPORT</text>
        <text x="12" y="30" fill="#94a3b8" font-size="9">Tab-separated TSV clipboard export</text>
        <text x="12" y="42" fill="#94a3b8" font-size="9">One-click paste directly into Excel / Google Sheets</text>
      </g>
    </g>
  </g>

  <!-- Section 3: Interactive Diagram Canvas (Right) -->
  <g transform="translate(720, 90)" filter="url(#shadowBox)">
    <rect width="240" height="250" rx="10" fill="url(#cardGrad)" stroke="#202b3f" stroke-width="1.5"/>
    <rect width="240" height="32" rx="10" fill="#111827"/>
    <rect x="12" y="10" width="8" height="12" fill="#10b981" rx="1.5"/>
    <text x="28" y="21" fill="#f1f5f9" font-size="11" font-weight="700">03. DIAGRAM VIEWPORT</text>

    <g transform="translate(16, 44)">
      <!-- Canvas -->
      <rect width="208" height="42" rx="6" fill="#090d16" stroke="#202b3f"/>
      <text x="10" y="16" fill="#cbd5e1" font-size="9" font-weight="700">CANVAS GRID</text>
      <text x="10" y="30" fill="#64748b" font-size="8">Radial dot matrix 20x20 • Drag pan</text>

      <!-- Controls Pill -->
      <g transform="translate(0, 48)">
        <rect width="208" height="42" rx="6" fill="#090d16" stroke="#4338ca"/>
        <text x="10" y="16" fill="#818cf8" font-size="9" font-weight="700">FLOATING CONTROLS</text>
        <text x="10" y="30" fill="#94a3b8" font-size="8">Zoom -/+, Scale %, Reset, Fullscreen</text>
      </g>

      <!-- Fullscreen Modal -->
      <g transform="translate(0, 96)">
        <rect width="208" height="46" rx="6" fill="#162035" stroke="#202b3f"/>
        <text x="10" y="16" fill="#e2e8f0" font-size="9" font-weight="700">FULLSCREEN INSPECTION</text>
        <text x="10" y="28" fill="#94a3b8" font-size="8">Esc exit • Wheel zoom • Center on double-click</text>
      </g>
    </g>
  </g>

  <!-- Connectors -->
  <g stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="4 2" fill="none" opacity="0.6">
    <path d="M 320, 180 L 360, 180" />
    <path d="M 680, 180 L 720, 180" />
  </g>

  <!-- Bottom Detailed Specification (Full Width) -->
  <g transform="translate(40, 365)" filter="url(#shadowBox)">
    <rect width="920" height="235" rx="10" fill="url(#cardGrad)" stroke="#202b3f" stroke-width="1.5"/>
    <rect width="920" height="32" rx="10" fill="#111827"/>
    <rect x="12" y="10" width="8" height="12" fill="#a855f7" rx="1.5"/>
    <text x="28" y="21" fill="#f1f5f9" font-size="11" font-weight="700">TYPOGRAPHY, CALLOUT BLOCKQUOTES &amp; HIGHLIGHT SPECIFICATION</text>
    <text x="640" y="21" fill="#94a3b8" font-size="10">PALETTE: #07090e / #0e131f / #202b3f | WCAG AAA</text>

    <!-- Sub-block 1: CodeBlock Header Spec -->
    <g transform="translate(20, 46)">
      <rect width="270" height="170" rx="8" fill="#080c14" stroke="#202b3f"/>
      <text x="14" y="22" fill="#c7d2fe" font-size="10" font-weight="700">CODEBLOCK TOOLBAR HUD</text>

      <g transform="translate(14, 34)">
        <rect width="242" height="26" rx="4" fill="#07090e" stroke="#202b3f"/>
        <text x="8" y="17" fill="#38bdf8" font-size="9" font-weight="700">typescript</text>
        <text x="64" y="17" fill="#64748b" font-size="8">• 42 líneas</text>
        <text x="140" y="17" fill="#94a3b8" font-size="8">Wrap | Num | Copiar</text>

        <!-- Code interior preview -->
        <g transform="translate(0, 30)">
          <rect width="242" height="66" rx="4" fill="#05070a" stroke="#202b3f"/>
          <text x="8" y="16" fill="#c084fc" font-size="8">import <tspan fill="#e2e8f0">{ useState }</tspan> from <tspan fill="#86efac">'react'</tspan>;</text>
          <text x="8" y="30" fill="#c084fc" font-size="8">export const <tspan fill="#60a5fa">App</tspan> = () =&gt; {</text>
          <text x="18" y="44" fill="#c084fc" font-size="8">  return <tspan fill="#86efac">&lt;TacticalHud /&gt;</tspan>;</text>
          <text x="8" y="58" fill="#c084fc" font-size="8">};</text>
        </g>
      </g>
    </g>

    <!-- Sub-block 2: Table Visual Spec -->
    <g transform="translate(310, 46)">
      <rect width="280" height="170" rx="8" fill="#080c14" stroke="#202b3f"/>
      <text x="14" y="22" fill="#a5f3fc" font-size="10" font-weight="700">TABLE LAYOUT SPEC</text>

      <g transform="translate(14, 34)">
        <rect width="252" height="96" rx="6" fill="#0e131f" stroke="#202b3f"/>
        <!-- Header -->
        <rect width="252" height="24" rx="6" fill="#07090e"/>
        <text x="10" y="16" fill="#38bdf8" font-size="8" font-weight="700">MODAL / VIEW</text>
        <text x="100" y="16" fill="#38bdf8" font-size="8" font-weight="700">ACCIONES</text>
        <text x="180" y="16" fill="#38bdf8" font-size="8" font-weight="700">ESTADO</text>

        <!-- Row 1 -->
        <g transform="translate(0, 24)">
          <line x1="0" y1="0" x2="252" y2="0" stroke="#202b3f"/>
          <text x="10" y="16" fill="#e2e8f0" font-size="8">ModelCatalog</text>
          <text x="100" y="16" fill="#94a3b8" font-size="8">Filtros &amp; Favs</text>
          <text x="180" y="16" fill="#10b981" font-size="8">✓ Live</text>
        </g>

        <!-- Row 2 -->
        <g transform="translate(0, 48)">
          <rect width="252" height="24" fill="#111726" fill-opacity="0.4"/>
          <line x1="0" y1="0" x2="252" y2="0" stroke="#202b3f"/>
          <text x="10" y="16" fill="#e2e8f0" font-size="8">ActionPalette</text>
          <text x="100" y="16" fill="#94a3b8" font-size="8">Fuzzy Groups</text>
          <text x="180" y="16" fill="#10b981" font-size="8">✓ Live</text>
        </g>
      </g>
    </g>

    <!-- Sub-block 3: Callout Blockquote & Heading -->
    <g transform="translate(610, 46)">
      <rect width="290" height="170" rx="8" fill="#080c14" stroke="#202b3f"/>
      <text x="14" y="22" fill="#fbcfe8" font-size="10" font-weight="700">BLOCKQUOTE CALLOUT</text>

      <g transform="translate(14, 34)">
        <!-- Callout box -->
        <rect width="262" height="54" rx="5" fill="#0e131f" stroke="#202b3f"/>
        <line x1="0" y1="0" x2="0" y2="54" stroke="#6366f1" stroke-width="4"/>
        <text x="12" y="18" fill="#a5b4fc" font-size="8" font-weight="700">💡 NOTA DE ARQUITECTURA</text>
        <text x="12" y="32" fill="#cbd5e1" font-size="8">Todas las vistas respetan el estándar</text>
        <text x="12" y="44" fill="#94a3b8" font-size="8">WCAG AA con contrastes &gt;= 4.5:1.</text>

        <!-- Headings preview -->
        <g transform="translate(0, 62)">
          <text x="0" y="14" fill="#f8fafc" font-size="10" font-weight="700">H1. Título de Sección</text>
          <text x="0" y="28" fill="#94a3b8" font-size="9" font-weight="600">H2. Subtítulo de Módulo</text>
        </g>
      </g>
    </g>
  </g>
</svg>
