<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 900" width="1400" height="900">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#05070c"/>
      <stop offset="50%" stop-color="#070a13"/>
      <stop offset="100%" stop-color="#0a101f"/>
    </linearGradient>

    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>

    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>

    <!-- Card Backgrounds -->
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0e1526" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#080c18" stop-opacity="0.98"/>
    </linearGradient>

    <!-- Filters -->
    <filter id="cyanGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="terminalCrt" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#10b981" flood-opacity="0.15"/>
    </filter>

    <!-- Grid Pattern -->
    <pattern id="tacticalGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#162238" stroke-width="0.5" stroke-opacity="0.4"/>
      <circle cx="40" cy="40" r="1" fill="#06b6d4" fill-opacity="0.25"/>
    </pattern>
  </defs>

  <!-- Deep Obsidian Canvas -->
  <rect width="1400" height="900" fill="url(#bgGrad)"/>
  <rect width="1400" height="900" fill="url(#tacticalGrid)"/>

  <!-- Top Accent Beam -->
  <rect x="0" y="0" width="1400" height="3" fill="url(#cyanGrad)"/>

  <!-- ==================== HEADER BLOCK ==================== -->
  <g transform="translate(60, 45)">
    <!-- Spec Badge -->
    <rect x="0" y="0" width="130" height="24" rx="6" fill="#0c172a" stroke="#06b6d4" stroke-width="1.2"/>
    <text x="65" y="16" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" text-anchor="middle" letter-spacing="1.5">SPEC CARD #40</text>

    <!-- Main Title -->
    <text x="145" y="18" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="800" letter-spacing="0.5">
      DOCUMENTS PIPELINE &amp; CRT TERMINAL CONSOLE ARCHITECTURE
    </text>
    <text x="0" y="46" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="13">
      Tactical Dark HUD v2.6 // Markdown Pipeline, Tree/List Dual Explorer, ANSI Terminal Engine &amp; Quick Snippets
    </text>

    <!-- Status Badges -->
    <g transform="translate(1040, -5)">
      <rect x="0" y="0" width="240" height="34" rx="8" fill="#0c1220" stroke="#202b3f" stroke-width="1"/>
      <circle cx="16" cy="17" r="4.5" fill="#10b981" filter="url(#cyanGlow)"/>
      <text x="30" y="21" fill="#10b981" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700">TOKEN PURITY: 100%</text>
      <text x="175" y="21" fill="#64748b" font-family="'JetBrains Mono', monospace" font-size="11">0 INDIGO</text>
    </g>
  </g>

  <!-- ==================== COLUMN 1: DOCUMENTS PIPELINE HUD ==================== -->
  <g transform="translate(60, 130)">
    <!-- Card Frame -->
    <rect x="0" y="0" width="620" height="710" rx="16" fill="url(#cardBg)" stroke="#202b3f" stroke-width="1.2"/>
    <rect x="0" y="0" width="620" height="710" rx="16" fill="none" stroke="#06b6d4" stroke-width="1.2" stroke-opacity="0.3"/>

    <!-- Header bar -->
    <path d="M 0 16 Q 0 0 16 0 L 604 0 Q 620 0 620 16 L 620 50 L 0 50 Z" fill="#0c1424"/>
    <line x1="0" y1="50" x2="620" y2="50" stroke="#202b3f" stroke-width="1"/>

    <circle cx="28" cy="25" r="5" fill="#06b6d4" filter="url(#cyanGlow)"/>
    <text x="44" y="29" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700">
      1. DocumentsView &amp; Markdown Pipeline
    </text>
    <text x="500" y="29" fill="#06b6d4" font-family="'JetBrains Mono', monospace" font-size="10.5" font-weight="600">
      DOCS PIPELINE
    </text>

    <!-- Dual Mode Explorer Spec -->
    <g transform="translate(24, 70)">
      <rect x="0" y="0" width="572" height="180" rx="12" fill="#080e1a" stroke="#202b3f" stroke-width="1"/>
      
      <!-- Top Action Bar -->
      <g transform="translate(16, 16)">
        <text x="0" y="14" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="12" font-weight="700">Explorador Dual (Árbol / Lista Cronológica)</text>
        
        <!-- Filter Tabs -->
        <g transform="translate(0, 26)">
          <rect x="0" y="0" width="56" height="22" rx="4" fill="#083344" stroke="#06b6d4" stroke-width="0.8"/>
          <text x="28" y="15" fill="#67e8f9" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" text-anchor="middle">Todos</text>

          <rect x="62" y="0" width="76" height="22" rx="4" fill="#131927" stroke="#202b3f" stroke-width="0.8"/>
          <text x="100" y="15" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="10" text-anchor="middle">Generados</text>

          <rect x="144" y="0" width="76" height="22" rx="4" fill="#131927" stroke="#202b3f" stroke-width="0.8"/>
          <text x="182" y="15" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="10" text-anchor="middle">Markdown</text>

          <rect x="226" y="0" width="56" height="22" rx="4" fill="#131927" stroke="#202b3f" stroke-width="0.8"/>
          <text x="254" y="15" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="10" text-anchor="middle">HTML</text>
        </g>
      </g>

      <!-- Document Item Active -->
      <g transform="translate(16, 80)">
        <rect x="0" y="0" width="540" height="38" rx="8" fill="#083344" fill-opacity="0.5" stroke="#06b6d4" stroke-width="1.2"/>
        <text x="12" y="24" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="12">📄</text>
        <text x="32" y="24" fill="#f8fafc" font-family="'JetBrains Mono', monospace" font-size="11.5" font-weight="700">experience.md</text>
        
        <rect x="150" y="10" width="40" height="18" rx="4" fill="#083344" stroke="#06b6d4" stroke-width="0.8"/>
        <text x="170" y="23" fill="#67e8f9" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="800" text-anchor="middle">HUB</text>
        
        <text x="440" y="24" fill="#64748b" font-family="'JetBrains Mono', monospace" font-size="10.5">hace 4 min</text>
      </g>

      <!-- Document Item Inactive -->
      <g transform="translate(16, 126)">
        <rect x="0" y="0" width="540" height="38" rx="8" fill="#0c1220" stroke="#202b3f" stroke-width="1"/>
        <text x="12" y="24" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="12">📄</text>
        <text x="32" y="24" fill="#cbd5e1" font-family="'JetBrains Mono', monospace" font-size="11.5">scratchpad.md</text>
        <text x="440" y="24" fill="#64748b" font-family="'JetBrains Mono', monospace" font-size="10.5">hace 1 hora</text>
      </g>
    </g>

    <!-- Editor Mode Toolbar & Split View -->
    <g transform="translate(24, 270)">
      <rect x="0" y="0" width="572" height="410" rx="12" fill="#070a13" stroke="#202b3f" stroke-width="1"/>
      
      <!-- Toolbar -->
      <g transform="translate(16, 14)">
        <text x="0" y="16" fill="#f8fafc" font-family="'JetBrains Mono', monospace" font-size="11.5" font-weight="700">.agent-hub/experience.md</text>
        <rect x="190" y="2" width="58" height="20" rx="4" fill="#064e3b" stroke="#059669" stroke-width="0.8"/>
        <text x="219" y="16" fill="#6ee7b7" font-family="'JetBrains Mono', monospace" font-size="9.5" font-weight="800" text-anchor="middle">AL DÍA</text>

        <!-- Mode Pills -->
        <g transform="translate(270, 0)">
          <rect x="0" y="0" width="56" height="24" rx="6" fill="#131927" stroke="#202b3f" stroke-width="1"/>
          <text x="28" y="16" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10.5" text-anchor="middle">Editar</text>

          <rect x="62" y="0" width="62" height="24" rx="6" fill="url(#cyanGrad)"/>
          <text x="93" y="16" fill="#04121d" font-family="system-ui, sans-serif" font-size="10.5" font-weight="800" text-anchor="middle">Dividido</text>

          <rect x="130" y="0" width="80" height="24" rx="6" fill="#131927" stroke="#202b3f" stroke-width="1"/>
          <text x="170" y="16" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10.5" text-anchor="middle">Vista previa</text>
        </g>
      </g>

      <!-- Split Preview Pane -->
      <g transform="translate(16, 52)">
        <!-- Left: Code Editor -->
        <rect x="0" y="0" width="264" height="336" rx="8" fill="#050810" stroke="#202b3f" stroke-width="1"/>
        <text x="14" y="24" fill="#06b6d4" font-family="'JetBrains Mono', monospace" font-size="11"># AgentHub Experience</text>
        <text x="14" y="46" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="10.5">## Protocolo de diseño</text>
        <text x="14" y="68" fill="#64748b" font-family="'JetBrains Mono', monospace" font-size="10.5">- Tokens de color unificados</text>
        <text x="14" y="88" fill="#64748b" font-family="'JetBrains Mono', monospace" font-size="10.5">- Contraste WCAG AAA (13:1)</text>
        <text x="14" y="108" fill="#64748b" font-family="'JetBrains Mono', monospace" font-size="10.5">- Zero regression en flujos</text>

        <!-- Right: Rendered Markdown -->
        <rect x="276" y="0" width="264" height="336" rx="8" fill="#0a0f1d" stroke="#202b3f" stroke-width="1"/>
        <text x="290" y="26" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="14" font-weight="800">AgentHub Experience</text>
        <text x="290" y="52" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="12" font-weight="700">Protocolo de diseño</text>
        <circle cx="296" cy="72" r="2.5" fill="#06b6d4"/>
        <text x="306" y="76" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="11">Tokens de color unificados</text>
        <circle cx="296" cy="92" r="2.5" fill="#06b6d4"/>
        <text x="306" y="96" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="11">Contraste WCAG AAA (13:1)</text>
        <circle cx="296" cy="112" r="2.5" fill="#06b6d4"/>
        <text x="306" y="116" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="11">Zero regression en flujos</text>
      </g>
    </g>
  </g>

  <!-- ==================== COLUMN 2: CRT TERMINAL CONSOLE HUD ==================== -->
  <g transform="translate(710, 130)">
    <!-- Card Frame -->
    <rect x="0" y="0" width="630" height="710" rx="16" fill="url(#cardBg)" stroke="#202b3f" stroke-width="1.2"/>
    <rect x="0" y="0" width="630" height="710" rx="16" fill="none" stroke="#10b981" stroke-width="1.2" stroke-opacity="0.3"/>

    <!-- Header bar -->
    <path d="M 0 16 Q 0 0 16 0 L 614 0 Q 630 0 630 16 L 630 50 L 0 50 Z" fill="#0c1424"/>
    <line x1="0" y1="50" x2="630" y2="50" stroke="#202b3f" stroke-width="1"/>

    <circle cx="28" cy="25" r="5" fill="#10b981" filter="url(#cyanGlow)"/>
    <text x="44" y="29" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700">
      2. Terminal Console Engine &amp; Quick Snippets
    </text>
    <text x="510" y="29" fill="#10b981" font-family="'JetBrains Mono', monospace" font-size="10.5" font-weight="600">
      CRT CONSOLE
    </text>

    <!-- Terminal Tabs & Shell Bar -->
    <g transform="translate(24, 70)">
      <rect x="0" y="0" width="582" height="42" rx="10" fill="#0a0f1d" stroke="#202b3f" stroke-width="1"/>
      
      <!-- Tab 1: Active -->
      <g transform="translate(12, 8)">
        <rect x="0" y="0" width="94" height="26" rx="6" fill="#131927" stroke="#06b6d4" stroke-width="1"/>
        <circle cx="12" cy="13" r="3" fill="#10b981"/>
        <text x="24" y="17" fill="#67e8f9" font-family="'JetBrains Mono', monospace" font-size="10.5" font-weight="700">pwsh (1)</text>
      </g>

      <!-- Tab 2: Inactive -->
      <g transform="translate(112, 8)">
        <rect x="0" y="0" width="80" height="26" rx="6" fill="#070a13" stroke="#202b3f" stroke-width="0.8"/>
        <text x="16" y="17" fill="#64748b" font-family="'JetBrains Mono', monospace" font-size="10.5">bash (2)</text>
      </g>

      <!-- Quick Commands -->
      <g transform="translate(270, 8)">
        <rect x="0" y="0" width="80" height="26" rx="6" fill="#131927" stroke="#202b3f" stroke-width="1"/>
        <text x="40" y="17" fill="#cbd5e1" font-family="'JetBrains Mono', monospace" font-size="10" text-anchor="middle">npm test</text>

        <rect x="86" y="0" width="84" height="26" rx="6" fill="#131927" stroke="#202b3f" stroke-width="1"/>
        <text x="128" y="17" fill="#cbd5e1" font-family="'JetBrains Mono', monospace" font-size="10" text-anchor="middle">npm build</text>

        <rect x="176" y="0" width="88" height="26" rx="6" fill="#131927" stroke="#202b3f" stroke-width="1"/>
        <text x="220" y="17" fill="#cbd5e1" font-family="'JetBrains Mono', monospace" font-size="10" text-anchor="middle">git status</text>
      </g>
    </g>

    <!-- CRT Output Screen -->
    <g transform="translate(24, 126)">
      <rect x="0" y="0" width="582" height="450" rx="12" fill="#04060b" stroke="#202b3f" stroke-width="1" filter="url(#terminalCrt)"/>
      
      <!-- Scanlines effect lines -->
      <line x1="0" y1="40" x2="582" y2="40" stroke="#10b981" stroke-width="0.3" stroke-opacity="0.15"/>
      <line x1="0" y1="80" x2="582" y2="80" stroke="#10b981" stroke-width="0.3" stroke-opacity="0.15"/>
      <line x1="0" y1="120" x2="582" y2="120" stroke="#10b981" stroke-width="0.3" stroke-opacity="0.15"/>
      <line x1="0" y1="160" x2="582" y2="160" stroke="#10b981" stroke-width="0.3" stroke-opacity="0.15"/>
      <line x1="0" y1="200" x2="582" y2="200" stroke="#10b981" stroke-width="0.3" stroke-opacity="0.15"/>

      <!-- Console text -->
      <g transform="translate(18, 28)">
        <text x="0" y="0" fill="#10b981" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700">$ npm run test:flows</text>
        
        <text x="0" y="24" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="11">▶ isSystemOrAppDir (Protección de workspace)</text>
        <text x="14" y="44" fill="#34d399" font-family="'JetBrains Mono', monospace" font-size="11">✔ detecta System32 y rutas de Windows como inválidas (0.17ms)</text>
        <text x="14" y="64" fill="#34d399" font-family="'JetBrains Mono', monospace" font-size="11">✔ detecta carpeta AgentHub como inválida (0.47ms)</text>
        <text x="14" y="84" fill="#34d399" font-family="'JetBrains Mono', monospace" font-size="11">✔ permite directorios de usuario legítimos (0.10ms)</text>
        
        <text x="0" y="112" fill="#10b981" font-family="'JetBrains Mono', monospace" font-size="11.5" font-weight="700">ℹ tests 14 · suites 5 · pass 14 · fail 0 (58.3ms)</text>
        
        <text x="0" y="146" fill="#10b981" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700">$ npm run build</text>
        <text x="14" y="170" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="11">dist/standalone.js   146.4kb (14ms)</text>
        <text x="14" y="190" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="11">dist/electron/main.js 158.2kb (13ms)</text>
        <text x="14" y="210" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="11">dist/webview/index.js 853.24kb (gzip: 207.58kb)</text>
        
        <text x="0" y="238" fill="#34d399" font-family="'JetBrains Mono', monospace" font-size="11.5" font-weight="700">✓ built in 2.03s</text>
        
        <!-- Prompt cursor -->
        <text x="0" y="272" fill="#10b981" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700">$ </text>
        <rect x="16" y="260" width="8" height="15" fill="#10b981" filter="url(#cyanGlow)"/>
      </g>
