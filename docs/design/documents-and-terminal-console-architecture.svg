        <rect x="18" y="0" width="410" height="34" rx="8" fill="#050812" stroke="#06b6d4" stroke-width="1.2" stroke-opacity="0.8"/>
        <text x="32" y="22" fill="#f8fafc" font-family="'JetBrains Mono', monospace" font-size="11.5">git status -s</text>
        
        <!-- Tactical Cyan Execute Button -->
        <rect x="438" y="0" width="112" height="34" rx="8" fill="url(#cyanGrad)"/>
        <text x="494" y="22" fill="#04121d" font-family="system-ui, sans-serif" font-size="12" font-weight="800" text-anchor="middle">Ejecutar ▶</text>
      </g>

      <!-- Keybinding legend -->
      <g transform="translate(34, 62)">
        <text x="0" y="14" fill="#64748b" font-family="'JetBrains Mono', monospace" font-size="10.5">
          Tab autocompleta · Ctrl+R búsqueda inversa en historial · Ctrl+F buscar en salida
        </text>
