    <text x="20" y="19" fill="#64748b" font-family="'JetBrains Mono', monospace" font-size="10.5">
      AGENTHUB DESIGN SYSTEM // SPEC CARD #40 // DOCUMENTS &amp; CRT TERMINAL CONSOLE // WCAG AAA // 60 FPS
    </text>
    <text x="1200" y="19" fill="#10b981" font-family="'JetBrains Mono', monospace" font-size="10.5" font-weight="700" text-anchor="end">
