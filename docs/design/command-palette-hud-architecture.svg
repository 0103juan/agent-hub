<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#07090e" />
      <stop offset="50%" stop-color="#0a0d16" />
      <stop offset="100%" stop-color="#07090e" />
    </linearGradient>
    <linearGradient id="primaryGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0e131f" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#0a0d16" stop-opacity="0.98" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
    .sans { font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
  </style>

  <!-- Background Canvas -->
  <rect width="960" height="540" fill="url(#bgGrad)" />

  <!-- Subtle Blueprint Grid -->
  <g opacity="0.08" stroke="#38bdf8" stroke-width="1">
    <path d="M 0 40 L 960 40 M 0 80 L 960 80 M 0 120 L 960 120 M 0 160 L 960 160 M 0 200 L 960 200 M 0 240 L 960 240 M 0 280 L 960 280 M 0 320 L 960 320 M 0 360 L 960 360 M 0 400 L 960 400 M 0 440 L 960 440 M 0 480 L 960 480 M 0 520 L 960 520" />
    <path d="M 60 0 L 60 540 M 120 0 L 120 540 M 180 0 L 180 540 M 240 0 L 240 540 M 300 0 L 300 540 M 360 0 L 360 540 M 420 0 L 420 540 M 480 0 L 480 540 M 540 0 L 540 540 M 600 0 L 600 540 M 660 0 L 660 540 M 720 0 L 720 540 M 780 0 L 780 540 M 840 0 L 840 540 M 900 0 L 900 540" />
  </g>

  <!-- Header Banner -->
  <g transform="translate(60, 32)">
    <rect x="0" y="0" width="840" height="44" rx="8" fill="#0e131f" stroke="#202b3f" stroke-width="1.5" />
    <circle cx="24" cy="22" r="6" fill="#6366f1" filter="url(#glow)" />
    <text x="42" y="27" fill="#f8fafc" font-size="14" font-weight="700" class="sans" letter-spacing="0.5">AGENTHUB HUD :: COMMAND PALETTE &amp; MODAL ARCHITECTURE (Ctrl+K)</text>
    <rect x="680" y="10" width="140" height="24" rx="4" fill="#6366f1" fill-opacity="0.15" stroke="#6366f1" stroke-width="1" />
    <text x="750" y="26" fill="#818cf8" font-size="11" font-weight="600" text-anchor="middle" class="mono">SYSTEM DESIGN V2</text>
  </g>

  <!-- Central Modal Window Preview -->
  <g transform="translate(140, 100)">
    <!-- Outer Glow & Drop Shadow -->
    <rect x="-6" y="-6" width="692" height="392" rx="16" fill="none" stroke="#6366f1" stroke-opacity="0.3" stroke-width="2" filter="url(#glow)" />
    <rect x="0" y="0" width="680" height="380" rx="12" fill="url(#cardGrad)" stroke="#202b3f" stroke-width="1.5" />

    <!-- Modal Title Bar -->
    <rect x="0" y="0" width="680" height="42" rx="12" fill="#0e131f" />
    <rect x="0" y="41" width="680" height="1" fill="#202b3f" />
    
    <!-- Title and Icon -->
    <rect x="16" y="12" width="20" height="20" rx="4" fill="#6366f1" fill-opacity="0.2" stroke="#6366f1" stroke-width="1" />
    <path d="M 22 22 L 30 22 M 26 18 L 26 26" stroke="#818cf8" stroke-width="1.5" stroke-linecap="round" />
    <text x="44" y="26" fill="#f1f5f9" font-size="13" font-weight="600" class="sans">Paleta de Comandos</text>
    <rect x="180" y="12" width="56" height="18" rx="4" fill="#131927" stroke="#202b3f" stroke-width="1" />
    <text x="208" y="24" fill="#94a3b8" font-size="10" font-weight="600" text-anchor="middle" class="mono">Ctrl+K</text>

    <!-- Close button icon -->
    <rect x="644" y="11" width="22" height="22" rx="4" fill="#131927" stroke="#202b3f" stroke-width="1" />
    <path d="M 650 17 L 660 27 M 660 17 L 650 27" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round" />

    <!-- Search Input Area -->
    <g transform="translate(16, 54)">
      <rect x="0" y="0" width="648" height="42" rx="8" fill="#07090e" stroke="#6366f1" stroke-width="1.5" />
      <circle cx="20" cy="21" r="5" fill="none" stroke="#06b6d4" stroke-width="1.5" />
      <path d="M 24 25 L 30 31" stroke="#06b6d4" stroke-width="1.5" stroke-linecap="round" />
      <text x="38" y="26" fill="#f8fafc" font-size="13" class="sans" font-weight="500">planificar refactor</text>
      <line x1="168" y1="12" x2="168" y2="30" stroke="#38bdf8" stroke-width="2" />
      
      <!-- Quick category badges -->
      <g transform="translate(420, 9)">
        <rect x="0" y="0" width="46" height="24" rx="4" fill="#131927" stroke="#202b3f" />
        <text x="23" y="16" fill="#94a3b8" font-size="10" text-anchor="middle" class="mono">TODOS</text>
        <rect x="52" y="0" width="52" height="24" rx="4" fill="#6366f1" fill-opacity="0.2" stroke="#6366f1" stroke-width="1" />
        <text x="78" y="16" fill="#a5b4fc" font-size="10" font-weight="700" text-anchor="middle" class="mono">ROLES</text>
        <rect x="110" y="0" width="60" height="24" rx="4" fill="#131927" stroke="#202b3f" />
        <text x="140" y="16" fill="#94a3b8" font-size="10" text-anchor="middle" class="mono">ACCIONES</text>
      </g>
    </g>

    <!-- Results List (HUD Elements) -->
    <g transform="translate(16, 108)">
      <!-- Item 1: Active Role -->
      <g transform="translate(0, 0)">
        <rect x="0" y="0" width="648" height="46" rx="8" fill="#131927" stroke="#6366f1" stroke-width="1" />
        <rect x="0" y="4" width="4" height="38" rx="2" fill="#6366f1" />
        
        <rect x="14" y="11" width="62" height="24" rx="4" fill="#6366f1" fill-opacity="0.2" stroke="#6366f1" stroke-opacity="0.4" />
        <text x="45" y="26" fill="#a5b4fc" font-size="10" font-weight="700" text-anchor="middle" class="mono">ROL</text>
        
        <text x="86" y="24" fill="#f8fafc" font-size="13" font-weight="600" class="sans">Arquitecto de Solución</text>
        <text x="86" y="38" fill="#94a3b8" font-size="10" class="mono">Planificación de alto nivel, contratos de interfaz y diagramas C4</text>
        
        <rect x="510" y="13" width="124" height="20" rx="4" fill="#07090e" stroke="#202b3f" />
        <text x="572" y="26" fill="#38bdf8" font-size="10" font-weight="600" text-anchor="middle" class="mono">claude-3-7 · high</text>
      </g>

      <!-- Item 2: Session -->
      <g transform="translate(0, 52)">
        <rect x="0" y="0" width="648" height="46" rx="8" fill="#0a0d16" stroke="#202b3f" stroke-width="1" />
        <rect x="14" y="11" width="62" height="24" rx="4" fill="#10b981" fill-opacity="0.15" stroke="#10b981" stroke-opacity="0.3" />
        <text x="45" y="26" fill="#34d399" font-size="10" font-weight="700" text-anchor="middle" class="mono">SESIÓN</text>
        
        <text x="86" y="24" fill="#e2e8f0" font-size="13" font-weight="500" class="sans">Refactorización de Vistas Webview HUD</text>
        <text x="86" y="38" fill="#64748b" font-size="10" class="mono">Proyecto: agent-hub · Actualizado hace 3 min</text>
        
        <rect x="548" y="13" width="86" height="20" rx="4" fill="#07090e" stroke="#202b3f" />
        <text x="591" y="26" fill="#94a3b8" font-size="10" text-anchor="middle" class="mono">14 mensajes</text>
      </g>

      <!-- Item 3: Action -->
      <g transform="translate(0, 104)">
        <rect x="0" y="0" width="648" height="46" rx="8" fill="#0a0d16" stroke="#202b3f" stroke-width="1" />
        <rect x="14" y="11" width="62" height="24" rx="4" fill="#f59e0b" fill-opacity="0.15" stroke="#f59e0b" stroke-opacity="0.3" />
        <text x="45" y="26" fill="#fbbf24" font-size="10" font-weight="700" text-anchor="middle" class="mono">ACCIÓN</text>
        
        <text x="86" y="24" fill="#e2e8f0" font-size="13" font-weight="500" class="sans">Ejecutar Verificación de Flujos y Tests</text>
        <text x="86" y="38" fill="#64748b" font-size="10" class="mono">npm run test:flows — Correr suite de validación Jest/Node</text>
        
        <rect x="548" y="13" width="86" height="20" rx="4" fill="#07090e" stroke="#202b3f" />
        <text x="591" y="26" fill="#fbbf24" font-size="10" font-weight="600" text-anchor="middle" class="mono">run:test</text>
      </g>

      <!-- Item 4: Application Command -->
      <g transform="translate(0, 156)">
        <rect x="0" y="0" width="648" height="46" rx="8" fill="#0a0d16" stroke="#202b3f" stroke-width="1" />
        <rect x="14" y="11" width="62" height="24" rx="4" fill="#06b6d4" fill-opacity="0.15" stroke="#06b6d4" stroke-opacity="0.3" />
        <text x="45" y="26" fill="#22d3ee" font-size="10" font-weight="700" text-anchor="middle" class="mono">SISTEMA</text>
        
        <text x="86" y="24" fill="#e2e8f0" font-size="13" font-weight="500" class="sans">Alternar Consola Terminal Drawer</text>
        <text x="86" y="38" fill="#64748b" font-size="10" class="mono">Abrir/Cerrar panel de shell inferior con historial interactivo</text>
        
        <rect x="568" y="13" width="66" height="20" rx="4" fill="#07090e" stroke="#202b3f" />
        <text x="601" y="26" fill="#38bdf8" font-size="10" font-weight="700" text-anchor="middle" class="mono">Ctrl+`</text>
      </g>
    </g>

    <!-- Footer HUD Navigation Bar -->
    <g transform="translate(0, 338)">
      <rect x="0" y="0" width="680" height="42" rx="12" fill="#0e131f" />
      <rect x="0" y="0" width="680" height="1" fill="#202b3f" />
      
      <!-- Keycap shortcuts -->
      <g transform="translate(20, 12)">
        <rect x="0" y="0" width="24" height="18" rx="3" fill="#131927" stroke="#202b3f" />
        <text x="12" y="13" fill="#cbd5e1" font-size="9" text-anchor="middle" class="mono font-bold">↑</text>
        <rect x="28" y="0" width="24" height="18" rx="3" fill="#131927" stroke="#202b3f" />
        <text x="40" y="13" fill="#cbd5e1" font-size="9" text-anchor="middle" class="mono font-bold">↓</text>
        <text x="58" y="13" fill="#94a3b8" font-size="10" class="sans">navegar</text>

        <rect x="114" y="0" width="28" height="18" rx="3" fill="#131927" stroke="#202b3f" />
        <text x="128" y="13" fill="#cbd5e1" font-size="9" text-anchor="middle" class="mono font-bold">↵</text>
        <text x="148" y="13" fill="#94a3b8" font-size="10" class="sans">ejecutar</text>

        <rect x="204" y="0" width="34" height="18" rx="3" fill="#131927" stroke="#202b3f" />
        <text x="221" y="13" fill="#cbd5e1" font-size="9" text-anchor="middle" class="mono font-bold">Esc</text>
        <text x="244" y="13" fill="#94a3b8" font-size="10" class="sans">cerrar</text>
      </g>

      <!-- Status counter -->
      <rect x="560" y="10" width="102" height="22" rx="4" fill="#07090e" stroke="#202b3f" />
      <circle cx="572" cy="21" r="3" fill="#10b981" />
      <text x="622" y="25" fill="#94a3b8" font-size="10" text-anchor="middle" class="mono">42 ACCIONES</text>
    </g>
  </g>
</svg>
