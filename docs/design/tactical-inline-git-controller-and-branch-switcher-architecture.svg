<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" style="background:#07090e; font-family: ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;">
  <defs>
    <!-- Background Grid -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#162035" stroke-width="0.8" opacity="0.4"/>
    </pattern>
    <radialGradient id="emerald-glow" cx="50%" cy="0%" r="70%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#07090e" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow-drop" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.65"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="1600" height="900" fill="#07090e"/>
  <rect width="1600" height="900" fill="url(#grid)"/>
  <rect width="1600" height="500" fill="url(#emerald-glow)"/>

  <!-- Master Header -->
  <g transform="translate(48, 36)">
    <!-- Brand / Badge -->
    <rect x="0" y="0" width="132" height="26" rx="6" fill="#0c1220" stroke="#10b981" stroke-width="1.2"/>
    <text x="12" y="17" fill="#34d399" font-size="11" font-weight="700" letter-spacing="1.5" font-family="ui-monospace, monospace">SPEC CARD #66</text>

    <text x="148" y="18" fill="#64748b" font-size="12" font-family="ui-monospace, monospace">|</text>
    <text x="164" y="18" fill="#94a3b8" font-size="12" font-weight="600" letter-spacing="0.5">SECTION 2.S TACTICAL INLINE GIT CONTROLLER &amp; BRANCH SWITCHER</text>

    <!-- Master Title -->
    <text x="0" y="62" fill="#f8fafc" font-size="28" font-weight="800" letter-spacing="-0.5">Controlador Git Inline, Conmutador de Ramas y Estado de Cambios</text>
    <text x="0" y="86" fill="#94a3b8" font-size="14">Insignia interactiva de rama activa, contador de archivos sin commitear, inicializador git init, checkout en 1-clic y creación rápida sanitizada</text>

    <!-- Top Right Telemetry Badges -->
    <g transform="translate(1120, 10)">
      <rect x="0" y="0" width="384" height="64" rx="10" fill="#0a0e17" stroke="#202b3f" stroke-width="1.2" filter="url(#shadow-drop)"/>
      <circle cx="24" cy="32" r="6" fill="#10b981"/>
      <circle cx="24" cy="32" r="10" fill="none" stroke="#10b981" stroke-width="1.5" opacity="0.4"/>
      <text x="42" y="27" fill="#f8fafc" font-size="12" font-weight="700">GIT CONTROLLER: SYNCHRONIZED</text>
      <text x="42" y="45" fill="#64748b" font-size="10" font-family="ui-monospace, monospace">Zero-Fetch • Local Inspection • Squad Worktrees</text>
      <rect x="300" y="16" width="70" height="32" rx="6" fill="#0c1220" stroke="#10b981" stroke-width="1"/>
      <text x="314" y="36" fill="#34d399" font-size="12" font-weight="800" font-family="ui-monospace, monospace">60 FPS</text>
    </g>
  </g>

  <!-- Three Architecture Pillars -->

  <!-- ================= PILLAR 1: INLINE BADGE & UNCOMMITTED CHANGES ================= -->
  <g transform="translate(48, 150)">
    <rect x="0" y="0" width="470" height="540" rx="14" fill="#0a0e17" stroke="#202b3f" stroke-width="1.4" filter="url(#shadow-drop)"/>
    <rect x="0" y="0" width="470" height="48" rx="14" fill="#0c1220"/>
    <path d="M 0 48 L 470 48" stroke="#202b3f" stroke-width="1.2"/>

    <!-- Pillar 1 Header -->
    <rect x="16" y="12" width="24" height="24" rx="6" fill="#10b981" fill-opacity="0.15" stroke="#10b981" stroke-width="1"/>
    <circle cx="28" cy="24" r="5" fill="none" stroke="#34d399" stroke-width="1.5"/>
    <text x="48" y="28" fill="#f8fafc" font-size="14" font-weight="700">1. Insignia Inline &amp; Estado de Cambios</text>
    <rect x="350" y="14" width="104" height="20" rx="4" fill="#162035" stroke="#202b3f" stroke-width="1"/>
    <text x="364" y="28" fill="#34d399" font-size="10" font-family="ui-monospace, monospace">GitBranchBadge</text>

    <!-- Content 1 -->
    <g transform="translate(20, 68)">
      <!-- Step 1: Clean tree vs dirty tree badges -->
      <rect x="0" y="0" width="430" height="114" rx="8" fill="#07090e" stroke="#202b3f" stroke-width="1"/>
      <text x="14" y="22" fill="#38bdf8" font-size="11" font-weight="700" font-family="ui-monospace, monospace">ESTADOS VISUALES DE LA INSIGNIA INLINE</text>

      <!-- Badge 1: Clean -->
      <g transform="translate(14, 34)">
        <rect x="0" y="0" width="180" height="30" rx="6" fill="#0a0e17" stroke="#202b3f" stroke-width="1"/>
        <circle cx="16" cy="15" r="4" fill="#10b981"/>
        <text x="28" y="19" fill="#e2e8f0" font-size="11" font-family="ui-monospace, monospace">main</text>
        <path d="M 154 15 L 157 18 L 165 10" fill="none" stroke="#10b981" stroke-width="1.5"/>
      </g>
      <text x="204" y="52" fill="#94a3b8" font-size="10">Árbol limpio (Checkmark esmeralda)</text>

      <!-- Badge 2: Dirty with counter -->
      <g transform="translate(14, 72)">
        <rect x="0" y="0" width="180" height="30" rx="6" fill="#0a0e17" stroke="#202b3f" stroke-width="1"/>
        <circle cx="16" cy="15" r="4" fill="#10b981"/>
        <text x="28" y="19" fill="#e2e8f0" font-size="11" font-family="ui-monospace, monospace">feature/hud</text>
        <rect x="138" y="7" width="34" height="16" rx="8" fill="#451a03" stroke="#f59e0b" stroke-width="1"/>
        <text x="148" y="19" fill="#fbbf24" font-size="9" font-weight="700" font-family="ui-monospace, monospace">● 3</text>
      </g>
      <text x="204" y="90" fill="#fbbf24" font-size="10">3 archivos con cambios sin commitear</text>

      <!-- Zero-git bootstrap box -->
      <g transform="translate(0, 126)">
        <rect x="0" y="0" width="430" height="154" rx="8" fill="#07090e" stroke="#f59e0b" stroke-width="1.2"/>
        <text x="14" y="22" fill="#fbbf24" font-size="11" font-weight="700" font-family="ui-monospace, monospace">DETECCIÓN ZERO-GIT &amp; BOOTSTRAP (git init)</text>
        <text x="14" y="42" fill="#e2e8f0" font-size="11">Si la carpeta no tiene .git, muestra "Sin Git" con popover asistido:</text>

        <rect x="14" y="52" width="402" height="42" rx="6" fill="#162035"/>
        <text x="24" y="70" fill="#94a3b8" font-size="10">"La carpeta activa no contiene un repositorio Git inicializado"</text>
        <text x="24" y="84" fill="#38bdf8" font-size="9" font-family="ui-monospace, monospace">postToHost({ command: 'initGitRepo', dir: currentDir })</text>

        <rect x="14" y="104" width="220" height="26" rx="6" fill="#06b6d4"/>
        <text x="26" y="121" fill="#07090e" font-size="10" font-weight="800">Inicializar Git aquí (git init)</text>
      </g>

      <!-- Zero network fetch guarantee -->
      <g transform="translate(0, 292)">
        <rect x="0" y="0" width="430" height="132" rx="8" fill="#0c1220" stroke="#202b3f" stroke-width="1"/>
        <text x="14" y="22" fill="#38bdf8" font-size="11" font-weight="700">INSPECCIÓN LOCAL DIRECTA (ZERO NETWORK FETCH)</text>
        <text x="14" y="42" fill="#94a3b8" font-size="11">El estado se lee directamente de las referencias locales y del</text>
        <text x="14" y="58" fill="#94a3b8" font-size="11">índice git en disco sin realizar comandos `git fetch` remotos.</text>
        <text x="14" y="74" fill="#34d399" font-size="10">Garantiza respuesta instantánea (&lt; 2ms) y funcionamiento 100% offline.</text>
        <text x="14" y="98" fill="#64748b" font-size="9" font-family="ui-monospace, monospace">Evita bloqueos de red o solicitudes de credenciales SSH/HTTP</text>
      </g>
    </g>
  </g>

  <!-- ================= PILLAR 2: POPOVER BRANCH SELECTOR & FILTER ================= -->
  <g transform="translate(565, 150)">
    <rect x="0" y="0" width="470" height="540" rx="14" fill="#0a0e17" stroke="#202b3f" stroke-width="1.4" filter="url(#shadow-drop)"/>
    <rect x="0" y="0" width="470" height="48" rx="14" fill="#0c1220"/>
    <path d="M 0 48 L 470 48" stroke="#202b3f" stroke-width="1.2"/>

    <!-- Pillar 2 Header -->
    <rect x="16" y="12" width="24" height="24" rx="6" fill="#06b6d4" fill-opacity="0.15" stroke="#06b6d4" stroke-width="1"/>
    <path d="M 22 24 L 34 24 M 28 18 L 34 24 L 28 30" fill="none" stroke="#22d3ee" stroke-width="1.5"/>
    <text x="48" y="28" fill="#f8fafc" font-size="14" font-weight="700">2. Menú Desplegable &amp; Filtro en Vivo</text>
    <rect x="350" y="14" width="104" height="20" rx="4" fill="#162035" stroke="#202b3f" stroke-width="1"/>
    <text x="368" y="28" fill="#22d3ee" font-size="10" font-family="ui-monospace, monospace">Popover</text>

    <!-- Content 2 -->
    <g transform="translate(20, 68)">
      <!-- Popover header card -->
      <rect x="0" y="0" width="430" height="96" rx="8" fill="#07090e" stroke="#202b3f" stroke-width="1"/>
      <text x="14" y="22" fill="#38bdf8" font-size="11" font-weight="700" font-family="ui-monospace, monospace">CABECERA DE ESTADO EN EL MENÚ</text>

      <g transform="translate(14, 32)">
        <text x="0" y="16" fill="#94a3b8" font-size="10" font-weight="700" font-family="ui-monospace, monospace">RAMA ACTIVA:</text>
        <rect x="110" y="2" width="160" height="22" rx="4" fill="#064e3b" stroke="#10b981" stroke-width="1"/>
        <text x="120" y="16" fill="#34d399" font-size="10" font-weight="700" font-family="ui-monospace, monospace">✓ main</text>
      </g>
      <text x="14" y="82" fill="#64748b" font-size="9" font-family="ui-monospace, monospace">Ordena rama activa al tope, luego lista alfabética</text>

      <!-- Search input & filter -->
      <g transform="translate(0, 110)">
        <rect x="0" y="0" width="430" height="114" rx="8" fill="#07090e" stroke="#06b6d4" stroke-width="1.2"/>
        <text x="14" y="22" fill="#22d3ee" font-size="11" font-weight="700" font-family="ui-monospace, monospace">FILTRADO REACTIVO DE RAMAS LOCALES</text>
        <text x="14" y="42" fill="#e2e8f0" font-size="11">Input con autofoco al abrir (`inputRef.current?.focus()`):</text>

        <rect x="14" y="52" width="402" height="26" rx="6" fill="#162035" stroke="#202b3f" stroke-width="1"/>
        <text x="24" y="69" fill="#94a3b8" font-size="10" font-family="ui-monospace, monospace">Filtrar ramas... (Ej: feat, fix, agent)</text>

        <text x="14" y="98" fill="#34d399" font-size="9" font-family="ui-monospace, monospace">visibleBranches = allBranches.filter(b => b.includes(filter))</text>
      </g>

      <!-- Squad worktrees list -->
      <g transform="translate(0, 238)">
        <rect x="0" y="0" width="430" height="186" rx="8" fill="#0c1220" stroke="#202b3f" stroke-width="1"/>
        <text x="14" y="22" fill="#38bdf8" font-size="11" font-weight="700">RAMAS DE EQUIPO / WORKTREES (squadBranches)</text>
        <text x="14" y="42" fill="#94a3b8" font-size="11">Distingue ramas normales de ramas aisladas de agentes:</text>

        <!-- Simulated squad items -->
        <g transform="translate(14, 52)">
          <rect x="0" y="0" width="402" height="34" rx="6" fill="#07090e" stroke="#202b3f" stroke-width="1"/>
          <text x="12" y="21" fill="#c084fc" font-size="10" font-family="ui-monospace, monospace">⑂ squad/architect-agent-01</text>
          <text x="320" y="21" fill="#38bdf8" font-size="10">Cambiar →</text>
        </g>

        <g transform="translate(14, 94)">
          <rect x="0" y="0" width="402" height="34" rx="6" fill="#07090e" stroke="#202b3f" stroke-width="1"/>
          <text x="12" y="21" fill="#c084fc" font-size="10" font-family="ui-monospace, monospace">⑂ squad/tester-agent-02</text>
          <text x="320" y="21" fill="#38bdf8" font-size="10">Cambiar →</text>
        </g>

        <text x="14" y="156" fill="#64748b" font-size="9">Permite a los desarrolladores inspeccionar el código de agentes concurrentes.</text>
      </g>
    </g>
  </g>

  <!-- ================= PILLAR 3: INLINE BRANCH CREATION & CHECKOUT ================= -->
  <g transform="translate(1082, 150)">
    <rect x="0" y="0" width="470" height="540" rx="14" fill="#0a0e17" stroke="#202b3f" stroke-width="1.4" filter="url(#shadow-drop)"/>
    <rect x="0" y="0" width="470" height="48" rx="14" fill="#0c1220"/>
    <path d="M 0 48 L 470 48" stroke="#202b3f" stroke-width="1.2"/>

    <!-- Pillar 3 Header -->
    <rect x="16" y="12" width="24" height="24" rx="6" fill="#10b981" fill-opacity="0.15" stroke="#10b981" stroke-width="1"/>
    <path d="M 22 24 L 26 28 L 34 20" fill="none" stroke="#34d399" stroke-width="1.5"/>
    <text x="48" y="28" fill="#f8fafc" font-size="14" font-weight="700">3. Checkout &amp; Creación Sanitizada</text>
    <rect x="350" y="14" width="104" height="20" rx="4" fill="#162035" stroke="#202b3f" stroke-width="1"/>
    <text x="362" y="28" fill="#34d399" font-size="10" font-family="ui-monospace, monospace">git checkout</text>

    <!-- Content 3 -->
    <g transform="translate(20, 68)">
      <!-- Checkout 1-click action -->
      <rect x="0" y="0" width="430" height="110" rx="8" fill="#07090e" stroke="#10b981" stroke-width="1"/>
      <text x="14" y="22" fill="#34d399" font-size="11" font-weight="700" font-family="ui-monospace, monospace">CONMUTACIÓN INMEDIATA (CHECKOUT EN 1-CLIC)</text>
      <text x="14" y="42" fill="#e2e8f0" font-size="11">Clic en cualquier fila conmuta y cierra el popover automáticamente:</text>
      <rect x="14" y="52" width="402" height="44" rx="4" fill="#162035"/>
      <text x="22" y="69" fill="#94a3b8" font-size="10" font-family="ui-monospace, monospace">onCheckout ? onCheckout(target, currentDir)</text>
      <text x="22" y="85" fill="#34d399" font-size="10" font-family="ui-monospace, monospace">: postToHost({ command: 'checkoutBranch', branch: target })</text>

      <!-- Inline branch creation form -->
      <g transform="translate(0, 126)">
        <rect x="0" y="0" width="430" height="154" rx="8" fill="#07090e" stroke="#06b6d4" stroke-width="1.2"/>
        <text x="14" y="22" fill="#22d3ee" font-size="11" font-weight="700" font-family="ui-monospace, monospace">CREACIÓN DE NUEVA RAMA SANITIZADA</text>
        <text x="14" y="42" fill="#e2e8f0" font-size="11">Formulario integrado sin necesidad de terminal externa:</text>

        <rect x="14" y="52" width="402" height="38" rx="6" fill="#162035"/>
        <text x="22" y="69" fill="#22d3ee" font-size="10" font-family="ui-monospace, monospace">safeName = newBranchName.trim().replace(/\s+/g, '-')</text>
        <text x="22" y="82" fill="#64748b" font-size="9" font-family="ui-monospace, monospace">Auto-slugifica espacios en guiones para cumplir estándar git</text>

        <!-- Form simulation -->
        <g transform="translate(14, 100)">
          <rect x="0" y="0" width="280" height="34" rx="6" fill="#07090e" stroke="#06b6d4" stroke-width="1"/>
          <text x="10" y="21" fill="#e2e8f0" font-size="11" font-family="ui-monospace, monospace">feature/nueva-funcionalidad</text>

          <rect x="290" y="0" width="112" height="34" rx="6" fill="#06b6d4"/>
          <text x="328" y="21" fill="#07090e" font-size="11" font-weight="800">Crear</text>
        </g>
      </g>

      <!-- External Manager link -->
      <g transform="translate(0, 296)">
        <rect x="0" y="0" width="430" height="132" rx="8" fill="#0c1220" stroke="#202b3f" stroke-width="1"/>
        <text x="14" y="22" fill="#38bdf8" font-size="11" font-weight="700">ENLACE AL GESTOR MODAL AVANZADO</text>
        <text x="14" y="42" fill="#94a3b8" font-size="11">Pie del popover ofrece acceso directo a `BranchManagerModal`:</text>
        <rect x="14" y="54" width="402" height="34" rx="4" fill="#162035"/>
        <text x="22" y="69" fill="#38bdf8" font-size="10" font-family="ui-monospace, monospace">onOpenManager(currentDir) -> Abre modal completo</text>
        <text x="22" y="81" fill="#64748b" font-size="9" font-family="ui-monospace, monospace">Con borrado seguro, diferencias de commits y logs de cambios</text>
        <text x="14" y="114" fill="#64748b" font-size="9">Integración perfecta entre micro-control inline y modal avanzado.</text>
      </g>
    </g>
  </g>

  <!-- ================= BOTTOM TELEMETRY / ARCHITECTURE SUMMARY BAR ================= -->
  <g transform="translate(48, 712)">
    <rect x="0" y="0" width="1504" height="152" rx="12" fill="#0a0e17" stroke="#202b3f" stroke-width="1.2" filter="url(#shadow-drop)"/>

    <g transform="translate(24, 20)">
      <text x="0" y="18" fill="#f8fafc" font-size="14" font-weight="700" letter-spacing="0.5">RESUMEN DE ELEVACIÓN &amp; SISTEMA DE CONTROL GIT INLINE</text>

      <g transform="translate(0, 36)">
        <!-- Layer 1 -->
        <rect x="0" y="0" width="280" height="66" rx="8" fill="#07090e" stroke="#202b3f" stroke-width="1"/>
        <text x="14" y="22" fill="#38bdf8" font-size="11" font-weight="700">CAPA 1: #07090e</text>
        <text x="14" y="40" fill="#94a3b8" font-size="10">Active Info Box &amp; Branch Filter Input</text>
        <text x="14" y="54" fill="#64748b" font-size="9" font-family="ui-monospace, monospace">Base no reflectiva para inputs</text>

        <!-- Layer 2 -->
        <rect x="296" y="0" width="280" height="66" rx="8" fill="#0a0e17" stroke="#202b3f" stroke-width="1"/>
        <text x="14" y="22" fill="#38bdf8" font-size="11" font-weight="700">CAPA 2: #0a0e17</text>
        <text x="14" y="40" fill="#94a3b8" font-size="10">Popover Shell &amp; Trigger Badge</text>
        <text x="14" y="54" fill="#64748b" font-size="9" font-family="ui-monospace, monospace">Shadow-2xl shadow-black/80</text>

        <!-- Layer 3 -->
        <rect x="592" y="0" width="280" height="66" rx="8" fill="#0c1220" stroke="#202b3f" stroke-width="1"/>
        <text x="14" y="22" fill="#38bdf8" font-size="11" font-weight="700">CAPA 3: #0c1220</text>
        <text x="14" y="40" fill="#94a3b8" font-size="10">New Branch Button &amp; Action Chips</text>
        <text x="14" y="54" fill="#64748b" font-size="9" font-family="ui-monospace, monospace">Superficie interactiva elevada</text>

        <!-- Layer 4 -->
        <rect x="888" y="0" width="280" height="66" rx="8" fill="#162035" stroke="#202b3f" stroke-width="1"/>
        <text x="14" y="22" fill="#38bdf8" font-size="11" font-weight="700">CAPA 4: #162035</text>
        <text x="14" y="40" fill="#94a3b8" font-size="10">Branch Row Hover States &amp; Focus Ring</text>
        <text x="14" y="54" fill="#64748b" font-size="9" font-family="ui-monospace, monospace">Micro-interacción fluida a 60 FPS</text>

        <!-- Layer 5 -->
        <rect x="1184" y="0" width="272" height="66" rx="8" fill="#202b3f" stroke="#06b6d4" stroke-width="1"/>
        <text x="14" y="22" fill="#22d3ee" font-size="11" font-weight="700">CAPA 5: #202b3f</text>
        <text x="14" y="40" fill="#e2e8f0" font-size="10">Bordes estructurales &amp; Divisores</text>
        <text x="14" y="54" fill="#94a3b8" font-size="9" font-family="ui-monospace, monospace">Contrast ratio &gt; 7:1 WCAG AAA</text>
      </g>
    </g>
  </g>
</svg>
