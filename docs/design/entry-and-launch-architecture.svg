<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#07090e" />
      <stop offset="100%" stop-color="#0c111e" />
    </linearGradient>

    <linearGradient id="card-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="100%" stop-color="#0e1526" />
    </linearGradient>

    <linearGradient id="cyan-indigo" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>

    <filter id="soft-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000" flood-opacity="0.6" />
    </filter>

    <filter id="cyan-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .font-mono { font-family: 'JetBrains Mono', 'Fira Code', 'Courier New', monospace; }
    .font-sans { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    .title { font-size: 20px; font-weight: 800; letter-spacing: 1.5px; fill: #f8fafc; }
    .sub { font-size: 11px; font-weight: 600; letter-spacing: 1px; fill: #94a3b8; }
    .label { font-size: 11px; fill: #cbd5e1; }
  </style>

  <!-- Background Base -->
  <rect width="1200" height="700" fill="url(#bg-grad)" />

  <!-- Subtle Cyber Grid -->
  <g stroke="#202b3f" stroke-width="0.5" stroke-opacity="0.35">
    <line x1="0" y1="80" x2="1200" y2="80" />
    <line x1="0" y1="360" x2="1200" y2="360" />
    <line x1="300" y1="0" x2="300" y2="700" />
    <line x1="600" y1="0" x2="600" y2="700" />
    <line x1="900" y1="0" x2="900" y2="700" />
  </g>

  <!-- Header Block -->
  <g transform="translate(60, 40)">
    <rect x="0" y="0" width="4" height="32" fill="#06b6d4" rx="2" />
    <text x="16" y="18" class="font-sans title">AGENT-HUB // ENTRY POINT &amp; LAUNCH ARCHITECTURE</text>
    <text x="16" y="32" class="font-mono sub">STANDALONE WEBVIEW · ELECTRON RUNTIME · ZERO-FLASH TACTICAL BOOTSTRAP</text>
  </g>

  <!-- Central Entry Preview Container -->
  <g transform="translate(60, 95)" filter="url(#soft-shadow)">
    <!-- Browser/Window Mockup Frame -->
    <rect x="0" y="0" width="1080" height="230" rx="12" fill="#0a0e17" stroke="#202b3f" stroke-width="1.5" />

    <!-- Window Top Chrome -->
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="1080" height="38" rx="12" fill="#070b13" />
      <rect x="0" y="26" width="1080" height="12" fill="#070b13" />
      <line x1="0" y1="38" x2="1080" y2="38" stroke="#202b3f" stroke-width="1" />

      <!-- Window dots -->
      <circle cx="20" cy="19" r="5" fill="#f43f5e" />
      <circle cx="36" cy="19" r="5" fill="#f59e0b" />
      <circle cx="52" cy="19" r="5" fill="#10b981" />

      <!-- URL Address Pill -->
      <g transform="translate(340, 7)">
        <rect x="0" y="0" width="400" height="24" rx="6" fill="#0e1424" stroke="#1b253b" stroke-width="1" />
        <circle cx="14" cy="12" r="3" fill="#10b981" />
        <text x="24" y="16" class="font-mono" font-size="10" fill="#93c5fd">http://localhost:3710 // AgentHub Tactical HUD</text>
      </g>
    </g>

    <!-- Inside Content: Favicon, Title and Zero-Flash Stage -->
    <g transform="translate(40, 60)">
      <!-- Vector Brand Icon -->
      <g transform="translate(0, 10)">
        <rect x="0" y="0" width="100" height="100" rx="22" fill="#07090e" stroke="#06b6d4" stroke-width="2" filter="url(#cyan-glow)" />
        <circle cx="50" cy="24" r="7" fill="#38bdf8" />
        <circle cx="26" cy="65" r="7" fill="#06b6d4" />
        <circle cx="74" cy="65" r="7" fill="#c084fc" />
        <path d="M50 26 L28 65 M50 26 L72 65 M36 48 L64 48" stroke="#06b6d4" stroke-width="6" stroke-linecap="round" />
        <polygon points="50,40 56,43 56,50 50,53 44,50 44,43" fill="#ffffff" />
      </g>

      <!-- Description Block -->
      <g transform="translate(130, 20)">
        <text x="0" y="16" class="font-sans" font-size="16" font-weight="800" fill="#f8fafc">
          AgentHub — Tactical AI HUD &amp; Multi-Agent Orchestrator
        </text>
        <text x="0" y="38" class="font-mono" font-size="11" fill="#06b6d4">
          &lt;meta name="theme-color" content="#07090e" /&gt; · &lt;body class="bg-[#07090e] text-[#f1f5f9]"&gt;
        </text>
        <text x="0" y="60" class="font-sans label" fill="#94a3b8">
          Arranque visual sin parpadeo blanco (Zero White Flash). El fondo `#07090e` se declara directamente
        </text>
        <text x="0" y="78" class="font-sans label" fill="#94a3b8">
          en el DOM raíz de HTML, en los parámetros de Electron y en la respuesta HTTP estática de Node.
        </text>
      </g>
    </g>
  </g>

  <!-- 3 Pillar Breakdown Cards -->
  <g transform="translate(60, 350)" filter="url(#soft-shadow)">

    <!-- Card 1: Zero White Flash Guarantee -->
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="340" height="270" rx="10" fill="url(#card-grad)" stroke="#202b3f" stroke-width="1.2" />
      <text x="16" y="26" class="font-mono" font-size="11" font-weight="700" fill="#06b6d4">01 // ZERO-FLASH BOOTSTRAP</text>
      
      <g transform="translate(16, 45)">
        <rect x="0" y="0" width="308" height="38" rx="6" fill="#060a12" stroke="#202b3f" stroke-width="1" />
        <text x="14" y="23" class="font-mono" font-size="9" fill="#38bdf8">backgroundColor: '#07090e' (Electron + DOM)</text>
      </g>

      <text x="16" y="110" class="font-sans label" fill="#94a3b8">
        <tspan x="16" dy="0">• <tspan fill="#f8fafc" font-weight="600">Unified Background Token:</tspan></tspan>
        <tspan x="26" dy="16">Evita el destello de carga blanca entre</tspan>
        <tspan x="26" dy="16">el inicio de ventana y el render de React.</tspan>

        <tspan x="16" dy="24">• <tspan fill="#f8fafc" font-weight="600">Meta Theme Color:</tspan></tspan>
        <tspan x="26" dy="16">Sincroniza la barra de estado en navegadores</tspan>
        <tspan x="26" dy="16">móviles y PWAs de escritorio.</tspan>
      </text>
    </g>

    <!-- Card 2: Native Vector Favicon -->
    <g transform="translate(370, 0)">
      <rect x="0" y="0" width="340" height="270" rx="10" fill="url(#card-grad)" stroke="#202b3f" stroke-width="1.2" />
      <text x="16" y="26" class="font-mono" font-size="11" font-weight="700" fill="#a855f7">02 // INLINE VECTOR FAVICON</text>

      <g transform="translate(16, 45)">
        <rect x="0" y="0" width="308" height="38" rx="6" fill="#060a12" stroke="#202b3f" stroke-width="1" />
        <circle cx="20" cy="19" r="6" fill="#06b6d4" />
        <text x="36" y="23" class="font-mono" font-size="9" fill="#c084fc">SVG Data URI · Zero HTTP Roundtrips</text>
      </g>

      <text x="16" y="110" class="font-sans label" fill="#94a3b8">
        <tspan x="16" dy="0">• <tspan fill="#f8fafc" font-weight="600">Embedded Crisp Glyphs:</tspan></tspan>
        <tspan x="26" dy="16">Favicon vectorizado 512×512 incrustado</tspan>
        <tspan x="26" dy="16">en base64/URI para visualización nítida.</tspan>

        <tspan x="16" dy="24">• <tspan fill="#f8fafc" font-weight="600">Tactical Cyan Node Nodes:</tspan></tspan>
        <tspan x="26" dy="16">Geometría de orquestación de agentes</tspan>
        <tspan x="26" dy="16">con nodo central de cómputo.</tspan>
      </text>
    </g>

    <!-- Card 3: Multi-Platform Uniformity -->
    <g transform="translate(740, 0)">
      <rect x="0" y="0" width="340" height="270" rx="10" fill="url(#card-grad)" stroke="#202b3f" stroke-width="1.2" />
      <text x="16" y="26" class="font-mono" font-size="11" font-weight="700" fill="#10b981">03 // MULTI-PLATFORM RUNTIMES</text>

      <g transform="translate(16, 45)">
        <rect x="0" y="0" width="308" height="38" rx="6" fill="#060a12" stroke="#202b3f" stroke-width="1" />
        <text x="14" y="23" class="font-mono" font-size="9" fill="#6ee7b7">Electron Desktop · Standalone HTTP · VS Code</text>
      </g>

      <text x="16" y="110" class="font-sans label" fill="#94a3b8">
        <tspan x="16" dy="0">• <tspan fill="#f8fafc" font-weight="600">100% Identidad Homogénea:</tspan></tspan>
        <tspan x="26" dy="16">La misma paleta Tactical HUD y micro-física</tspan>
        <tspan x="26" dy="16">en Electron, navegador web o panel VS Code.</tspan>

        <tspan x="16" dy="24">• <tspan fill="#f8fafc" font-weight="600">Zero Regressions Pipeline:</tspan></tspan>
        <tspan x="26" dy="16">Tests de flujo aprobados (11/11)</tspan>
        <tspan x="26" dy="16">y bundle optimizado de 852 kB.</tspan>
      </text>
    </g>

  </g>

  <!-- Footer Info Line -->
  <g transform="translate(60, 660)">
    <line x1="0" y1="0" x2="1080" y2="0" stroke="#202b3f" stroke-width="1" />
    <text x="0" y="20" class="font-mono" font-size="10" fill="#64748b">AGENT-HUB ENTRY ARCHITECTURE // ITERATION 25 (LOOP 3 - ITER 7) // LAUNCH HOMOGENEITY</text>
    <text x="1080" y="20" text-anchor="end" class="font-mono" font-size="10" fill="#06b6d4">PALETTE: #07090e · #0a0e17 · #202b3f · #06b6d4</text>
  </g>
</svg>