      <text x="16" y="24" fill="#94a3b8" class="mono-font" font-size="10" font-weight="600" letter-spacing="0.05em">FIRST-RUN INITIALIZATION PIPELINE</text>

      <!-- Step 1 -->
      <g transform="translate(18, 38)">
        <rect x="0" y="0" width="180" height="56" rx="8" fill="#0c1220" stroke="#06b6d4" stroke-width="1.2"/>
        <text x="12" y="24" fill="#38bdf8" class="body-font" font-size="11" font-weight="700">1. Workspace Picker</text>
        <text x="12" y="42" fill="#64748b" class="mono-font" font-size="9">Select Safe CWD (Anti-System32)</text>
      </g>

      <path d="M 204 66 L 228 66" stroke="#06b6d4" stroke-width="1.8" stroke-dasharray="3,2"/>
      <polygon points="228,63 234,66 228,69" fill="#06b6d4"/>

      <!-- Step 2 -->
      <g transform="translate(240, 38)">
        <rect x="0" y="0" width="180" height="56" rx="8" fill="#0c1220" stroke="#8b5cf6" stroke-width="1.2"/>
        <text x="12" y="24" fill="#c084fc" class="body-font" font-size="11" font-weight="700">2. Squad Dispatch</text>
        <text x="12" y="42" fill="#64748b" class="mono-font" font-size="9">Select Template or Single Chat</text>
      </g>

      <path d="M 426 66 L 450 66" stroke="#10b981" stroke-width="1.8" stroke-dasharray="3,2"/>
      <polygon points="450,63 456,66 450,69" fill="#10b981"/>

      <!-- Step 3 -->
      <g transform="translate(462, 38)">
        <rect x="0" y="0" width="195" height="56" rx="8" fill="#065f46" fill-opacity="0.3" stroke="#10b981" stroke-width="1.2"/>
        <text x="12" y="24" fill="#34d399" class="body-font" font-size="11" font-weight="700">3. Active Execution</text>
        <text x="12" y="42" fill="#a7f3d0" class="mono-font" font-size="9">Chat Stream &amp; File Worktree</text>
      </g>
    </g>

    <!-- Recommended Task Quick Starters -->
    <g transform="translate(24, 205)">
      <text x="0" y="0" fill="#94a3b8" class="mono-font" font-size="11" font-weight="600" letter-spacing="0.05em">RECOMMENDED PROMPT ACCELERATORS</text>

      <g transform="translate(0, 15)">
        <rect x="0" y="0" width="677" height="66" rx="10" fill="#0a0e17" stroke="#202b3f"/>
        <rect x="14" y="14" width="70" height="20" rx="4" fill="#162035" stroke="#06b6d4" stroke-width="0.8"/>
        <text x="20" y="28" fill="#38bdf8" class="mono-font" font-size="9">FRONTEND</text>
        <text x="96" y="28" fill="#f8fafc" class="body-font" font-size="12" font-weight="600">Crear nuevo componente React con Tailwind y TypeScript</text>
        <text x="14" y="50" fill="#94a3b8" class="mono-font" font-size="10">Aplica tokens tácticos, soporte de tema oscuro y tipografía monoespaciada.</text>
      </g>

      <g transform="translate(0, 90)">
        <rect x="0" y="0" width="677" height="66" rx="10" fill="#0a0e17" stroke="#202b3f"/>
        <rect x="14" y="14" width="60" height="20" rx="4" fill="#162035" stroke="#10b981" stroke-width="0.8"/>
        <text x="20" y="28" fill="#34d399" class="mono-font" font-size="9">TESTING</text>
        <text x="86" y="28" fill="#f8fafc" class="body-font" font-size="12" font-weight="600">Escribir pruebas unitarias TDD con node --test</text>
        <text x="14" y="50" fill="#94a3b8" class="mono-font" font-size="10">Verifica flujos, manejo de errores y compatibilidad de plataforma sin latencia.</text>
      </g>

      <g transform="translate(0, 165)">
        <rect x="0" y="0" width="677" height="66" rx="10" fill="#0a0e17" stroke="#202b3f"/>
        <rect x="14" y="14" width="70" height="20" rx="4" fill="#162035" stroke="#f59e0b" stroke-width="0.8"/>
        <text x="20" y="28" fill="#fbbf24" class="mono-font" font-size="9">SECURITY</text>
        <text x="96" y="28" fill="#f8fafc" class="body-font" font-size="12" font-weight="600">Auditar permisos de CWD y variables de entorno</text>
        <text x="14" y="50" fill="#94a3b8" class="mono-font" font-size="10">Garantiza aislamiento seguro en el workspace y máscara de credenciales de API.</text>
      </g>
    </g>
  </g>

  <!-- ==================== BOTTOM ROW: SPEC CARD DIRECTORY SUMMARY ==================== -->
  <g transform="translate(60, 695)">
    <rect x="0" y="0" width="1480" height="295" rx="16" fill="url(#cardGrad)" stroke="#202b3f" stroke-width="1.2"/>

    <g transform="translate(24, 24)">
      <text x="0" y="0" fill="#f8fafc" class="title-font" font-size="16">Global Tactical HUD Milestone Metrics (Iteración 23)</text>
      <text x="0" y="18" fill="#64748b" class="mono-font" font-size="11">System verification metrics and total production stability overview</text>

      <!-- 4 Highlight KPI Cards -->
      <g transform="translate(0, 36)">
        <!-- Card 1 -->
        <g transform="translate(0, 0)">
          <rect x="0" y="0" width="345" height="150" rx="10" fill="#0a0e17" stroke="#202b3f"/>
          <text x="20" y="32" fill="#64748b" class="mono-font" font-size="11" font-weight="700">SPEC CARDS</text>
          <text x="20" y="70" fill="#38bdf8" class="title-font" font-size="32">56</text>
          <text x="20" y="100" fill="#94a3b8" class="body-font" font-size="11">Planos vectoriales maestros en SVG cubriendo 100% de subsistemas.</text>
          <text x="20" y="130" fill="#10b981" class="mono-font" font-size="10">● Catálogo Completo</text>
        </g>

        <!-- Card 2 -->
        <g transform="translate(365, 0)">
          <rect x="0" y="0" width="345" height="150" rx="10" fill="#0a0e17" stroke="#202b3f"/>
          <text x="20" y="32" fill="#64748b" class="mono-font" font-size="11" font-weight="700">SUITES DE FLUJOS</text>
          <text x="20" y="70" fill="#34d399" class="title-font" font-size="32">14 / 14</text>
          <text x="20" y="100" fill="#94a3b8" class="body-font" font-size="11">100% pruebas unitarias superadas en 54.1ms con mock shims.</text>
          <text x="20" y="130" fill="#10b981" class="mono-font" font-size="10">● Zero Regresiones</text>
        </g>

        <!-- Card 3 -->
        <g transform="translate(730, 0)">
          <rect x="0" y="0" width="345" height="150" rx="10" fill="#0a0e17" stroke="#202b3f"/>
          <text x="20" y="32" fill="#64748b" class="mono-font" font-size="11" font-weight="700">PUREZA CROMÁTICA</text>
          <text x="20" y="70" fill="#c084fc" class="title-font" font-size="32">0 RESIDUAL</text>
          <text x="20" y="100" fill="#94a3b8" class="body-font" font-size="11">Erradicación absoluta de tokens antiguos en código y diagramas.</text>
          <text x="20" y="130" fill="#10b981" class="mono-font" font-size="10">● 5 Capas Puras</text>
        </g>

        <!-- Card 4 -->
        <g transform="translate(1095, 0)">
          <rect x="0" y="0" width="335" height="150" rx="10" fill="#0a0e17" stroke="#202b3f"/>
          <text x="20" y="32" fill="#64748b" class="mono-font" font-size="11" font-weight="700">ACCESIBILIDAD</text>
          <text x="20" y="70" fill="#fbbf24" class="title-font" font-size="32">AAA 100%</text>
          <text x="20" y="100" fill="#94a3b8" class="body-font" font-size="11">Ratios &gt; 9:1, trampas de foco APG cíclicas y navegación teclado.</text>
          <text x="20" y="130" fill="#10b981" class="mono-font" font-size="10">● WCAG 2.2 Certificado</text>
        </g>
      </g>
    </g>
  </g>

  <!-- Footer -->
  <g transform="translate(60, 1015)">
    <text x="0" y="0" fill="#64748b" class="mono-font" font-size="10">AGENTHUB TACTICAL HUD ARCHITECTURE · SPEC CARD #56 · ONBOARDING &amp; EMPTY STATE</text>
    <text x="1480" y="0" text-anchor="end" fill="#64748b" class="mono-font" font-size="10">STANDARDS: WCAG 2.2 AAA · W3C APG · STRICT 5-LAYER TOKEN HARMONY</text>
  </g>
</svg>
