<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <radialGradient id="hudBgGlow" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#141c2e" stop-opacity="0.8" />
      <stop offset="60%" stop-color="#0a0e17" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#07090e" stop-opacity="1" />
    </radialGradient>
    <radialGradient id="coreGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.25" />
      <stop offset="70%" stop-color="#6366f1" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#0e131f" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="orbitAmber" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <linearGradient id="orbitCyan" x1="0%" y1="0%" x2="100%" y2="100%">
