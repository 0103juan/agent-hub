      <rect x="8" y="8" width="70" height="18" rx="4" fill="#f59e0b" fill-opacity="0.15" stroke="#f59e0b" stroke-width="0.8" />
      <text x="14" y="20" fill="#fcd34d" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="700">DISEÑADOR</text>
