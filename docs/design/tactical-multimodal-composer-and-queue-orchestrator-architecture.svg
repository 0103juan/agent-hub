<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1050" width="1600" height="1050">
  <defs>
    <!-- Background Gradients -->
    <radialGradient id="bgGlow" cx="50%" cy="20%" r="75%">
      <stop offset="0%" stop-color="#0e172a" stop-opacity="0.85"/>
      <stop offset="55%" stop-color="#07090e" stop-opacity="0.98"/>
      <stop offset="100%" stop-color="#040608" stop-opacity="1"/>
    </radialGradient>
    <radialGradient id="cyanCenter" cx="50%" cy="40%" r="35%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0"/>
    </radialGradient>

    <!-- Card Backgrounds & Borders -->
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c1220"/>
      <stop offset="100%" stop-color="#0a0e17"/>
    </linearGradient>
    <linearGradient id="cyanBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#202b3f" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#0891b2" stop-opacity="0.3"/>
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="tacticalGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#162035" stroke-width="0.75" stroke-opacity="0.45"/>
      <circle cx="0" cy="0" r="1" fill="#06b6d4" fill-opacity="0.3"/>
    </pattern>
  </defs>

  <style>
    .title-font { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-weight: 800; }
    .mono-font { font-family: 'JetBrains Mono', 'Fira Code', Menlo, Monaco, Consolas, monospace; }
    .body-font { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
  </style>

  <!-- Deep Obsidian Void Canvas -->
  <rect width="1600" height="1050" fill="#07090e"/>
  <rect width="1600" height="1050" fill="url(#bgGlow)"/>
  <rect width="1600" height="1050" fill="url(#tacticalGrid)"/>
  <rect width="1600" height="1050" fill="url(#cyanCenter)" pointer-events="none"/>

  <!-- Top Tactical Nav Header -->
  <g transform="translate(60, 45)">
    <rect x="0" y="0" width="1480" height="74" rx="14" fill="#0a0e17" stroke="#202b3f" stroke-width="1.2"/>
    
    <rect x="18" y="16" width="42" height="42" rx="10" fill="#0c1220" stroke="#06b6d4" stroke-width="1.5"/>
    <path d="M 30 38 L 48 38 M 39 25 L 39 41 M 44 28 L 48 32 M 34 28 L 30 32" stroke="#06b6d4" stroke-width="2" stroke-linecap="round"/>
    <circle cx="39" cy="27" r="2.5" fill="#14b8a6"/>

    <text x="74" y="36" fill="#f8fafc" class="title-font" font-size="19" letter-spacing="-0.02em">AGENTHUB TACTICAL HUD <tspan fill="#06b6d4">::</tspan> SPEC CARD #57</text>
    <text x="74" y="52" fill="#94a3b8" class="mono-font" font-size="11" letter-spacing="0.05em">MULTIMODAL COMPOSER, VOICE DICTATION &amp; QUEUE ORCHESTRATOR ARCHITECTURE (v2)</text>

    <!-- Header Badges -->
    <g transform="translate(1010, 20)">
      <rect x="0" y="0" width="135" height="34" rx="8" fill="#162035" stroke="#202b3f" stroke-width="1"/>
      <circle cx="16" cy="17" r="4" fill="#10b981"/>
      <text x="28" y="22" fill="#34d399" class="mono-font" font-size="11" font-weight="600">VOICE: READY</text>

      <rect x="145" y="0" width="145" height="34" rx="8" fill="#162035" stroke="#202b3f" stroke-width="1"/>
      <text x="14" y="22" fill="#38bdf8" class="mono-font" font-size="11" font-weight="600">QUEUE PIPELINE</text>

      <rect x="300" y="0" width="165" height="34" rx="8" fill="#162035" stroke="#06b6d4" stroke-width="1.2"/>
      <circle cx="315" cy="17" r="4" fill="#06b6d4"/>
      <text x="328" y="22" fill="#38bdf8" class="mono-font" font-size="11" font-weight="600">AUTO-EXPAND TXT</text>
    </g>
  </g>

  <!-- ==================== LEFT COLUMN: MULTIMODAL INGESTION ENGINE ==================== -->
  <g transform="translate(60, 145)">
    <rect x="0" y="0" width="725" height="530" rx="16" fill="url(#cardGrad)" stroke="url(#cyanBorder)" stroke-width="1.5"/>

    <g transform="translate(24, 24)">
      <rect x="0" y="0" width="34" height="34" rx="8" fill="#06b6d4" fill-opacity="0.12" stroke="#06b6d4" stroke-width="1.2"/>
      <path d="M 12 17 L 22 17 M 17 12 L 17 22" stroke="#06b6d4" stroke-width="2" stroke-linecap="round"/>
      <text x="46" y="20" fill="#f8fafc" class="title-font" font-size="16">Multimodal Context Ingestion Pipeline</text>
      <text x="46" y="34" fill="#64748b" class="mono-font" font-size="11">Active Editor · Project Files · Git Diffs · Diagnostic Problems · Audio WebM</text>
    </g>

    <!-- Ingestion Channels Matrix -->
    <g transform="translate(24, 75)">
      <!-- Channel 1: Editor Context -->
      <g transform="translate(0, 0)">
        <rect x="0" y="0" width="328" height="85" rx="10" fill="#0a0e17" stroke="#202b3f"/>
        <text x="16" y="24" fill="#f8fafc" class="body-font" font-size="12" font-weight="700">1. Editor Context (Selection)</text>
        <text x="16" y="44" fill="#94a3b8" class="mono-font" font-size="10">attachActiveEditor()</text>
        <text x="16" y="66" fill="#38bdf8" class="mono-font" font-size="10">Inyecta archivo activo y rango de líneas actual</text>
        <circle cx="308" cy="22" r="4" fill="#10b981"/>
      </g>

      <!-- Channel 2: Git Diff Context -->
      <g transform="translate(348, 0)">
        <rect x="0" y="0" width="328" height="85" rx="10" fill="#0a0e17" stroke="#202b3f"/>
        <text x="16" y="24" fill="#f8fafc" class="body-font" font-size="12" font-weight="700">2. Git Diffs &amp; Commits</text>
        <text x="16" y="44" fill="#94a3b8" class="mono-font" font-size="10">attachGit() &amp; generateCommit()</text>
        <text x="16" y="66" fill="#10b981" class="mono-font" font-size="10">Genera Conventional Commits desde el diff</text>
        <circle cx="308" cy="22" r="4" fill="#10b981"/>
      </g>

      <!-- Channel 3: Diagnostic Problems -->
      <g transform="translate(0, 100)">
        <rect x="0" y="0" width="328" height="85" rx="10" fill="#0a0e17" stroke="#202b3f"/>
        <text x="16" y="24" fill="#f8fafc" class="body-font" font-size="12" font-weight="700">3. Diagnostic Problems</text>
        <text x="16" y="44" fill="#94a3b8" class="mono-font" font-size="10">attachProblems()</text>
        <text x="16" y="66" fill="#fbbf24" class="mono-font" font-size="10">Captura errores y advertencias de TypeScript</text>
        <circle cx="308" cy="22" r="4" fill="#f59e0b"/>
      </g>

      <!-- Channel 4: Long-Paste Protection -->
      <g transform="translate(348, 100)">
        <rect x="0" y="0" width="328" height="85" rx="10" fill="#0a0e17" stroke="#202b3f"/>
        <text x="16" y="24" fill="#f8fafc" class="body-font" font-size="12" font-weight="700">4. Long Paste Protection</text>
        <text x="16" y="44" fill="#94a3b8" class="mono-font" font-size="10">&gt; 12,000 chars ➔ Auto File</text>
        <text x="16" y="66" fill="#c084fc" class="mono-font" font-size="10">Convierte texto pegado masivo en archivo .txt</text>
        <circle cx="308" cy="22" r="4" fill="#8b5cf6"/>
      </g>
    </g>

    <!-- Voice Recording Engine Visualizer -->
    <g transform="translate(24, 285)">
      <rect x="0" y="0" width="677" height="145" rx="12" fill="#0a0e17" stroke="#202b3f"/>
      <g transform="translate(16, 16)">
        <text x="0" y="12" fill="#f43f5e" class="mono-font" font-size="11" font-weight="700">● LIVE VOICE DICTATION &amp; AUDIO ATTACHMENT ENGINE</text>
        
        <!-- Live Waveform Simulator -->
        <g transform="translate(0, 30)">
          <rect x="0" y="0" width="645" height="42" rx="8" fill="#4c0519" fill-opacity="0.3" stroke="#f43f5e" stroke-width="0.8"/>
          <circle cx="20" cy="21" r="5" fill="#f43f5e"/>
          <text x="35" y="25" fill="#fca5a5" class="mono-font" font-size="11" font-weight="700">Grabando voz (0:14) · Ctrl+Shift+D</text>
          
          <!-- Waveform lines -->
          <g transform="translate(360, 21)" stroke="#f43f5e" stroke-width="2" stroke-linecap="round">
            <line x1="0" y1="-8" x2="0" y2="8"/>
            <line x1="8" y1="-14" x2="8" y2="14"/>
            <line x1="16" y1="-5" x2="16" y2="5"/>
            <line x1="24" y1="-12" x2="24" y2="12"/>
            <line x1="32" y1="-16" x2="32" y2="16"/>
            <line x1="40" y1="-10" x2="40" y2="10"/>
            <line x1="48" y1="-4" x2="48" y2="4"/>
          </g>

          <text x="540" y="25" fill="#34d399" class="mono-font" font-size="10">Web Speech API</text>
        </g>

        <text x="0" y="98" fill="#94a3b8" class="mono-font" font-size="10">Dual Pipeline: Transcribe con Web Speech API en vivo. Si offline, convierte a audio/webm multimodal.</text>
      </g>
    </g>

    <!-- Token Estimation Bar -->
    <g transform="translate(24, 455)">
      <rect x="0" y="0" width="677" height="50" rx="8" fill="#0a0e17" stroke="#202b3f"/>
      <g transform="translate(16, 20)">
        <text x="0" y="12" fill="#cbd5e1" class="mono-font" font-size="11">Token Predictor: <tspan fill="#38bdf8">~1,420 tokens</tspan> (chars / 4) · Umbral alerta: &gt; 8,000 tk</text>
        <text x="560" y="12" fill="#10b981" class="mono-font" font-size="10">BUDGET SAFE</text>
      </g>
    </g>
  </g>

  <!-- ==================== RIGHT COLUMN: QUEUE ORCHESTRATOR & SQUAD DRAWER ==================== -->
  <g transform="translate(815, 145)">
    <rect x="0" y="0" width="725" height="530" rx="16" fill="url(#cardGrad)" stroke="#202b3f" stroke-width="1.5"/>

    <g transform="translate(24, 24)">
      <rect x="0" y="0" width="34" height="34" rx="8" fill="#8b5cf6" fill-opacity="0.12" stroke="#8b5cf6" stroke-width="1.2"/>
      <circle cx="17" cy="17" r="7" fill="none" stroke="#8b5cf6" stroke-width="1.6"/>
      <text x="46" y="20" fill="#f8fafc" class="title-font" font-size="16">Queue Pipeline &amp; Squad Methodology Drawer</text>
      <text x="46" y="34" fill="#64748b" class="mono-font" font-size="11">Asynchronous Turn Stacking · Worktree Isolated Metodologies (ODD, SDD, EDD, TDD)</text>
    </g>

    <!-- Queued Messages Stack -->
    <g transform="translate(24, 75)">
      <rect x="0" y="0" width="677" height="180" rx="12" fill="#0a0e17" stroke="#202b3f"/>
      <g transform="translate(16, 16)">
        <text x="0" y="12" fill="#f59e0b" class="mono-font" font-size="11" font-weight="700">● ASYNC QUEUED MESSAGES (2 EN COLA)</text>
        
        <!-- Queue Card 1 -->
        <g transform="translate(0, 26)">
          <rect x="0" y="0" width="645" height="56" rx="8" fill="#0c1220" stroke="#202b3f"/>
          <rect x="10" y="10" width="24" height="18" rx="4" fill="#78350f" fill-opacity="0.4"/>
          <text x="16" y="23" fill="#fbbf24" class="mono-font" font-size="10" font-weight="700">#1</text>
          
          <text x="42" y="23" fill="#f8fafc" class="body-font" font-size="11" font-weight="600">Revisar cobertura de pruebas unitarias en /tests/flows.test.ts</text>
          <text x="42" y="42" fill="#64748b" class="mono-font" font-size="9">Adjuntos: flows.test.ts (21 kb) · Se despacha al finalizar turno actual</text>
          
          <circle cx="625" cy="28" r="8" fill="#162035"/>
          <text x="621" y="32" fill="#f87171" class="mono-font" font-size="11">✕</text>
        </g>

        <!-- Queue Card 2 -->
        <g transform="translate(0, 92)">
          <rect x="0" y="0" width="645" height="56" rx="8" fill="#0c1220" stroke="#202b3f"/>
          <rect x="10" y="10" width="24" height="18" rx="4" fill="#78350f" fill-opacity="0.4"/>
          <text x="16" y="23" fill="#fbbf24" class="mono-font" font-size="10" font-weight="700">#2</text>

          <text x="42" y="23" fill="#f8fafc" class="body-font" font-size="11" font-weight="600">Ejecutar build de producción de Vite y validar tamaño de chunk</text>
          <text x="42" y="42" fill="#64748b" class="mono-font" font-size="9">Prioridad normal · Auto-resume activo</text>

          <circle cx="625" cy="28" r="8" fill="#162035"/>
          <text x="621" y="32" fill="#f87171" class="mono-font" font-size="11">✕</text>
        </g>
      </g>
    </g>

    <!-- Squad Metodologies Drawer Preview -->
    <g transform="translate(24, 275)">
      <rect x="0" y="0" width="677" height="230" rx="12" fill="#0a0e17" stroke="#202b3f"/>
      <g transform="translate(16, 16)">
        <text x="0" y="12" fill="#c084fc" class="mono-font" font-size="11" font-weight="700">● SQUAD METHODOLOGIES PIPELINE DRAWER</text>
        
        <!-- Template Selection -->
        <g transform="translate(0, 26)">
          <rect x="0" y="0" width="645" height="42" rx="8" fill="#07090e" stroke="#202b3f"/>
          <text x="14" y="25" fill="#94a3b8" class="mono-font" font-size="11">Metodología:</text>
          <text x="110" y="25" fill="#f8fafc" class="mono-font" font-size="11" font-weight="700">TDD Pair (Tester ➔ Desarrollador)</text>
          <rect x="540" y="8" width="95" height="26" rx="6" fill="#162035"/>
          <text x="550" y="25" fill="#38bdf8" class="mono-font" font-size="10">2 AGENTES</text>
        </g>

        <!-- Pipeline Step Chain -->
        <g transform="translate(0, 80)">
          <rect x="0" y="0" width="160" height="44" rx="8" fill="#0c1220" stroke="#10b981" stroke-width="1"/>
          <text x="14" y="26" fill="#34d399" class="mono-font" font-size="11" font-weight="700">1. Tester (TDD)</text>

          <path d="M 172 22 L 200 22" stroke="#10b981" stroke-width="1.8" stroke-dasharray="3,2"/>
          <polygon points="200,19 206,22 200,25" fill="#10b981"/>

          <rect x="218" y="0" width="180" height="44" rx="8" fill="#0c1220" stroke="#06b6d4" stroke-width="1"/>
          <text x="14" y="26" fill="#38bdf8" class="mono-font" font-size="11" font-weight="700">2. Desarrollador</text>

          <path d="M 410 22 L 438 22" stroke="#f59e0b" stroke-width="1.8" stroke-dasharray="3,2"/>
          <polygon points="438,19 444,22 438,25" fill="#f59e0b"/>

          <rect x="456" y="0" width="170" height="44" rx="8" fill="#0c1220" stroke="#f59e0b" stroke-width="1"/>
          <text x="14" y="26" fill="#fbbf24" class="mono-font" font-size="11" font-weight="700">3. Revisor (Merge)</text>
        </g>

        <!-- Safety Checkboxes -->
        <g transform="translate(0, 140)">
          <text x="0" y="14" fill="#34d399" class="mono-font" font-size="10">☑ Trabajar en rama/copia aparte (git worktree aislado)</text>
          <text x="0" y="32" fill="#38bdf8" class="mono-font" font-size="10">☑ Aprobar cada traspaso (checkpoint interactivo humano)</text>
        </g>
      </g>
    </g>
  </g>

  <!-- ==================== BOTTOM ROW: SPEC MATRIX SUMMARY ==================== -->
  <g transform="translate(60, 695)">
    <rect x="0" y="0" width="1480" height="295" rx="16" fill="url(#cardGrad)" stroke="#202b3f" stroke-width="1.2"/>

    <g transform="translate(24, 24)">
      <text x="0" y="0" fill="#f8fafc" class="title-font" font-size="16">Tactical Composer Feature Interaction &amp; Accessibility Specs</text>
      <text x="0" y="18" fill="#64748b" class="mono-font" font-size="11">Complete verification metrics and architectural breakdown for Composer v2</text>

      <!-- 3 Detail Panels -->
      <g transform="translate(0, 36)">
        <!-- Panel 1 -->
        <g transform="translate(0, 0)">
          <rect x="0" y="0" width="455" height="150" rx="10" fill="#0a0e17" stroke="#202b3f"/>
          <text x="20" y="30" fill="#38bdf8" class="mono-font" font-size="12" font-weight="700">01. SHORTCUTS &amp; SEND LOGIC</text>
          <text x="20" y="55" fill="#cbd5e1" class="body-font" font-size="11">Alternador inteligente Ctrl+Enter / Enter configurable en localStorage. Esc detiene el turno activo inmediatamente.</text>
          <text x="20" y="125" fill="#10b981" class="mono-font" font-size="10">● Escape Handlers Integrados</text>
        </g>

        <!-- Panel 2 -->
        <g transform="translate(488, 0)">
          <rect x="0" y="0" width="455" height="150" rx="10" fill="#0a0e17" stroke="#202b3f"/>
          <text x="20" y="30" fill="#10b981" class="mono-font" font-size="12" font-weight="700">02. AUTO-EXPANDING TEXTAREA</text>
          <text x="20" y="55" fill="#cbd5e1" class="body-font" font-size="11">El área de texto ajusta automáticamente su altura hasta 240px según el contenido escrito, conservando el scroll interno.</text>
          <text x="20" y="125" fill="#10b981" class="mono-font" font-size="10">● Zero Layout Distortions</text>
        </g>

        <!-- Panel 3 -->
        <g transform="translate(976, 0)">
          <rect x="0" y="0" width="455" height="150" rx="10" fill="#0a0e17" stroke="#202b3f"/>
          <text x="20" y="30" fill="#c084fc" class="mono-font" font-size="12" font-weight="700">03. DRAG &amp; DROP VISUAL ZONE</text>
          <text x="20" y="55" fill="#cbd5e1" class="body-font" font-size="11">Arrastrar archivos al compositor ilumina el contorno en resplandor cian discontinuo, aceptando capturas y código fuente.</text>
          <text x="20" y="125" fill="#10b981" class="mono-font" font-size="10">● HTML5 Drag &amp; Drop Nativo</text>
        </g>
      </g>
    </g>
  </g>

  <!-- Footer -->
  <g transform="translate(60, 1015)">
    <text x="0" y="0" fill="#64748b" class="mono-font" font-size="10">AGENTHUB TACTICAL HUD ARCHITECTURE · SPEC CARD #57 · MULTIMODAL COMPOSER V2</text>
    <text x="1480" y="0" text-anchor="end" fill="#64748b" class="mono-font" font-size="10">CERTIFIED ZERO REGRESSIONS · WCAG 2.2 AAA CONFORMANT · 60 FPS ENGINE</text>
  </g>
</svg>
