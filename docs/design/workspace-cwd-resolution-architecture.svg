<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 650" width="100%" height="100%" style="background:#07090e; font-family: Inter, system-ui, -apple-system, sans-serif;">
  <defs>
    <!-- Background Radial Gradient -->
    <radialGradient id="bgGlow" cx="50%" cy="40%" r="75%">
      <stop offset="0%" stop-color="#0c172a" stop-opacity="0.7" />
      <stop offset="60%" stop-color="#090d16" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#07090e" stop-opacity="1" />
    </radialGradient>

    <!-- Tactical Grid Pattern -->
    <pattern id="tacticalGrid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#162035" stroke-width="0.8" stroke-opacity="0.4"/>
      <circle cx="0" cy="0" r="1.2" fill="#202b3f"/>
    </pattern>

    <!-- Glow Filters -->
    <filter id="glowCyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="glowEmerald" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="glowRose" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Linear Gradients -->
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0d1526" />
      <stop offset="100%" stop-color="#090e1a" />
    </linearGradient>

    <linearGradient id="alertGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#241017" />
      <stop offset="100%" stop-color="#14090e" />
    </linearGradient>

    <linearGradient id="successGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#06251e" />
      <stop offset="100%" stop-color="#041410" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1000" height="650" fill="url(#bgGlow)" />
  <rect width="1000" height="650" fill="url(#tacticalGrid)" />

  <!-- Corner HUD brackets -->
  <path d="M 24 40 L 24 24 L 40 24" fill="none" stroke="#06b6d4" stroke-width="2" opacity="0.6"/>
  <path d="M 976 40 L 976 24 L 960 24" fill="none" stroke="#06b6d4" stroke-width="2" opacity="0.6"/>
  <path d="M 24 610 L 24 626 L 40 626" fill="none" stroke="#06b6d4" stroke-width="2" opacity="0.6"/>
  <path d="M 976 610 L 976 626 L 960 626" fill="none" stroke="#06b6d4" stroke-width="2" opacity="0.6"/>

  <!-- Header HUD -->
  <g transform="translate(40, 36)">
    <rect x="0" y="0" width="12" height="12" fill="#06b6d4" rx="2" filter="url(#glowCyan)"/>
    <text x="22" y="11" fill="#f8fafc" font-size="16" font-weight="700" letter-spacing="0.5">WORKSPACE CWD RESOLUTION &amp; ISOLATION ARCHITECTURE</text>
    <text x="22" y="27" fill="#64748b" font-size="11" font-family="JetBrains Mono, monospace">SYS-AUDIT // SPEC: AGENT-HUB WORKSPACE ISOLATION &amp; ANTI-SYSTEM32 PROTOCOL</text>
    <rect x="760" y="2" width="160" height="24" fill="#0c182b" stroke="#202b3f" rx="4"/>
    <circle cx="774" cy="14" r="4" fill="#10b981" filter="url(#glowEmerald)"/>
    <text x="786" y="18" fill="#38bdf8" font-size="10" font-weight="600" font-family="JetBrains Mono, monospace">STATUS: ENFORCED</text>
  </g>

  <!-- LEFT: Trigger & Vulnerability Vector -->
  <g transform="translate(40, 90)">
    <!-- Trigger Card -->
    <rect x="0" y="0" width="280" height="150" fill="url(#cardGrad)" stroke="#202b3f" stroke-width="1.2" rx="8" />
    <rect x="0" y="0" width="280" height="3" fill="#06b6d4" rx="1.5" />
    
    <text x="16" y="28" fill="#38bdf8" font-size="12" font-weight="700" font-family="JetBrains Mono, monospace">01 // FLOW INITIATION</text>
    <text x="16" y="52" fill="#f1f5f9" font-size="13" font-weight="600">Disparo de Flujo / Pipeline</text>
    <text x="16" y="72" fill="#94a3b8" font-size="11" line-height="16">
      <tspan x="16" dy="0">• Comando `/pipeline` o `/loop`</tspan>
      <tspan x="16" dy="18">• `startPipeline` desde Composer</tspan>
      <tspan x="16" dy="18">• `spawnAgents` para nuevo Squad</tspan>
      <tspan x="16" dy="18">• Disparo autónomo vía CLI Handoff</tspan>
    </text>

    <!-- Blocked Vulnerability Card -->
    <g transform="translate(0, 170)">
      <rect x="0" y="0" width="280" height="175" fill="url(#alertGrad)" stroke="#ef4444" stroke-width="1.2" rx="8" />
      <rect x="0" y="0" width="280" height="3" fill="#ef4444" rx="1.5" />
      
      <circle cx="20" cy="24" r="5" fill="#ef4444" filter="url(#glowRose)"/>
      <text x="32" y="28" fill="#f87171" font-size="11" font-weight="700" font-family="JetBrains Mono, monospace">BLOCKED ANOMALY</text>
      <text x="16" y="52" fill="#fecaca" font-size="12" font-weight="600">Fuga hacia System32 / AppData</text>
      
      <rect x="16" y="64" width="248" height="42" fill="#180a10" stroke="#7f1d1d" rx="4"/>
      <text x="24" y="80" fill="#f87171" font-size="10" font-family="JetBrains Mono, monospace">process.cwd() en Electron Windows</text>
      <text x="24" y="96" fill="#fca5a5" font-size="10" font-family="JetBrains Mono, monospace">-> C:\Windows\System32</text>
      
      <text x="16" y="124" fill="#fca5a5" font-size="10.5">
        <tspan x="16" dy="0">Filtro `isSystemOrAppDir()` intercepta</tspan>
        <tspan x="16" dy="16">cualquier ruta de Windows, System32 o</tspan>
        <tspan x="16" dy="16">instalador de AgentHub antes de ejecutar.</tspan>
      </text>
    </g>

    <!-- Anti-Drift Guard Badge -->
    <g transform="translate(0, 365)">
      <rect x="0" y="0" width="280" height="155" fill="url(#cardGrad)" stroke="#10b981" stroke-dasharray="4 2" stroke-width="1" rx="8"/>
      <text x="16" y="26" fill="#34d399" font-size="11" font-weight="700" font-family="JetBrains Mono, monospace">GUARDIA DE INTEGRIDAD</text>
      <text x="16" y="48" fill="#e2e8f0" font-size="12" font-weight="600">Herencia de Workspace Activo</text>
      <text x="16" y="70" fill="#94a3b8" font-size="10.5">
        <tspan x="16" dy="0">El pipeline y squad NUNCA pierden el</tspan>
        <tspan x="16" dy="16">contexto de la sesión actual.</tspan>
        <tspan x="16" dy="18">Si la sesión pertenece a un repo:</tspan>
        <tspan x="16" dy="16" fill="#38bdf8" font-family="JetBrains Mono, monospace">• projectPath: active.projectPath</tspan>
        <tspan x="16" dy="16" fill="#38bdf8" font-family="JetBrains Mono, monospace">• projectName: active.projectName</tspan>
      </text>
    </g>
  </g>

  <!-- CONNECTOR 1 -> 2 -->
  <path d="M 320 165 L 355 165 L 355 220 L 375 220" fill="none" stroke="#06b6d4" stroke-width="2" stroke-dasharray="4 4"/>
  <polygon points="375,220 367,216 367,224" fill="#06b6d4"/>

  <!-- CENTER: Cascading Directory Resolution Engine -->
  <g transform="translate(380, 90)">
    <rect x="0" y="0" width="310" height="430" fill="url(#cardGrad)" stroke="#0ea5e9" stroke-width="1.2" rx="8" />
    <rect x="0" y="0" width="310" height="3" fill="#38bdf8" rx="1.5" />
    
    <text x="16" y="28" fill="#38bdf8" font-size="12" font-weight="700" font-family="JetBrains Mono, monospace">02 // RESOLUTION CASCADE</text>
    <text x="16" y="50" fill="#f8fafc" font-size="13" font-weight="600">Cascada Jerárquica de Asignación</text>

    <!-- Level 1: Project Path Explicit -->
    <g transform="translate(16, 65)">
      <rect x="0" y="0" width="278" height="52" fill="#0b172b" stroke="#202b3f" rx="6"/>
      <circle cx="16" cy="18" r="8" fill="#0284c7"/>
      <text x="13" y="22" fill="#ffffff" font-size="10" font-weight="700">1</text>
      <text x="32" y="18" fill="#e2e8f0" font-size="11" font-weight="600">Ruta por Nombre de Proyecto</text>
      <text x="32" y="34" fill="#64748b" font-size="9.5" font-family="JetBrains Mono, monospace">hub.sessions.projectPath(name)</text>
    </g>

    <!-- Level 2: Active Session Directory -->
    <g transform="translate(16, 125)">
      <rect x="0" y="0" width="278" height="52" fill="#0b172b" stroke="#06b6d4" stroke-width="1.2" rx="6"/>
      <circle cx="16" cy="18" r="8" fill="#06b6d4" filter="url(#glowCyan)"/>
      <text x="13" y="22" fill="#07090e" font-size="10" font-weight="800">2</text>
      <text x="32" y="18" fill="#38bdf8" font-size="11" font-weight="700">Carpeta de Sesión Activa (Prioridad)</text>
      <text x="32" y="34" fill="#94a3b8" font-size="9.5" font-family="JetBrains Mono, monospace">current.isolatedBase ?? current.projectPath</text>
    </g>

    <!-- Level 3: Active Project Name -->
    <g transform="translate(16, 185)">
      <rect x="0" y="0" width="278" height="52" fill="#0b172b" stroke="#202b3f" rx="6"/>
      <circle cx="16" cy="18" r="8" fill="#475569"/>
      <text x="13" y="22" fill="#ffffff" font-size="10" font-weight="700">3</text>
      <text x="32" y="18" fill="#cbd5e1" font-size="11" font-weight="600">Proyecto de Sesión Activa</text>
      <text x="32" y="34" fill="#64748b" font-size="9.5" font-family="JetBrains Mono, monospace">hub.sessions.projectPath(current.projectName)</text>
    </g>

    <!-- Level 4: Workspace Folder -->
    <g transform="translate(16, 245)">
      <rect x="0" y="0" width="278" height="52" fill="#0b172b" stroke="#202b3f" rx="6"/>
      <circle cx="16" cy="18" r="8" fill="#475569"/>
      <text x="13" y="22" fill="#ffffff" font-size="10" font-weight="700">4</text>
      <text x="32" y="18" fill="#cbd5e1" font-size="11" font-weight="600">Carpeta de Trabajo VS Code / Host</text>
      <text x="32" y="34" fill="#64748b" font-size="9.5" font-family="JetBrains Mono, monospace">workspaceDir() [Validada no-sistema]</text>
    </g>

    <!-- Level 5: Recent Workspaces -->
    <g transform="translate(16, 305)">
      <rect x="0" y="0" width="278" height="52" fill="#0b172b" stroke="#202b3f" rx="6"/>
      <circle cx="16" cy="18" r="8" fill="#475569"/>
      <text x="13" y="22" fill="#ffffff" font-size="10" font-weight="700">5</text>
      <text x="32" y="18" fill="#cbd5e1" font-size="11" font-weight="600">Historial Reciente de Proyectos</text>
      <text x="32" y="34" fill="#64748b" font-size="9.5" font-family="JetBrains Mono, monospace">getRecentWorkspaces()[0] (~/.agent-hub)</text>
    </g>

    <!-- Level 6: Safe Home Fallback -->
    <g transform="translate(16, 365)">
      <rect x="0" y="0" width="278" height="50" fill="#0b172b" stroke="#202b3f" rx="6"/>
      <circle cx="16" cy="18" r="8" fill="#334155"/>
      <text x="13" y="22" fill="#ffffff" font-size="10" font-weight="700">6</text>
      <text x="32" y="18" fill="#94a3b8" font-size="11" font-weight="600">Respaldo Seguro de Usuario</text>
      <text x="32" y="34" fill="#64748b" font-size="9.5" font-family="JetBrains Mono, monospace">os.homedir() [Nunca System32]</text>
    </g>
  </g>

  <!-- CONNECTOR 2 -> 3 -->
  <path d="M 690 280 L 715 280 L 715 220 L 735 220" fill="none" stroke="#10b981" stroke-width="2" stroke-dasharray="4 4"/>
  <polygon points="735,220 727,216 727,224" fill="#10b981"/>

  <!-- RIGHT: Squad Propagation & Execution Guarantee -->
  <g transform="translate(740, 90)">
    <rect x="0" y="0" width="220" height="430" fill="url(#cardGrad)" stroke="#10b981" stroke-width="1.2" rx="8" />
    <rect x="0" y="0" width="220" height="3" fill="#10b981" rx="1.5" />
    
    <text x="16" y="28" fill="#34d399" font-size="12" font-weight="700" font-family="JetBrains Mono, monospace">03 // EXEC GUARANTEE</text>
    <text x="16" y="50" fill="#f8fafc" font-size="13" font-weight="600">Ejecución de Agentes</text>

    <!-- Squad Member Chips -->
    <g transform="translate(14, 68)">
      <rect x="0" y="0" width="192" height="60" fill="#061f18" stroke="#047857" rx="6"/>
      <text x="10" y="18" fill="#34d399" font-size="10.5" font-weight="700" font-family="JetBrains Mono, monospace">ARQUITECTO (Lead)</text>
      <text x="10" y="34" fill="#e2e8f0" font-size="9.5" font-family="JetBrains Mono, monospace">cwd: repo/ (o worktree)</text>
      <rect x="10" y="42" width="55" height="12" fill="#047857" rx="2"/>
      <text x="15" y="51" fill="#ecfdf5" font-size="8" font-weight="700">ASSIGNED</text>
    </g>

    <g transform="translate(14, 136)">
      <rect x="0" y="0" width="192" height="60" fill="#061f18" stroke="#047857" rx="6"/>
      <text x="10" y="18" fill="#34d399" font-size="10.5" font-weight="700" font-family="JetBrains Mono, monospace">DESARROLLADOR</text>
      <text x="10" y="34" fill="#e2e8f0" font-size="9.5" font-family="JetBrains Mono, monospace">cwd: repo/ (o worktree)</text>
      <rect x="10" y="42" width="55" height="12" fill="#047857" rx="2"/>
      <text x="15" y="51" fill="#ecfdf5" font-size="8" font-weight="700">ASSIGNED</text>
    </g>

    <g transform="translate(14, 204)">
      <rect x="0" y="0" width="192" height="60" fill="#061f18" stroke="#047857" rx="6"/>
      <text x="10" y="18" fill="#34d399" font-size="10.5" font-weight="700" font-family="JetBrains Mono, monospace">REVISOR / TESTER</text>
      <text x="10" y="34" fill="#e2e8f0" font-size="9.5" font-family="JetBrains Mono, monospace">cwd: repo/ (o worktree)</text>
      <rect x="10" y="42" width="55" height="12" fill="#047857" rx="2"/>
      <text x="15" y="51" fill="#ecfdf5" font-size="8" font-weight="700">ASSIGNED</text>
    </g>

    <!-- chat-service.ts Runtime Guard Box -->
    <g transform="translate(14, 276)">
      <rect x="0" y="0" width="192" height="138" fill="#0c172a" stroke="#38bdf8" stroke-dasharray="3 3" rx="6"/>
      <text x="10" y="20" fill="#38bdf8" font-size="10" font-weight="700" font-family="JetBrains Mono, monospace">RUNTIME DISPATCH</text>
      <text x="10" y="38" fill="#f8fafc" font-size="10.5" font-weight="600">ChatService.send()</text>
      <text x="10" y="56" fill="#94a3b8" font-size="9.5" line-height="14">
        <tspan x="10" dy="0">Antes de llamar al</tspan>
        <tspan x="10" dy="14">proveedor de CLI,</tspan>
        <tspan x="10" dy="14" fill="#34d399">session.projectPath</tspan>
        <tspan x="10" dy="14">toma prioridad absoluta</tspan>
        <tspan x="10" dy="14">sobre cualquier fallback.</tspan>
      </text>
    </g>
  </g>

  <!-- Bottom HUD Summary Bar -->
  <g transform="translate(40, 540)">
    <rect x="0" y="0" width="920" height="74" fill="#0a0f1d" stroke="#202b3f" rx="8"/>
    <rect x="0" y="0" width="4" height="74" fill="#06b6d4" rx="2"/>
    
    <text x="24" y="26" fill="#f8fafc" font-size="12" font-weight="700">VERIFICACIÓN Y COBERTURA DE SEGURIDAD</text>
    <text x="24" y="46" fill="#94a3b8" font-size="11">
      Todos los flujos (`startPipeline`, `spawnAgents`, `createSession`, `resumeQueue` y traspasos de agente) quedan garantizados contra fugas a directorios de sistema.
    </text>
    <text x="24" y="62" fill="#34d399" font-size="10.5" font-family="JetBrains Mono, monospace">
      ✔ 14/14 Tests passing // isSystemOrAppDir (Windows, System32, Program Files, AppData/Local/Programs/AgentHub blindados)
    </text>
  </g>
</svg>