<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AgentHub HUD — Scratchpad Drawer & Branch Manager Redesign</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: #05070c;
    }
    .font-mono {
      font-family: 'JetBrains Mono', monospace;
    }
    .hud-glow {
      box-shadow: 0 0 35px -5px rgba(245, 158, 11, 0.2), 0 0 15px -3px rgba(99, 102, 241, 0.15);
    }
  </style>
</head>
<body class="min-h-screen text-slate-100 flex items-center justify-center p-6 antialiased bg-[radial-gradient(ellipse_at_top,_var(--tw-gradient-stops))] from-[#0d1527] via-[#07090e] to-[#040508]">

  <div class="w-full max-w-6xl grid grid-cols-1 lg:grid-cols-2 gap-6 items-start">
    
    <!-- LEFT: Scratchpad Drawer Preview -->
    <div class="bg-[#0e131f] border border-[#202b3f] rounded-2xl shadow-2xl overflow-hidden flex flex-col h-[640px]">
      
      <!-- Drawer Header -->
      <div class="flex items-center justify-between p-3.5 border-b border-[#202b3f] bg-[#0a0d16]/95 backdrop-blur-md shrink-0">
        <div class="flex items-center gap-2.5">
          <div class="p-1.5 rounded-lg bg-amber-500/15 border border-amber-500/30 text-amber-400">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path>
            </svg>
          </div>
          <div>
            <h2 class="text-xs font-bold text-white tracking-wide uppercase flex items-center gap-2">
              Borrador Táctico
              <span class="px-1.5 py-0.2 rounded font-mono text-[9px] bg-[#131927] text-amber-300 border border-[#202b3f]">scratchpad.md</span>
            </h2>
          </div>
        </div>

        <!-- Toolbar Quick Actions -->
        <div class="flex items-center gap-1.5">
          <button class="p-1.5 rounded-lg bg-[#131927] hover:bg-slate-700 text-slate-400 hover:text-emerald-300 border border-[#202b3f] transition-colors cursor-pointer" title="Añadir tarea (- [ ])">
            <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-6 9l2 2 4-4"></path>
            </svg>
          </button>
          
          <button class="p-1.5 rounded-lg bg-[#131927] hover:bg-slate-700 text-slate-400 hover:text-white border border-[#202b3f] transition-colors cursor-pointer" title="Copiar notas">
            <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 5H6a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2v-1M8 5a2 2 0 002 2h2a2 2 0 002-2M8 5a2 2 0 012-2h2a2 2 0 012 2m0 0h2a2 2 0 012 2v3m2 4H10m0 0l3-3m-3 3l3 3"></path>
            </svg>
          </button>

          <span class="px-2 py-1 rounded-md text-[10px] font-mono font-semibold bg-emerald-950/40 text-emerald-300 border border-emerald-800/40 flex items-center gap-1">
            <span class="w-1.5 h-1.5 rounded-full bg-emerald-400"></span>
            Guardado
          </span>
        </div>
      </div>

      <!-- Editor Textarea Area -->
      <div class="flex-1 p-3 bg-[#05070c] flex flex-col">
        <textarea 
          class="flex-1 w-full p-2.5 bg-transparent border border-[#202b3f]/60 rounded-xl text-slate-200 font-mono text-xs resize-none focus:outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500/30 leading-relaxed placeholder-slate-600 selection:bg-indigo-600/40"
          placeholder="Escribe notas, checklists o requerimientos temporales..."
        >## Tareas de la Iteración 10

- [x] Rediseñar CommandPalette con filtros de categoría
- [x] Elevar InteractiveDiffModal Split/Unified
- [ ] Pulir ScratchpadDrawer táctico con atajo rápido
- [ ] Actualizar BranchManagerModal Git/Worktree

// Contexto técnico para enviar al agente:
El frontend está compilando en 1.99s con Vite 5.4.
Verificar que los atajos Ctrl+Enter y Ctrl+S respondan sin latencia.</textarea>
      </div>

      <!-- Drawer Footer Action -->
      <div class="p-3 border-t border-[#202b3f] bg-[#0a0d16] flex items-center justify-between gap-2 shrink-0">
        <span class="text-[10px] text-slate-400 font-mono">
          42 palabras · 368 car.
        </span>
        <button class="flex items-center gap-1.5 px-3 py-1.5 rounded-xl bg-gradient-to-r from-indigo-600 to-indigo-500 hover:from-indigo-500 hover:to-indigo-400 text-white text-xs font-semibold shadow-md shadow-indigo-950/50 transition cursor-pointer">
          <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8"></path>
          </svg>
          <span>Enviar al Agente</span>
          <kbd class="px-1.5 py-0.2 rounded text-[9px] font-mono bg-[#07090e]/60 text-indigo-200">Ctrl+↵</kbd>
        </button>
      </div>
    </div>


    <!-- RIGHT: Branch Manager Modal Preview -->
    <div class="bg-[#0e131f] border border-[#202b3f] rounded-2xl shadow-2xl overflow-hidden flex flex-col h-[640px]">
      
      <!-- Modal Header -->
      <div class="flex items-center justify-between p-3.5 border-b border-[#202b3f] bg-[#0a0d16]/95 backdrop-blur-md shrink-0">
        <div class="flex items-center gap-2.5">
          <div class="p-1.5 rounded-lg bg-emerald-500/15 border border-emerald-500/30 text-emerald-400">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 20l4-16m4 4l4 4-4 4M6 16l-4-4 4-4"></path>
            </svg>
          </div>
          <div>
            <h2 class="text-xs font-bold text-white tracking-wide uppercase flex items-center gap-2">
              Gestor de Ramas Git & Worktrees
            </h2>
          </div>
        </div>

        <button class="p-1.5 rounded-lg text-slate-400 hover:text-white hover:bg-[#131927] border border-transparent hover:border-[#202b3f] transition-colors cursor-pointer">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
          </svg>
        </button>
      </div>

      <!-- Active Branch Card -->
      <div class="p-4 space-y-3 flex-1 overflow-y-auto">
        <div class="flex items-center justify-between p-3 rounded-xl bg-[#131927] border border-emerald-500/40 shadow-sm">
          <div class="flex items-center gap-3">
            <span class="w-2.5 h-2.5 rounded-full bg-emerald-400 animate-pulse shadow-[0_0_8px_rgba(52,211,153,0.8)]"></span>
            <div>
              <p class="text-[10px] font-mono text-slate-400 uppercase font-semibold">Rama Activa del Espacio de Trabajo</p>
              <h3 class="text-xs font-mono font-bold text-white mt-0.5">feature/tactical-hud-v2</h3>
            </div>
          </div>
          <span class="px-2 py-0.5 rounded-md font-mono text-[10px] font-bold bg-emerald-950/50 text-emerald-300 border border-emerald-800/40">
            HEAD
          </span>
        </div>

        <!-- Filter & Add Bar -->
        <div class="flex items-center gap-2 pt-1">
          <div class="relative flex-1">
            <svg class="w-3.5 h-3.5 text-cyan-400 absolute left-3 top-1/2 -translate-y-1/2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
            </svg>
            <input 
              type="text" 
              placeholder="Filtrar ramas locales o remotas..." 
              class="w-full bg-[#07090e] border border-[#202b3f] rounded-xl pl-8 pr-3 py-1.5 text-xs text-white placeholder-slate-500 focus:outline-none focus:border-indigo-500 font-mono"
            />
          </div>
          <button class="flex items-center gap-1.5 px-3 py-1.5 rounded-xl bg-indigo-600/20 hover:bg-indigo-600/35 text-indigo-300 border border-indigo-500/40 text-xs font-mono font-semibold transition cursor-pointer">
            <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path>
            </svg>
            <span>+ Rama</span>
          </button>
        </div>

        <!-- Branch List -->
        <div class="space-y-1.5 pt-2">
          
          <!-- Branch 1 (Squad Worktree) -->
          <div class="flex items-center justify-between p-2.5 rounded-xl bg-[#0a0d16] hover:bg-[#131927]/80 border border-[#202b3f] transition-all group">
            <div class="flex items-center gap-2 min-w-0">
              <span class="px-1.5 py-0.2 rounded text-[9px] font-mono font-bold bg-indigo-950/60 text-indigo-300 border border-indigo-800/40 uppercase shrink-0">
                Squad
              </span>
              <span class="text-xs font-mono font-semibold text-slate-200 group-hover:text-white truncate">
                squad/design-system-audit
              </span>
            </div>
            <div class="flex items-center gap-1.5 shrink-0">
              <button class="px-2.5 py-1 rounded-lg bg-[#131927] hover:bg-[#1c2638] text-cyan-300 border border-[#202b3f] text-xs font-mono font-semibold transition cursor-pointer">
                Checkout
              </button>
            </div>
          </div>

          <!-- Branch 2 (Main) -->
          <div class="flex items-center justify-between p-2.5 rounded-xl bg-[#0a0d16] hover:bg-[#131927]/80 border border-[#202b3f] transition-all group">
            <div class="flex items-center gap-2 min-w-0">
              <span class="px-1.5 py-0.2 rounded text-[9px] font-mono font-bold bg-emerald-950/60 text-emerald-300 border border-emerald-800/40 uppercase shrink-0">
                Base
              </span>
              <span class="text-xs font-mono font-semibold text-slate-200 group-hover:text-white truncate">
                main
              </span>
            </div>
            <div class="flex items-center gap-1.5 shrink-0">
              <button class="px-2.5 py-1 rounded-lg bg-[#131927] hover:bg-[#1c2638] text-slate-300 hover:text-white border border-[#202b3f] text-xs font-mono font-semibold transition cursor-pointer">
                Checkout
              </button>
            </div>
          </div>

          <!-- Branch 3 (Feature) -->
          <div class="flex items-center justify-between p-2.5 rounded-xl bg-[#0a0d16] hover:bg-[#131927]/80 border border-[#202b3f] transition-all group">
            <div class="flex items-center gap-2 min-w-0">
              <span class="px-1.5 py-0.2 rounded text-[9px] font-mono font-bold bg-cyan-950/60 text-cyan-300 border border-cyan-800/40 uppercase shrink-0">
                Feat
              </span>
              <span class="text-xs font-mono font-semibold text-slate-200 group-hover:text-white truncate">
                feature/context-window-gauge
              </span>
            </div>
            <div class="flex items-center gap-1.5 shrink-0">
              <button class="px-2.5 py-1 rounded-lg bg-[#131927] hover:bg-[#1c2638] text-slate-300 hover:text-white border border-[#202b3f] text-xs font-mono font-semibold transition cursor-pointer">
                Checkout
              </button>
            </div>
          </div>

        </div>
      </div>

      <!-- Modal Footer -->
      <div class="p-3 border-t border-[#202b3f] bg-[#0a0d16] flex items-center justify-between text-[11px] font-mono text-slate-400 shrink-0">
        <div class="flex items-center gap-2">
          <span class="w-1.5 h-1.5 rounded-full bg-emerald-400"></span>
          <span>3 ramas locales detectadas</span>
        </div>
        <button class="hover:text-cyan-300 cursor-pointer transition-colors">
          ↻ Refrescar
        </button>
      </div>

    </div>

  </div>

</body>
</html>
