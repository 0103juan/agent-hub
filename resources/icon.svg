<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#12131f" />
      <stop offset="50%" stop-color="#0a0a0f" />
      <stop offset="100%" stop-color="#050508" />
    </linearGradient>

    <!-- Border Glow -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818cf8" stop-opacity="0.6" />
      <stop offset="50%" stop-color="#4f46e5" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0.5" />
    </linearGradient>

    <!-- Core Nexus Gradients -->
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="35%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>

    <linearGradient id="leftBeam" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#4f46e5" />
    </linearGradient>

    <linearGradient id="rightBeam" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>

    <radialGradient id="coreGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#67e8f9" stop-opacity="0.9" />
      <stop offset="40%" stop-color="#6366f1" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0" />
    </radialGradient>

    <!-- Filter for subtle bloom -->
    <filter id="bloom" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Container Base: Modern rounded squircle -->
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="4" />

  <!-- Ambient Glow Behind Icon Glyph -->
  <circle cx="256" cy="256" r="140" fill="url(#coreGlow)" />

  <!-- Central Nexus Structure: Geometric Tri-Agent Orchestration Pyramid / Hub -->
  <g filter="url(#bloom)">
    <!-- Top Apex Node (Orchestrator Apex) -->
    <circle cx="256" cy="116" r="22" fill="#38bdf8" />
    <circle cx="256" cy="116" r="10" fill="#ffffff" />

    <!-- Left Agent Node (Claude / Subscriptions) -->
    <circle cx="132" cy="330" r="22" fill="#06b6d4" />
    <circle cx="132" cy="330" r="10" fill="#ffffff" />

    <!-- Right Agent Node (Antigravity / MCPs) -->
    <circle cx="380" cy="330" r="22" fill="#c084fc" />
    <circle cx="380" cy="330" r="10" fill="#ffffff" />

    <!-- Interconnecting Neural Beams (The "A" & "H" Architecture) -->
    <!-- Left Leg -->
    <path d="M 256 126 L 140 326" stroke="url(#leftBeam)" stroke-width="20" stroke-linecap="round" />
    <!-- Right Leg -->
    <path d="M 256 126 L 372 326" stroke="url(#rightBeam)" stroke-width="20" stroke-linecap="round" />

    <!-- Central Orchestrator Bridge (The Hub Crossbar) -->
    <path d="M 188 238 L 324 238" stroke="url(#primaryGrad)" stroke-width="18" stroke-linecap="round" />

    <!-- Inner Core Singularity / Hexagonal Nexus -->
    <polygon points="256,206 284,222 284,254 256,270 228,254 228,222" fill="#090a14" stroke="url(#primaryGrad)" stroke-width="6" />

    <!-- Center Pulse Point -->
    <circle cx="256" cy="238" r="8" fill="#ffffff" />

    <!-- Bottom Downlink Anchor (Local Tools & MCP Bridge) -->
    <path d="M 256 270 L 256 384" stroke="url(#primaryGrad)" stroke-width="12" stroke-linecap="round" stroke-dasharray="1 24" />
    <circle cx="256" cy="392" r="14" fill="#6366f1" />
    <circle cx="256" cy="392" r="6" fill="#ffffff" />
  </g>
</svg>
